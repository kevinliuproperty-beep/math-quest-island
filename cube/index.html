<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Quest Studio</title>
<style>
  :root {
    --ink: #1c1b1a;
    --soft: #6b675f;
    --paper: #ffffff;
    --line: #d9d4cb;
    --yellow: #ffd500;
    --green: #009e60;
    --blue: #0051ba;
    --red: #c41e3a;
    --orange: #ff5800;
    --wash: #faf7f0;
    --hilite: #a8d4ff;
    --pale: #f3f1ec;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #e8e4dc;
    font-size: 15px;
    line-height: 1.45;
    padding: 12px;
  }
  /* iPad: one tap means one tap, and never the zoom-in wobble */
  button, .swatch, .sticker, .pad, .mess, nav.tabs button, .stage {
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(168, 212, 255, .4);
  }
  button, .pad, .swatch { min-height: 46px; }
  .round { font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif; }
  h1, h2, h3 { font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif; font-weight: 800; }

  .wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 12px; }

  /* ---------- header ---------- */
  header.app-head {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 14px;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
  header.app-head h1 { font-size: 26px; line-height: 1.05; letter-spacing: -.02em; margin-top: 2px; }
  header.app-head .sub { font-size: 13.5px; color: var(--soft); font-weight: 600; margin-top: 3px; }
  .cube-row { display: flex; gap: 6px; }
  .cube-row span { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--ink); display: block; }

  /* ---------- tabs ---------- */
  nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  nav.tabs button {
    font: inherit; font-weight: 700; cursor: pointer;
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 11px; padding: 9px 15px;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-size: 15px;
  }
  nav.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  nav.tabs button:focus-visible, .btn:focus-visible, .pad:focus-visible, .sticker:focus-visible { outline: 3px solid var(--hilite); outline-offset: 2px; }

  /* ---------- layout ---------- */
  .studio { display: grid; grid-template-columns: minmax(330px, 430px) 1fr; gap: 12px; align-items: start; }
  @media (max-width: 900px) { .studio { grid-template-columns: 1fr; } }
  .stage-col, .panel-col { display: grid; gap: 12px; align-content: start; }

  .card {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px;
  }
  .card > h2 { font-size: 17px; margin-bottom: 6px; }
  .card .lede { font-size: 14px; color: var(--soft); font-weight: 600; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }

  /* ---------- 3D stage ---------- */
  .stage-card { padding: 10px 12px 12px; }
  .stage {
    height: 348px; display: grid; place-items: center;
    perspective: 950px; perspective-origin: 50% 44%;
    background: var(--wash); border-radius: 11px; border: 1.5px solid var(--line);
    /* pan-y, not none: a finger sliding up the page still scrolls the page, and only a
       sideways drag peeks round the cube. touch-action none here would eat the scroll. */
    touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; overflow: hidden;
  }
  .stage.peeking { cursor: grabbing; }
  /* the orientation legend: which side is which, in the words the board uses, always on */
  .stage { position: relative; }
  .legend {
    position: absolute; z-index: 3; pointer-events: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    color: var(--soft); background: rgba(255,255,255,.86); border: 1.5px solid var(--line);
    border-radius: 8px; padding: 5px 8px; min-height: 24px; line-height: 1.15;
  }
  .legend.you { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  .legend.lg-ceiling { top: 8px; left: 50%; transform: translateX(-50%); }
  .legend.lg-floor { bottom: 8px; left: 50%; transform: translateX(-50%); }
  /* the guide draws an EXAMPLE. It must never be mistaken for her own cube, so it is the one
     label on the stage that shouts. */
  .legend.lg-example { top: 8px; left: 8px; color: var(--paper); background: var(--red); border-color: var(--red); max-width: 45%; }
  .legend.lg-you { left: 8px; bottom: 64px; }
  .legend.lg-right { right: 8px; bottom: 64px; }
  /* WebKit note: every element in this chain must keep its 3D context. Nothing here may
     carry overflow, filter, opacity below 1, mask or clip-path, because any of those flatten
     transform-style back to flat on iOS and the cube collapses into a paper square. The
     perspective and the overflow clipping live on .stage, which is outside the chain. */
  .cube3d {
    width: 200px; height: 200px; position: relative;
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.3,.7,.3,1);
  }
  .cube3d.nofade { transition: none; }
  .layer {
    position: absolute; left: 0; top: 0; width: 200px; height: 200px;
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
  }
  .layer.spinning { transition: transform .4s ease-in-out; }
  .cubie {
    position: absolute; left: 50px; top: 50px; width: 100px; height: 100px;
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
  }
  .cubie .face {
    position: absolute; left: 0; top: 0; width: 100px; height: 100px;
    background: #26241f; border-radius: 11px;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .cubie .face.sticker-face { padding: 6px; background: #26241f; }
  .cubie .face.sticker-face i {
    display: block; width: 100%; height: 100%; border-radius: 9px; border: 2px solid rgba(0,0,0,.35);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.10);
  }
  .cubie .face.sticker-face i.glow { box-shadow: 0 0 0 4px var(--hilite), inset 0 -4px 0 rgba(0,0,0,.10); }
  .cubie .face.sticker-face i.dim { filter: saturate(.25) brightness(1.25); }
  .ring {
    position: absolute; left: 62px; top: 62px; width: 76px; height: 76px;
    border: 5px solid var(--red); border-radius: 50%; pointer-events: none;
  }
  /* the big cube: 26 blocks in the same 200px box */
  .cube3d.n3 .cubie { left: 66.67px; top: 66.67px; width: 66.67px; height: 66.67px; }
  .cube3d.n3 .cubie .face { width: 66.67px; height: 66.67px; border-radius: 8px; }
  .cube3d.n3 .cubie .face.sticker-face { padding: 4px; }
  .cube3d.n3 .cubie .face.sticker-face i { border-radius: 6px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.10); }
  .cube3d.n3 .ring { left: 75px; top: 75px; width: 50px; height: 50px; border-width: 4px; }

  /* ---------- cube size switch ---------- */
  .sizeswitch { display: flex; gap: 6px; margin-left: auto; align-items: center; }
  .sizeswitch .tag { align-self: center; }
  .sizeswitch button {
    font: inherit; font-weight: 800; cursor: pointer;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-size: 15px;
    background: var(--wash); color: var(--ink); border: 2px dashed var(--ink);
    border-radius: 11px; padding: 9px 15px;
  }
  .sizeswitch button[aria-pressed="true"] { background: var(--hilite); border-style: solid; }
  .stage-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .grip-note { font-size: 12.5px; color: var(--soft); font-weight: 600; flex: 1 1 160px; }

  /* ---------- buttons ---------- */
  .btn {
    font: inherit; font-weight: 700; cursor: pointer;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    background: var(--paper); color: var(--ink); border: 2px solid var(--ink);
    border-radius: 10px; padding: 7px 12px; font-size: 14px;
  }
  .btn:hover { background: var(--wash); }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: #35322d; }
  .btn.big { font-size: 16px; padding: 10px 16px; }
  .btn[disabled] { opacity: .38; cursor: default; }
  .btn.on { background: var(--hilite); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- move pads ---------- */
  .pads { display: grid; gap: 10px; }
  .padgroup { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; }
  .padgroup > .tag { display: block; margin-bottom: 7px; }
  .padrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  @media (max-width: 420px) { .padrow { grid-template-columns: repeat(4, 1fr); } }
  .pad {
    font: inherit; cursor: pointer; background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 9px; padding: 5px 3px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .pad:hover { background: var(--wash); }
  .pad svg { width: 100%; height: auto; max-width: 46px; display: block; }
  .pad b { font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-size: 13px; font-weight: 800; line-height: 1; }
  .pad small { font-size: 9.3px; font-weight: 600; color: var(--soft); line-height: 1.15; text-align: center; }

  /* ---------- live move tile ---------- */
  .tile-live {
    background: var(--wash); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px;
    display: flex; gap: 12px; align-items: center; min-height: 92px;
  }
  .tile-live svg { width: 68px; height: 68px; flex: 0 0 auto; }
  .tile-live .words { min-width: 0; }
  .tile-live .letter { font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-size: 30px; font-weight: 800; line-height: 1; }
  .tile-live .cap { font-size: 15px; font-weight: 700; margin-top: 3px; }
  .tile-live .who { font-size: 12px; color: var(--soft); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .tile-live.idle .letter { color: var(--soft); font-size: 20px; }

  /* ---------- chant rhythm strip ---------- */
  .chantstrip { background: var(--wash); border: 2px solid var(--ink); border-radius: 12px; padding: 9px 11px; }
  .chantstrip .chant-name { font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-weight: 800; font-size: 15px; }
  .chantstrip .count { font-size: 13px; font-weight: 700; color: var(--red); }
  .beats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .beat {
    border: 1.5px solid var(--ink); border-radius: 7px; background: var(--paper);
    min-width: 30px; padding: 3px 5px; text-align: center;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-weight: 800; font-size: 13px;
  }
  .beat.done { background: #e7efe6; color: var(--soft); }
  .beat.now { background: var(--red); color: var(--paper); border-color: var(--red); transform: scale(1.12); }
  .breath { align-self: center; font-size: 10px; font-weight: 700; color: var(--soft); letter-spacing: .06em; text-transform: uppercase; padding: 0 3px; }
  /* a chant she has mastered plays as one smooth go, so its tiles are one block, not a countdown */
  .chantstrip.smooth .beat { background: #eef7f1; border-color: var(--green); }

  /* ---------- she knows this one ----------
     A grown up's quiet tick, never the app's guess. Nothing in here watches her, times her or
     scores her: a chant counts as mastered because a parent said so, and one more tap un-says it.
     It sits small and out of the way, because it is not a thing she has to decide. */
  .knowline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 7px; }
  .know {
    font: inherit; cursor: pointer; font-size: 12px; font-weight: 700;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    background: var(--paper); color: var(--soft); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 4px 11px; min-height: 30px;
  }
  .know:hover { background: var(--wash); }
  .know.on { background: #eef7f1; border-color: var(--green); color: var(--green); }
  .knowline small { font-size: 11.5px; font-weight: 700; color: var(--soft); }

  /* ---------- speech / coach ---------- */
  .say {
    border: 2px solid var(--ink); border-radius: 12px; background: var(--paper);
    padding: 10px 12px; font-size: 15.5px; font-weight: 600;
  }
  .say b { font-weight: 800; }
  .say.good { border-color: var(--green); background: #eef7f1; }
  .say.oops { border-color: var(--red); background: #fdf1f2; }
  .say.panic { border: 2px dashed var(--red); background: #fdf1f2; }
  .say .head { font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-weight: 800; font-size: 15px; display: block; margin-bottom: 2px; }
  /* the tutorial layer: one always visible line saying why the step makes sense */
  /* The reason under an instruction. It carries no label: a heading repeated on every single
     beat is noise, and the sentence says what it is. Quiet, plain, second. */
  .why {
    margin-top: 6px; font-size: 13.5px; font-weight: 600; color: var(--soft); line-height: 1.35;
  }
  .say.good .head { color: var(--green); }
  .say.oops .head, .say.panic .head { color: var(--red); }

  /* ---------- the player bar ----------
     One bar, wherever moves are being stepped: the coached solve, the puzzle setup, the guide,
     the chant shelf. Media player glyphs because every child already knows them, and every
     control is a finger sized target on a tablet. */
  .player {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--wash); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 10px;
  }
  .player button {
    font: inherit; cursor: pointer; background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 10px;
    min-width: 56px; min-height: 48px; display: flex; align-items: center; justify-content: center;
  }
  .player button[disabled] { opacity: .35; cursor: default; }
  .player button.go { background: var(--ink); }
  .player button.go svg { fill: var(--paper); }
  .player svg { width: 22px; height: 22px; fill: var(--ink); display: block; }
  .player .pos {
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-weight: 800; font-size: 14px;
    flex: 1 1 130px; line-height: 1.2; min-height: 36px;
  }
  .player .rate { min-width: 56px; font-weight: 800; font-size: 15px; }
  /* NOTHING RESIZES WHILE SHE IS FOLLOWING ALONG. A card that grows or shrinks between beats
     shoves the whole page under her thumb, which is what made it jump. These floors are the
     cheapest way to keep every box the same size whatever text lands in it. */
  .chantstrip { min-height: 84px; }
  /* Measured, not guessed: the tallest instruction in either method is the do not panic warning
     at 117px on an iPad, so the frame is floored above it. Anything shorter simply sits in a box
     that is already the right size, and the page underneath never moves. */
  #liveSay { min-height: 120px; }
  #liveStrip { min-height: 84px; }
  #liveRail { min-height: 44px; }
  /* the countdown is a number that changes width as it counts down, so it gets its own lane */
  #liveCount { display: inline-block; min-width: 96px; }
  .player .pos small { display: block; font-size: 11.5px; font-weight: 700; color: var(--soft); }
  .player.waiting { border-color: var(--red); }
  .player.waiting .pos small { color: var(--red); }

  .askbox { display: grid; gap: 8px; }
  .askq { font-size: 16px; font-weight: 700; }
  .asks { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- step rail ---------- */
  .rail { display: flex; gap: 6px; }
  .rail div {
    flex: 1 1 0; border: 1.5px solid var(--line); border-radius: 9px; padding: 5px 7px; background: var(--paper);
    font-size: 11.5px; font-weight: 700; color: var(--soft); line-height: 1.2;
  }
  .rail div.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .rail div.past { border-color: var(--green); color: var(--green); background: #eef7f1; }
  .rail b { display: block; font-size: 13px; }

  /* ---------- painter ---------- */
  .views { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .viewbox { text-align: center; }
  .viewbox svg { display: block; margin: 0 auto; }
  .viewbox .cap { font-size: 12px; font-weight: 700; color: var(--soft); margin-top: 4px; max-width: 190px; line-height: 1.25; }
  /* the painting pictures grow to the room they are given, so a single square on the big
     cube is a finger sized target on an iPad instead of a pin head */
  .viewbox.paint { flex: 1 1 300px; max-width: 400px; }
  .viewbox.paint svg { width: 100%; max-width: 400px; height: auto; }
  .viewbox.paint .cap { max-width: none; }
  .sticker { cursor: pointer; }
  .sticker:hover, .sticker:active { stroke: var(--red); stroke-width: 2.6; }
  .suspect { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 50% { stroke: var(--red); stroke-width: 3.4; } }
  .viewbox.locked svg { opacity: .3; filter: saturate(.12); }
  .viewbox.locked .cap { color: var(--red); }
  /* A live question always wins. The picture holding the ringed square is never dimmed, even
     while it is still locked for painting, because she has to be able to SEE the ring. This
     rule sits after .locked on purpose: same weight, later wins. */
  .viewbox.asking svg { opacity: 1; filter: none; }
  .viewbox.asking .cap { color: var(--red); font-weight: 800; }
  .turnsteps { margin: 8px 0 0 20px; font-size: 14.5px; font-weight: 600; }
  .turnsteps li { margin-bottom: 5px; }
  .turnsteps b { font-weight: 800; }
  .holdq { font-size: 16px; font-weight: 800; margin-top: 10px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch {
    width: 46px; height: 46px; border-radius: 9px; border: 2px solid var(--ink); cursor: pointer; padding: 0;
  }
  .swatch.on { box-shadow: 0 0 0 3px var(--red); }

  /* ---------- shelf ---------- */
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
  .mess {
    border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); padding: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-align: center; font: inherit;
  }
  .mess:hover { background: var(--wash); }
  .mess b { font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-size: 14px; font-weight: 800; }
  .mess small { font-size: 11px; color: var(--soft); font-weight: 600; line-height: 1.25; }
  .mess svg { width: 84px; height: auto; }

  /* ---------- badges ---------- */
  .badges { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .badge { font-size: 13px; font-weight: 700; display: flex; gap: 7px; align-items: center; color: var(--soft); }
  .badge::before { content: ""; width: 16px; height: 16px; border: 2px solid var(--ink); border-radius: 4px; display: inline-block; flex: 0 0 auto; }
  .badge.won { color: var(--ink); }
  .badge.won::before { background: var(--green); border-color: var(--green); }

  .levels { display: flex; gap: 6px; flex-wrap: wrap; }
  .levels button { flex: 1 1 0; min-width: 92px; }
  .hidden { display: none !important; }
  .foot { font-size: 12px; color: var(--soft); text-align: center; padding: 4px 0 10px; }
  .sides { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .sideread { border: 1.5px solid var(--line); border-radius: 9px; padding: 6px 4px; text-align: center; background: var(--paper); }
  .sideread.match { border-color: var(--green); background: #eef7f1; }
  .sideread .pair { display: flex; gap: 3px; justify-content: center; margin-bottom: 4px; }
  .sideread .pair i { width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid var(--ink); display: block; }
  .sideread small { font-size: 10.5px; font-weight: 700; color: var(--soft); line-height: 1.15; display: block; }
  .sideread.match small { color: var(--green); }
</style>
</head>
<body>
<noscript><div class="card" style="border-color:#c41e3a">This page needs JavaScript switched on. Ask a grown-up to open it in a normal browser window.</div></noscript>
<div class="wrap">

  <header class="app-head">
    <div>
      <div class="eyebrow">Cube Quest Studio</div>
      <h1 id="headline">Three steps, two chants</h1>
      <div class="sub" id="subline">The best day is the day you do not need me.</div>
    </div>
    <div class="cube-row" aria-hidden="true">
      <span style="background:#fff"></span><span style="background:var(--yellow)"></span><span style="background:var(--green)"></span><span style="background:var(--blue)"></span><span style="background:var(--red)"></span><span style="background:var(--orange)"></span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-mode="play" aria-pressed="true">Free play</button>
    <button data-mode="paint" aria-pressed="false">Match my cube</button>
    <button data-mode="solve" aria-pressed="false">Solve with me</button>
    <button data-mode="mess" aria-pressed="false">Known messes</button>
    <span class="sizeswitch" id="sizeswitch">
      <span class="tag">Which cube</span>
      <button type="button" data-size="2" aria-pressed="true">Small cube</button>
      <button type="button" data-size="3" aria-pressed="false">Big cube</button>
    </span>
  </nav>

  <div class="studio">
    <div class="stage-col">
      <div class="card stage-card">
        <div class="stage" id="stage"><div class="cube3d" id="cube3d"></div>
          <span class="legend lg-example" id="exampleTag" hidden>My example cube</span>
          <span class="legend lg-ceiling">Ceiling</span>
          <span class="legend you lg-you">You</span>
          <span class="legend lg-right">Your right</span>
          <span class="legend lg-floor">Floor</span>
        </div>
        <div class="stage-bar">
          <span class="grip-note" id="gripNote">Home grip. The red ring is your working corner.</span>
          <button class="btn" id="peekBtn">Peek at the far side</button>
          <button class="btn" id="speakBtn" hidden>Voice on</button>
        </div>
      </div>
      <div class="tile-live idle" id="tileLive"></div>
      <div class="pads" id="pads"></div>
    </div>
    <div class="panel-col" id="panel"></div>
  </div>

  <div class="foot" id="foot">Cube Quest Studio. Same three steps, same two chants as your board.</div>
</div>

<script>
/* ===== CORE START =====
   Cube Quest Studio core. Pure logic only, no DOM.
   Model: 8 corner blocks (permutation + twist), 24 stickers derived.
   Reference colours: U=yellow  R=green  F=red  D=white  L=blue  B=orange
   (a real standard cube held white at the floor, red looking at you).
   Room words: U = ceiling, D = floor, F = the side looking at you,
   R = your right, L = your left, B = the side facing away.
   Geometry frame for the 3D view: x -> your right, y -> the floor, z -> toward you.
*/
var CUBE = (function () {
  'use strict';

  var U = 0, R = 1, F = 2, D = 3, L = 4, B = 5;
  var FACE_LETTER = ['U', 'R', 'F', 'D', 'L', 'B'];
  var FACE_COLOUR = ['yellow', 'green', 'red', 'white', 'blue', 'orange'];
  var COLOURS = ['white', 'yellow', 'red', 'orange', 'blue', 'green'];
  var OPPOSITE = { white: 'yellow', yellow: 'white', red: 'orange', orange: 'red', blue: 'green', green: 'blue' };
  var OPP_FACE = [D, L, B, U, R, F];

  /* slot -> its three facelets, in a fixed cyclic order, starting at the ceiling/floor facelet */
  var HOME = [
    [U, R, F], [U, F, L], [U, L, B], [U, B, R],
    [D, F, R], [D, L, F], [D, B, L], [D, R, B]
  ];
  var SLOT_NAMES = ['URF', 'UFL', 'ULB', 'UBR', 'DFR', 'DLF', 'DBL', 'DRB'];
  var CEIL = [0, 1, 2, 3], FLOOR = [4, 5, 6, 7];

  /* FACELET[face][cell] = [slot, facelet-index]. Cell order is reading order on the drawn face:
     0 top-left, 1 top-right, 2 bottom-left, 3 bottom-right, with the ceiling face drawn
     back-at-top, the floor face drawn front-at-top, side faces drawn upright. */
  var FACELET = [
    [[2, 0], [3, 0], [1, 0], [0, 0]],
    [[0, 1], [3, 2], [4, 2], [7, 1]],
    [[1, 1], [0, 2], [5, 2], [4, 1]],
    [[5, 0], [4, 0], [6, 0], [7, 0]],
    [[2, 1], [1, 2], [6, 2], [5, 1]],
    [[3, 1], [2, 2], [7, 2], [6, 1]]
  ];

  /* WHERE[slot][facelet] = sticker id (face * 4 + cell) */
  var WHERE = [];
  (function () {
    var f, c;
    for (f = 0; f < 8; f++) WHERE.push([0, 0, 0]);
    for (f = 0; f < 6; f++) for (c = 0; c < 4; c++) {
      var m = FACELET[f][c];
      WHERE[m[0]][m[1]] = f * 4 + c;
    }
  })();

  /* ---------------- moves ---------------- */
  var QCP = {
    U: [3, 0, 1, 2, 4, 5, 6, 7], R: [4, 1, 2, 0, 7, 5, 6, 3], F: [1, 5, 2, 3, 0, 4, 6, 7],
    D: [0, 1, 2, 3, 5, 6, 7, 4], L: [0, 2, 6, 3, 4, 1, 5, 7], B: [0, 1, 3, 7, 4, 5, 2, 6]
  };
  var QCO = {
    U: [0, 0, 0, 0, 0, 0, 0, 0], R: [2, 0, 0, 1, 1, 0, 0, 2], F: [1, 2, 0, 0, 2, 1, 0, 0],
    D: [0, 0, 0, 0, 0, 0, 0, 0], L: [0, 1, 2, 0, 0, 2, 1, 0], B: [0, 0, 1, 2, 0, 0, 2, 1]
  };

  function solved() { return { cp: [0, 1, 2, 3, 4, 5, 6, 7], co: [0, 0, 0, 0, 0, 0, 0, 0] }; }
  function clone(s) { return { cp: s.cp.slice(), co: s.co.slice() }; }
  function keyOf(s) { return s.cp.join('') + '.' + s.co.join(''); }
  function equal(a, b) { return keyOf(a) === keyOf(b); }

  function compose(s, t) {
    var cp = [], co = [], i, j;
    for (i = 0; i < 8; i++) { j = t.cp[i]; cp.push(s.cp[j]); co.push((s.co[j] + t.co[i]) % 3); }
    return { cp: cp, co: co };
  }

  var MOVE = {};
  (function () {
    var i, ch, q;
    for (i = 0; i < FACE_LETTER.length; i++) {
      ch = FACE_LETTER[i];
      q = { cp: QCP[ch], co: QCO[ch] };
      MOVE[ch] = q;
      MOVE[ch + '2'] = compose(q, q);
      MOVE[ch + "'"] = compose(compose(q, q), q);
    }
  })();

  function applyMove(s, m) { return compose(s, MOVE[m]); }
  function applySeq(s, seq) { var i, r = s; for (i = 0; i < seq.length; i++) r = compose(r, MOVE[seq[i]]); return r; }
  function seqFromString(str) { return str.trim().split(/\s+/).filter(function (x) { return x.length; }); }
  function isSolved(s) { var i; for (i = 0; i < 8; i++) { if (s.cp[i] !== i || s.co[i] !== 0) return false; } return true; }

  /* ---------------- stickers ---------------- */
  function colourAt(s, slot, fac) {
    return FACE_COLOUR[HOME[s.cp[slot]][(fac - s.co[slot] + 3) % 3]];
  }
  function stateToStickers(s) {
    var out = new Array(24), f, c, m;
    for (f = 0; f < 6; f++) for (c = 0; c < 4; c++) {
      m = FACELET[f][c];
      out[f * 4 + c] = colourAt(s, m[0], m[1]);
    }
    return out;
  }
  function cornerColours(cubie) {
    return [FACE_COLOUR[HOME[cubie][0]], FACE_COLOUR[HOME[cubie][1]], FACE_COLOUR[HOME[cubie][2]]];
  }
  function cornerName(cubie) { return cornerColours(cubie).join(', '); }
  function readCorner(stickers, slot) {
    return [stickers[WHERE[slot][0]], stickers[WHERE[slot][1]], stickers[WHERE[slot][2]]];
  }
  function matchCorner(triple) {
    var c, j, k, home, ok;
    for (c = 0; c < 8; c++) {
      home = cornerColours(c);
      for (k = 0; k < 3; k++) {
        ok = true;
        for (j = 0; j < 3; j++) { if (triple[j] !== home[(j - k + 3) % 3]) { ok = false; break; } }
        if (ok) return { cubie: c, twist: k };

    return null;
  }
  function stickersToState(stickers) {
    var cp = [], co = [], s, m;
    for (s = 0; s < 8; s++) {
      m = matchCorner(readCorner(stickers, s));
      if (!m) return null;
      cp.push(m.cubie); co.push(m.twist);
    }
    return { cp: cp, co: co };
  }
  /* every side face shows one colour */
  function facesAllOneColour(s) {
    var st = stateToStickers(s), f;
    for (f = 0; f < 6; f++) {
      if (st[f * 4] !== st[f * 4 + 1] || st[f * 4] !== st[f * 4 + 2] || st[f * 4] !== st[f * 4 + 3]) return false;
    }

  }

  /* ---------------- 3D geometry (the drawing model) ----------------
     Unit vectors: x to your right, y toward the floor, z toward you. */
  var FACE_DIR = [[0, -1, 0], [1, 0, 0], [0, 0, 1], [0, 1, 0], [-1, 0, 0], [0, 0, -1]];

  function matMul(A, Bm) {
    var out = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], i, j, k;
    for (i = 0; i < 3; i++) for (j = 0; j < 3; j++) {

      for (k = 0; k < 3; k++) v += A[i][k] * Bm[k][j];

  }
  function matVec(A, v) {
    return [A[0][0] * v[0] + A[0][1] * v[1] + A[0][2] * v[2],
            A[1][0] * v[0] + A[1][1] * v[1] + A[1][2] * v[2],
            A[2][0] * v[0] + A[2][1] * v[1] + A[2][2] * v[2]];
  }
  function transpose(A) { return [[A[0][0], A[1][0], A[2][0]], [A[0][1], A[1][1], A[2][1]], [A[0][2], A[1][2], A[2][2]]]; }
  function colsMatrix(a, b, c) { return [[a[0], b[0], c[0]], [a[1], b[1], c[1]], [a[2], b[2], c[2]]]; }
  function rodrigues(axis, deg) {
    var t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t), x = axis[0], y = axis[1], z = axis[2], k = 1 - c;
    return [
      [c + x * x * k, x * y * k - z * s, x * z * k + y * s],
      [y * x * k + z * s, c + y * y * k, y * z * k - x * s],
      [z * x * k - y * s, z * y * k + x * s, c + z * z * k]
    ];
  }
  /* slot centre, in half-block units */
  function slotCentre(p) {
    var v = [0, 0, 0], j, d;
    for (j = 0; j < 3; j++) { d = FACE_DIR[HOME[p][j]]; v[0] += d[0]; v[1] += d[1]; v[2] += d[2]; }
    return v;
  }
  /* where block `cubie` sits and how it is turned, right now */
  function placement(state, cubie) {
    var p = -1, o = 0, i, A, Bm;
    for (i = 0; i < 8; i++) { if (state.cp[i] === cubie) { p = i; o = state.co[i]; break; } }
    A = colsMatrix(FACE_DIR[HOME[cubie][0]], FACE_DIR[HOME[cubie][1]], FACE_DIR[HOME[cubie][2]]);

  }
  /* a face turn is a +90 degree turn (right hand rule) about that face's outward direction */
  function moveSpin(m) {
    var f = FACE_LETTER.indexOf(m.charAt(0)), deg = 90;
    if (m.length > 1 && m.charAt(1) === "'") deg = -90;
    else if (m.length > 1 && m.charAt(1) === '2') deg = 180;
    return { axis: FACE_DIR[f], deg: deg };
  }
  function moveSlots(m) {
    var f = FACE_LETTER.indexOf(m.charAt(0)), out = [], p;
    for (p = 0; p < 8; p++) { if (HOME[p].indexOf(f) >= 0) out.push(p); }
    return out;
  }

  /* ---------------- whole cube turns ----------------
     y  = spin the cube flat, to your left      (U D')
     y' = spin the cube flat, to your right     (U' D)
     x  = tip the whole cube away from you      (R L')
     x' = tip the whole cube toward you         (R' L)
     x2 = turn the whole cube over              (R2 L2) */
  var WHOLE = {
    y: { moves: ['U', "D'"], axis: FACE_DIR[U], deg: 90, cap: 'spin the cube flat, to your left', letter: 'spin flat' },
    yp: { moves: ["U'", 'D'], axis: FACE_DIR[U], deg: -90, cap: 'spin the cube flat, to your right', letter: 'spin flat' },
    x: { moves: ['R', "L'"], axis: FACE_DIR[R], deg: 90, cap: 'tip the whole cube away from you', letter: 'tip' },
    xp: { moves: ["R'", 'L'], axis: FACE_DIR[R], deg: -90, cap: 'tip the whole cube toward you', letter: 'tip' },
    x2: { moves: ['R2', 'L2'], axis: FACE_DIR[R], deg: 180, cap: 'turn the whole cube over', letter: 'turn over' }
  };
  var WHOLE_KEYS = ['y', 'yp', 'x', 'xp', 'x2'];

  /* every way the cube can be held, as a list of whole cube turns */
  var HOLDS = (function () {
    var gens = ['y', 'yp', 'x', 'xp'];
    var seen = {}, list = [], queue = [], sv = solved(), i, g, np, st, k;
    seen[keyOf(sv)] = true;
    list.push({ path: [], state: sv });
    queue.push(list[0]);
    while (queue.length) {
      var node = queue.shift();
      for (i = 0; i < gens.length; i++) {
        g = gens[i];
        np = node.path.concat([g]);
        st = applySeq(node.state, WHOLE[g].moves);
        k = keyOf(st);
        if (seen[k]) continue;
        seen[k] = true;
        var rec = { path: np, state: st };
        list.push(rec); queue.push(rec);
      }
    }
    return list;
  })();

  /* tidy a hold path: x x -> x2 (one named action she knows) */
  function tidyHold(path) {
    var out = [], i = 0;
    while (i < path.length) {
      if (path[i] === 'x' && path[i + 1] === 'x') { out.push('x2'); i += 2; }
      else if (path[i] === 'xp' && path[i + 1] === 'xp') { out.push('x2'); i += 2; }
      else { out.push(path[i]); i += 1; }
    }
    return out;
  }
  function holdMoves(path) {
    var out = [], i;
    for (i = 0; i < path.length; i++) out = out.concat(WHOLE[path[i]].moves);
    return out;
  }

  /* ---------------- her colour scheme, read off her own painting ---------------- */
  function schemeFrom(stickers) {
    var i, j, tri, tris = [], withWhite = [], noWhite = [];
    for (i = 0; i < 8; i++) {
      tri = readCorner(stickers, i);
      tris.push(tri);
      if (tri.indexOf('white') >= 0) withWhite.push(i); else noWhite.push(i);
    }
    if (noWhite.length !== 4 || withWhite.length !== 4) {
      return { error: 'blocks-with-white', count: withWhite.length,
        msg: 'A cube has exactly 4 blocks with a white square on them. I can see ' + withWhite.length + '. Have another look.',
        suspects: allOf(withWhite.length > 4 ? withWhite : noWhite) };
    }
    /* the colour every no-white block shares is her "yellow" */
    var shared = COLOURS.filter(function (c) {
      if (c === 'white') return false;
      return noWhite.every(function (s) { return tris[s].indexOf(c) >= 0; });
    });
    if (shared.length !== 1) {
      return { error: 'no-opposite', msg: 'The 4 blocks with no white on them should all share one colour. That colour is the one that sits opposite white. Right now they do not share exactly one.', suspects: allOf(noWhite) };
    }
    var yel = shared[0];
    var rest = COLOURS.filter(function (c) { return c !== 'white' && c !== yel; });
    /* two colours are opposite when no block carries both */
    var pair = {}, a, b, ok;
    for (i = 0; i < rest.length; i++) {
      a = rest[i]; ok = null;
      for (j = 0; j < rest.length; j++) {
        if (i === j) continue;
        b = rest[j];
        var together = tris.some(function (t) { return t.indexOf(a) >= 0 && t.indexOf(b) >= 0; });
        if (!together) { if (ok !== null) { ok = 'many'; break; } ok = b; }
      }
      if (ok === null || ok === 'many') {
        return { error: 'pairs', msg: 'I cannot work out which colours live on opposite sides of your cube. Two colours that never share a block are opposites, and right now that does not add up.', suspects: [] };
      }
      pair[a] = ok;
    }
    /* chirality: read a white block clockwise, starting at its white square */
    var wslot = withWhite[0], wt = tris[wslot], sh = wt.indexOf('white');
    var x1 = wt[(sh + 1) % 3], x2 = wt[(sh + 2) % 3];
    if (pair[x1] === x2) {
      return { error: 'pairs', msg: 'One block has two colours on it that live on opposite sides. That block cannot exist. Check the circled squares.', suspects: WHERE[wslot].slice() };
    }
    var map = {};
    map.white = 'white'; map[yel] = 'yellow';
    map[x1] = 'red'; map[pair[x1]] = 'orange';
    map[x2] = 'green'; map[pair[x2]] = 'blue';
    var back = {};
    Object.keys(map).forEach(function (k) { back[map[k]] = k; });
    return { map: map, back: back, yellow: yel, standard: yel === 'yellow' };
  }
  function allOf(slots) {
    var out = [], i;
    for (i = 0; i < slots.length; i++) out = out.concat(WHERE[slots[i]]);
    return out;
  }
  function recolour(stickers, map) { return stickers.map(function (c) { return map[c]; }); }
  /* the plain scheme, used everywhere until she paints her own */
  var PLAIN_SCHEME = (function () {
    var back = {}, i;
    for (i = 0; i < COLOURS.length; i++) back[COLOURS[i]] = COLOURS[i];
    return { map: back, back: back, yellow: 'yellow', standard: true };
  })();

  /* ---------------- checking her painting, in her words ---------------- */
  function validate(stickers) {
    var i, c, tri, m;
    for (i = 0; i < 24; i++) {
      if (!stickers[i]) {
        return bad('blank', 'Some squares are still empty. Colour all 24 in and I can help.', blanks(stickers));
      }
    }
    var count = {}, off = [];
    for (i = 0; i < COLOURS.length; i++) count[COLOURS[i]] = 0;
    for (i = 0; i < 24; i++) {
      if (count[stickers[i]] === undefined) return bad('odd', 'One square is a colour I do not know.', [i]);
      count[stickers[i]]++;
    }
    for (i = 0; i < COLOURS.length; i++) { c = COLOURS[i]; if (count[c] !== 4) off.push(c); }
    if (off.length) {
      var words = off.map(function (x) { return x + ': ' + count[x]; }).join(', ');
      return bad('counts', 'Every colour needs exactly 4 squares. I count ' + words + '. Have another look at your cube.',
        stickersOfColours(stickers, off));
    }
    for (i = 0; i < 8; i++) {
      tri = readCorner(stickers, i);
      if (tri[0] === tri[1] || tri[1] === tri[2] || tri[0] === tri[2]) {
        var twice = tri[0] === tri[1] ? tri[0] : (tri[1] === tri[2] ? tri[1] : tri[0]);
        return bad('twice', 'One block has two ' + twice + ' squares. Every block shows three different colours. Check the ringed one.', WHERE[i].slice());
      }

    var canon = recolour(stickers, sch.map);
    var seen = {}, parsed = [];
    for (i = 0; i < 8; i++) {

      if (!m) {
        return bad('notreal', 'One block is not a real cube block. Its three colours cannot sit together in that order. Check the ringed one.', WHERE[i].slice());
      }
      parsed.push(m);

    }
    var missing = [], doubled = [];
    for (i = 0; i < 8; i++) {
      if (!seen[i]) missing.push(i);
      else if (seen[i].length > 1) doubled.push(i);
    }
    if (missing.length) {
      var sus = [], k;
      for (i = 0; i < doubled.length; i++) for (k = 0; k < seen[doubled[i]].length; k++) sus = sus.concat(WHERE[seen[doubled[i]][k]]);
      var her = function (cub) { return cornerColours(cub).map(function (x) { return sch.back[x]; }).join(', '); };
      return bad('missing', 'I cannot find the ' + her(missing[0]) + ' block'
        + (doubled.length ? ', and there are two ' + her(doubled[0]) + ' blocks' : '')
        + '. Did two squares get swapped? Check the ringed ones.', sus);

    for (i = 0; i < 8; i++) { sum += parsed[i].twist; if (parsed[i].twist) twisted.push(i); }

  }
  function bad(code, msg, suspects) { return { ok: false, code: code, msg: msg, suspects: suspects || [] }; }
  function blanks(st) { var o = [], i; for (i = 0; i < 24; i++) { if (!st[i]) o.push(i); } return o; }

  var RIGHTY = ["R'", "D'", 'R', 'D'];

  var WHITE_BLOCKS = [4, 5, 6, 7];

      say: 'Whole chants only, never stop halfway.',
      what: 'The one that does all the work in step 1 and step 2. It swaps your working corner with the block right underneath it.',
      why: 'It only ever touches your working corner and the block underneath, so finished work is safe.'

      id: 'swap', name: 'Swap chant', moves: SWAP, breath: 7,
      say: '14 moves, in 2 halves with a breath in the middle.',
      what: 'The step 3 one. It swaps the 2 blocks on your right, so the bar has to sit over on your left.',

  function chantSeq(id, times) {

  function invertMove(m) {

  }

    for (i = seq.length - 1; i >= 0; i--) out.push(invertMove(seq[i]));

  }
  /* the Chant Master drill: a finished cube, the Swap chant twice, a finished cube, in free play */
  function chantMasterEarned(before, after, id, times, mode) {
    return mode === 'play' && id === 'swap' && times === 2
      && facesAllOneColour(before) && facesAllOneColour(after);
  }

  /* the colour of the ceiling square of a ceiling slot */
  function ceilColour(s, p) { return colourAt(s, p, 0); }
  function ceilingAllYellow(s) {
    var i; for (i = 0; i < 4; i++) { if (ceilColour(s, i) !== 'yellow') return false; }
    return true;
  }
  /* the 4 sides, and whether the 2 squares nearest the ceiling match */
  var SIDE_FACES = [F, R, B, L];
  var SIDE_WORDS = { 2: 'the side looking at you', 1: 'your right', 5: 'the side facing away', 4: 'your left' };
  function readSides(s) {
    var st = stateToStickers(s), out = [], i, f;
    for (i = 0; i < SIDE_FACES.length; i++) {
      f = SIDE_FACES[i];
      out.push({ face: f, word: SIDE_WORDS[f], a: st[f * 4], b: st[f * 4 + 1], match: st[f * 4] === st[f * 4 + 1] });

  }
  function matchingSides(s) { return readSides(s).filter(function (x) { return x.match; }); }

  /* the flips: ways of holding that bring the white face up to the ceiling. Exactly 4. */
  var FLIPS = HOLDS.filter(function (h) { return colourAt(h.state, 0, 0) === 'white'; });

  /* which white blocks are already parked at the ceiling, and how the layer is lined up.
     Ties are broken by the lowest seated block so the answer never wanders when she
     spins the cube flat. */
  function whiteProgress(s) {
    var best = null, i, j, u, n, seated, low;
    for (i = 0; i < FLIPS.length; i++) {
      u = applySeq(s, holdMoves(FLIPS[i].path));
      n = 0; seated = [];
      for (j = 4; j < 8; j++) { if (u.cp[j] === j && u.co[j] === 0) { n++; seated.push(j); } }
      low = seated.length ? seated[0] : 99;
      if (!best || n > best.n || (n === best.n && low < best.low)) {
        best = { n: n, low: low, seated: seated, flip: FLIPS[i], target: {} };
      }
    }
    var t = applySeq(solved(), holdMoves(best.flip.path));
    for (i = 4; i < 8; i++) best.target[i] = t.cp[i];
    return best;
  }
  function step1Done(s) { return whiteProgress(s).n === 4; }

  /* is the white layer already built somewhere? returns the shortest way to hold it
     so white ends up along the floor, or null */
  function layerIntact(s) {
    var i, j, u, ok;
    for (i = 0; i < HOLDS.length; i++) {
      u = applySeq(s, holdMoves(HOLDS[i].path));
      ok = true;
      for (j = 4; j < 8; j++) { if (u.cp[j] !== j || u.co[j] !== 0) { ok = false; break; } }
      if (ok) return tidyHold(HOLDS[i].path);
    }
    return null;
  }

  /* the best the white layer is built, held any way at all */
  function bestSeat(s) {
    var best = null, i, j, u, n, seated, low;
    for (i = 0; i < HOLDS.length; i++) {
      u = applySeq(s, holdMoves(HOLDS[i].path));
      n = 0; seated = [];
      for (j = 4; j < 8; j++) { if (u.cp[j] === j && u.co[j] === 0) { n++; seated.push(j); } }
      low = seated.length ? seated[0] : 99;
      if (!best || n > best.n || (n === best.n && low < best.low)) {
        best = { n: n, low: low, seated: seated, hold: tidyHold(HOLDS[i].path) };
      }
    }
    best.wrong = WHITE_BLOCKS.filter(function (c) { return best.seated.indexOf(c) < 0; });
    return best;
  }

  /* all 4 white squares looking the same way: a finished SIDE, which may or may not be a finished LAYER */
  function faceHold(s) {
    var i, j, u, ok;
    for (i = 0; i < HOLDS.length; i++) {
      u = applySeq(s, holdMoves(HOLDS[i].path));
      ok = true;
      for (j = 4; j < 8; j++) { if (u.cp[j] < 4 || u.co[j] !== 0) { ok = false; break; } }
      if (ok) return tidyHold(HOLDS[i].path);
    }
    return null;
  }

  /* the same finished side, but held up at the ceiling where step 1 builds it */
  function faceHoldUp(s) {
    var i, p, u, ok;
    for (i = 0; i < HOLDS.length; i++) {
      u = applySeq(s, holdMoves(HOLDS[i].path));
      ok = true;
      for (p = 0; p < 4; p++) { if (u.cp[p] < 4 || u.co[p] !== 0) { ok = false; break; } }
      if (ok) return tidyHold(HOLDS[i].path);
    }
    return null;
  }

  /* which side squares of the white blocks clash with the block next door.
     Read with white held at the CEILING, so the white blocks are the ceiling row and
     their side colours are the 2 squares nearest the ceiling on each side. */
  function clashes(s) {
    var sides = readSides(s), out = [], i;
    for (i = 0; i < sides.length; i++) { if (!sides[i].match) out.push(sides[i]); }
    return out;
  }

  /* where is she starting from? */
  function diagnose(s) {
    var seat = bestSeat(s);
    if (facesAllOneColour(s)) return { kind: 'solved', seat: seat };
    var lay = layerIntact(s);
    if (lay) return { kind: 'layer', hold: lay, seat: seat };
    var fh = faceHold(s);
    if (fh) return { kind: 'face', hold: fh, seat: seat };
    if (seat.n >= 1) return { kind: 'partial', seat: seat };
    return { kind: 'fresh', seat: seat };
  }

  /* ---------------- the plan ---------------- */
  function ordinal(n) { return ['', '1st', '2nd', '3rd', '4th', '5th', '6th'][n] || (n + 'th'); }

  function Planner(start) {
    this.s = clone(start);
    this.beats = [];
    this.states = [];
  }
  Planner.prototype.push = function (b) {
    b.moves = b.moves || [];
    this.states.push(clone(this.s));
    this.beats.push(b);
    this.s = applySeq(this.s, b.moves);
  };
  Planner.prototype.whole = function (key, phase, say, extra) {
    var w = WHOLE[key], b = { phase: phase, kind: 'whole', whole: key, title: cap1(w.cap), say: say, moves: w.moves.slice() };
    if (extra) { Object.keys(extra).forEach(function (k) { b[k] = extra[k]; }); }
    this.push(b);
  };
  function cap1(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

  /* how many flat spins to bring ceiling slot p to the working corner (slot 0) */
  function spinsToCorner(p) { return (4 - p) % 4; }
  function spinBeats(pl, count, phase, say) {
    /* one flat spin per beat, so she can copy each one */
    var i;
    for (i = 0; i < count; i++) pl.whole('y', phase, i === 0 ? say : 'Keep spinning flat, to your left.');
  }

  function planStep1(pl, hint) {
    var guard = 0, prog = whiteProgress(pl.s), i;
    hint = hint || {};

    if (prog.n === 0) {
      /* find a hold that puts a white square at the ceiling */
      var pick = null, want = hint.anchor;
      for (i = 0; i < HOLDS.length; i++) {
        var u = applySeq(pl.s, holdMoves(HOLDS[i].path)), p, good = false;
        for (p = 0; p < 4; p++) {
          if (u.cp[p] >= 4 && u.co[p] === 0 && (want === undefined || u.cp[p] === want)) { good = true; break; }
        }
        if (good) { pick = tidyHold(HOLDS[i].path); break; }
      }
      if (!pick && want !== undefined) return planStep1(pl, {});
      if (!pick) return false;
      for (i = 0; i < pick.length; i++) {
        pl.whole(pick[i], 1, i === 0
          ? 'Turn the cube round until you spot a white square, and hold it so that square points at the ceiling. That block is done.'
          : 'Keep turning until the white square points at the ceiling.',
          i === 0 ? { ask: 'find-white' } : null);
      }
      prog = whiteProgress(pl.s);
      if (prog.n === 0) return false;
    }

    while (prog.n < 4 && guard++ < 30) {
      /* which block next */
      var todo = WHITE_BLOCKS.filter(function (c) { return prog.seated.indexOf(c) < 0; });
      var c = (hint.block !== undefined && todo.indexOf(hint.block) >= 0) ? hint.block : todo[0];
      hint = {};
      var here = slotOf(pl.s, c);

      pl.push({ phase: 1, kind: 'look', title: 'Find the next white block',
        say: 'Look for another white square, on a block you have not done yet. One of its other 2 colours has to touch the same colour on a done block. That is how you know where it goes.',
        moves: [], ask: 'pick-white', askTarget: c, blockHi: c });

      if (CEIL.indexOf(here) >= 0) {
        /* at the ceiling but not right: pop it down to the floor row with one chant */
        var k = spinsToCorner(here);
        spinBeats(pl, k, 1, 'This block is up at the ceiling, but not in its place. Spin the cube flat until it is at your working corner.');
        pl.push({ phase: 1, kind: 'righty', chant: 'righty', ord: 1, of: 1, title: 'Righty chant', pop: true,
          say: 'One Righty chant. The block drops down to the floor row. Your done blocks stay safe.',
          moves: RIGHTY.slice(), blockHi: c });
        prog = whiteProgress(pl.s);
      }

      /* aim the cube at the place this block belongs in */
      prog = whiteProgress(pl.s);
      var target = prog.target[c];
      spinBeats(pl, spinsToCorner(target), 1, 'Spin the cube flat until the place this block belongs in is your working corner.');
      prog = whiteProgress(pl.s);

      /* lift it into the waiting spot, right under the working corner */
      here = slotOf(pl.s, c);
      var idx = here - 4;
      if (idx !== 0) {
        var mv = idx === 1 ? ['D'] : (idx === 2 ? ['D2'] : ["D'"]);
        pl.push({ phase: 1, kind: 'floor', title: 'Turn only the floor row',
          say: 'Turn only the floor row until your block waits right below that place, like a lift.',
          moves: mv, blockHi: c });
      }

      /* Righty until it lands, white square at the ceiling */
      var chants = 0, seq = [];
      var probe = clone(pl.s);
      while (chants < 6) {
        probe = applySeq(probe, RIGHTY); chants++;
        if (probe.cp[0] === c && probe.co[0] === 0) break;
      }
      if (probe.cp[0] !== c || probe.co[0] !== 0) return false;
      for (i = 1; i <= chants; i++) {
        pl.push({ phase: 1, kind: 'righty', chant: 'righty', ord: i, of: chants, title: 'Righty chant', place: true,
          say: i === chants
            ? 'Righty chant. It lands in its place with its white square at the ceiling.'
            : 'Righty chant. Your block dives down and pops back up. Keep going, whole chants only.',
          moves: RIGHTY.slice(), blockHi: c });
      }
      prog = whiteProgress(pl.s);
      seq = null;
    }
    if (prog.n !== 4) return false;

    pl.whole('x2', 1, 'All 4 white squares are at the ceiling. Turn the whole cube over. White lives at the floor now, and it stays there until the very end.',
      { title: 'Turn the whole cube over', flip: true, cheer: 'White layer done!' });
    return true;
  }

  function slotOf(s, cubie) { var i; for (i = 0; i < 8; i++) { if (s.cp[i] === cubie) return i; } return -1; }

  function planStep2(pl, hint) {
    var guard = 0, i;
    hint = hint || {};
    if (ceilingAllYellow(pl.s)) {
      pl.push({ phase: 2, kind: 'skip', title: 'Already all yellow', moves: [],
        say: 'All 4 ceiling squares are yellow already. This step is done. Straight on to step 3.' });
      return true;
    }
    pl.push({ phase: 2, kind: 'warn', title: 'Read this before you start', moves: [], panic: true,
      say: 'Halfway through this step your lovely white floor goes messy. That is not you breaking it. Finish every chant, keep white at the floor, and the white floor builds itself back the moment the last yellow square lands.' });

    while (!ceilingAllYellow(pl.s) && guard++ < 12) {
      /* spin only the ceiling row to bring a not yellow block to the working corner */
      var k = -1;
      if (hint.ceilSlot !== undefined && ceilColour(pl.s, hint.ceilSlot) !== 'yellow') k = spinsToCorner(hint.ceilSlot);
      hint = {};
      if (k < 0) {
        k = 0;
        while (k < 4) {
          var probe = pl.s, j;
          for (j = 0; j < k; j++) probe = applyMove(probe, 'U');
          if (ceilColour(probe, 0) !== 'yellow') break;
          k++;
        }
      }
      if (k === 4) return false;
      pl.push({ phase: 2, kind: 'ceiling', title: k > 0 ? 'Spin only the ceiling row' : 'It is already there',
        say: k > 0
          ? 'Spin only the ceiling row until a not yellow block arrives at your working corner.'
          : 'A not yellow block is already at your working corner. No spin needed.',
        moves: k === 0 ? [] : (k === 1 ? ['U'] : (k === 2 ? ['U2'] : ["U'"])), ask: 'pick-not-yellow' });
      /* whole chants, checked in pairs */
      var chants = 0, probe2 = clone(pl.s);
      while (chants < 6) {
        probe2 = applySeq(probe2, RIGHTY); chants++;
        probe2 = applySeq(probe2, RIGHTY); chants++;
        if (ceilColour(probe2, 0) === 'yellow') break;
      }
      if (ceilColour(probe2, 0) !== 'yellow') return false;
      for (i = 1; i <= chants; i++) {
        pl.push({ phase: 2, kind: 'righty', chant: 'righty', ord: i, of: chants, title: 'Righty chant',
          say: (i % 2 === 0)
            ? 'That is 2 chants. Now look at the working corner square.'
            : 'Righty chant. Whole chants only, never stop halfway.',
          moves: RIGHTY.slice(),
          askAfter: (i % 2 === 0) ? 'yellow-yet' : null, askAfterYes: (i === chants) });
      }
    }
    if (!ceilingAllYellow(pl.s)) return false;
    pl.push({ phase: 2, kind: 'cheer', title: 'Yellow ceiling done', moves: [], cheer: 'Yellow ceiling done!',
      say: 'All 4 ceiling squares are yellow, and look, the white floor came back exactly as it was.' });
    return true;
  }

  function planStep3(pl) {
    var guard = 0, i;
    while (guard++ < 6) {
      var sides = readSides(pl.s), n = sides.filter(function (x) { return x.match; }).length;

      pl.push({ phase: 3, kind: 'read', title: 'Read the four sides', moves: [], read: true,
        say: 'Look at all 4 sides. On each side, look at the 2 squares nearest the ceiling. Do they match? It is always 0 sides, 1 side, or all 4. Never 2 or 3.',
        ask: 'count-sides', askCount: n });

      if (n === 4) {
        pl.push({ phase: 3, kind: 'guard', title: 'All 4 sides match', moves: [], guardHit: true,
          say: 'All 4 sides match, so every block is already in its place. No chant needed. One last spin and you are done.' });
        break;
      }
      if (n === 1) {
        var bar = sides.filter(function (x) { return x.match; })[0];
        pl.push({ phase: 3, kind: 'bar', title: 'Found the bar', moves: [], barFace: bar.face,
          say: 'Only one side matches, so that side is the bar. It is on ' + bar.word + '.',
          ask: 'tap-bar', askFace: bar.face });
        /* spin the cube flat until the bar is on her left */
        var turns = { 2: ['y'], 1: ['y', 'y'], 5: ['yp'], 4: [] }[bar.face];
        for (i = 0; i < turns.length; i++) {
          pl.whole(turns[i], 3, i === 0 ? 'Spin the cube flat so the bar sits over on your left. The chant swaps the 2 blocks on your right, so the bar stays safely out of its way.' : 'Keep spinning flat.',
            { barMove: true });
        }
        pl.push({ phase: 3, kind: 'swap', chant: 'swap', ord: 1, of: 1, title: 'Swap chant',
          say: 'Swap chant. 14 moves, in 2 halves with a breath in the middle.', moves: SWAP.slice() });
        continue;
      }
      /* no side matches */
      pl.push({ phase: 3, kind: 'swap', chant: 'swap', ord: 1, of: 1, title: 'Swap chant', nobar: true,
        say: 'No side matches at all. Do the Swap chant once without turning the cube. A bar will pop up.', moves: SWAP.slice() });
    }
    /* last spin: only the ceiling row, until every side is one colour */
    var k = 0, probe = pl.s;
    while (k < 4 && !facesAllOneColour(probe)) { probe = applyMove(probe, 'U'); k++; }
    if (!facesAllOneColour(probe)) return false;
    if (k > 0) {
      pl.push({ phase: 3, kind: 'ceiling', title: 'Spin only the ceiling row',
        say: 'Spin only the ceiling row until every side is one colour.',
        moves: k === 1 ? ['U'] : (k === 2 ? ['U2'] : ["U'"]) });
    }
    pl.push({ phase: 3, kind: 'done', title: 'Solved', moves: [], cheer: 'Solved!',
      say: 'Every side is one colour. You solved it. Three steps, two chants.' });
    return true;
  }

  /* ---------------- why each beat makes sense, in her words ----------------
     Straight from the training module's For-Dad notes and the facts the gate proves:
     Righty leaves the other three ceiling blocks alone, the Swap chant trades the two blocks
     on your right, and the matching side count is only ever 0, 1 or all 4. */
  function whyOf(b) {
    if (b.why) return b.why;
    var p = b.phase, k = b.kind;
    if (p === 1) {
      if (k === 'whole' && b.ask === 'find-white') return 'Any white square will do to start, because that block is done the moment white points up.';
      if (k === 'whole' && b.flip) return 'White goes to the floor now, so the messy step above can never touch it.';
      if (k === 'whole') return 'Spinning the whole cube flat moves nothing on it, so your done blocks stay done.';
      if (k === 'look') return 'Its other two colours must touch matching colours, and that is what says where it lives.';
      if (k === 'righty' && b.pop) return 'Righty only swaps your working corner with the block underneath, so done blocks never move.';
      if (k === 'righty') return 'Each chant dives your block down and pops it back a new way round.';
      if (k === 'floor') return 'Nothing in the floor row is finished yet, so you can spin it freely.';
      if (k === 'skip') return 'Your layer is already built, so there is nothing for this step to do.';
    }
    if (p === 2) {
      if (k === 'warn') return 'The mess is Righty keeping your white blocks safe. Six chants always puts them back.';
      if (k === 'ceiling') return 'A ceiling row spin never moves a floor block, so it cannot undo a chant you have done.';
      if (k === 'righty') return 'The floor stays broken until the last yellow lands. Check the working corner square, not the floor.';
      if (k === 'skip') return 'All four ceiling squares are yellow already, so a chant here would only break it.';
      if (k === 'cheer') return 'The white floor put itself back together, because six Righty chants always land everything back home.';
    }
    if (p === 3) {
      if (k === 'read') return 'Two sides can never match on their own, so the count is only 0, 1 or 4.';
      if (k === 'guard') return 'All four match, so every block is home. A chant now would trade them away.';
      if (k === 'bar') return 'The bar is the pair that already matches, so it has to stay out of the way.';
      if (k === 'whole') return 'The chant swaps the two blocks on your right, so the bar hides on your left.';
      if (k === 'swap' && b.nobar) return 'With no bar, one chant makes one. Do it twice and you are back where you started.';
      if (k === 'swap') return 'The Swap chant trades the two blocks on your right and leaves the bar alone.';
      if (k === 'ceiling') return 'Every block is home already, so one ceiling spin lines all the colours up.';
      if (k === 'done') return 'Three steps and two chants walked every block back to the place its colours named.';
    }
    return '';
  }
  /* Stamp the why line, and group the beats. A repeated chant is one group, so per move
     stepping is simply the default and a later fluent mode can play a whole group in one go

  function stampWhy(beats) {
    var i, g = 0, prev;
    for (i = 0; i < beats.length; i++) {

        beats[i].group = prev.group;

    }
    return beats;
  }

  /* build the whole plan from where the cube is now */
  function buildPlan(state, hint) {
    var pl = new Planner(state), i, census = {};
    hint = hint || {};
    if (facesAllOneColour(state)) {
      pl.push({ phase: 3, kind: 'done', title: 'Already solved', moves: [], cheer: 'Already solved!',
        say: 'This cube is already solved. Mess it up and I will walk you through it.' });
      return { ok: true, beats: stampWhy(pl.beats), states: pl.states, end: pl.s, solved: true, census: { alreadySolved: 1 } };
    }
    var lay = layerIntact(state);
    if (lay) {
      census.layerAlready = 1;
      if (lay.length === 0) {
        pl.push({ phase: 1, kind: 'skip', title: 'White layer already built', moves: [],
          say: 'Your white layer is already built and white is already along the floor. Straight on to step 2.' });
      } else {
        for (i = 0; i < lay.length; i++) {
          pl.whole(lay[i], 1, i === 0
            ? 'Your white layer is already built. Hold the cube so white lies along the floor, and it stays there until the very end.'
            : 'Keep going until white is along the floor.', { flip: true });
        }
      }
    } else {
      if (!planStep1(pl, hint)) return { ok: false, why: 'step1' };
      census.built = 1;
    }
    if (ceilingAllYellow(pl.s)) census.yellowSkip = 1;
    if (!planStep2(pl, hint)) return { ok: false, why: 'step2' };
    var n0 = matchingSides(pl.s).length;
    census['sides' + n0] = 1;
    if (!planStep3(pl)) return { ok: false, why: 'step3' };
    return { ok: true, beats: stampWhy(pl.beats), states: pl.states, end: pl.s, solved: facesAllOneColour(pl.s), census: census };
  }

  /* ---------------- scrambles and known messes ---------------- */
  var SCRAMBLE_MOVES = ['U', "U'", 'U2', 'R', "R'", 'R2', 'F', "F'", 'F2', 'D', "D'", 'D2', 'L', "L'", 'L2', 'B', "B'", 'B2'];
  function randomScramble(n, rnd) {
    rnd = rnd || Math.random;

      m = SCRAMBLE_MOVES[Math.floor(rnd() * SCRAMBLE_MOVES.length)];

      last = m.charAt(0); out.push(m);
    }
    return out;
  }
  function randomState(n, rnd) { return applySeq(solved(), randomScramble(n, rnd)); }

  var PRESETS = [
    { id: 'one', name: 'One turn away', hint: 'So close. One spin of the ceiling row finishes it.',
      scramble: "U'",
      quiz: { q: 'How many sides show 2 matching squares nearest the ceiling?', a: ['none', 'one', 'all four'], right: 2,
        why: 'All 4 sides match, so every block is already in its place. No chant. Just spin the ceiling row.' } },
    { id: 'twists', name: 'Two twists', hint: 'White floor is fine. Two ceiling blocks hide their yellow.',
      scramble: "R' D' R D R' D' R D U R' D' R D R' D' R D R' D' R D R' D' R D U'",
      quiz: { q: 'How many ceiling squares are yellow?', a: ['2', '3', '4'], right: 0,
        why: 'Two blocks still hide their yellow round the side. That is step 2 work. Righty chants, 2 or 4 each.' } },
    { id: 'lights', name: 'Headlights', hint: 'Yellow ceiling done. Two blocks want to trade places.',
      scramble: "R U R' U' R' F R2 U' R' U' R U R' F'",
      quiz: { q: 'How many sides show 2 matching squares?', a: ['none', 'one', 'all four'], right: 1,
        why: 'Exactly one side matches. That side is the bar. Spin it over to your left, then Swap chant.' } },
    { id: 'bar', name: 'The Bar showdown', hint: 'Same idea, but you have to hunt for the bar first.',
      scramble: "R U R' U' R' F R2 U' R' U' R U R' F' U2",
      quiz: { q: 'Where does the bar go before the Swap chant?', a: ['on your left', 'looking at you', 'on your right'], right: 0,
        why: 'The chant swaps the 2 blocks on your right, so the bar has to sit safely over on your left.' } },
    { id: 'criss', name: 'Criss-cross', hint: 'No bar anywhere. Chant once and one pops up.',
      scramble: "R U R' U' R' F R2 U' R' U' R U R' F' U2 R U R' U' R' F R2 U' R' U' R U R' F' U2",
      quiz: { q: 'How many sides show 2 matching squares?', a: ['none', 'one', 'all four'], right: 0,
        why: 'None of them. So do the Swap chant once without turning the cube at all, and a bar appears.' } },
    { id: 'stripes', name: 'Stripes', hint: 'A pattern, not a mess. The 4 sides go stripy.',
      scramble: 'R2 F2 R2',
      quiz: { q: 'Is white still all along the floor?', a: ['yes', 'no'], right: 0,
        why: 'White stayed along the floor and yellow stayed at the ceiling. But every block is in the wrong place, so this one takes all three steps.' } },
    { id: 'layer', name: 'White layer only', hint: 'Step 1 is done for you. Start at step 2.',
      scramble: "R U R' U R U2 R'",
      quiz: { q: 'Which step do you start on?', a: ['step 1', 'step 2', 'step 3'], right: 1,
        why: 'The white layer is already built, so you go straight to getting yellow at the ceiling.' } },
    { id: 'full', name: 'Full scramble', hint: 'The real thing. Three steps, two chants.',

  }
  function buildCube() {
    if (big()) { buildCube3(); return; }
    host = $('cube3d'); host.innerHTML = '';
    host.classList.remove('n3');
    cubieEls = []; stickerEls = [];
    var k, f, j, d, face, sticker;

      d = el('div', 'cubie'); d.setAttribute('data-cubie', k);

        d.appendChild(face);

  }
  function paintStickers() {
    if (big()) { paintStickers3(); return; }
    var k, j;

      t = p.t.map(function (v) { return v * 50; });

  }

  /* ---- turning ---- */
  var SPEED = 400;
  function spinLayer(els, axis, deg, dur, done) {
    var wrap = el('div', 'layer');

    setTimeout(function () {

  }
  function slotEls(slots) { return slots.map(function (p) { return cubieEls[app.state.cp[p]]; }); }
  function movingEls3(m) { return C3.movingPieces(app.state, m).map(function (p) { return pieceEls[p[0] + p[1]]; }); }
  function allEls3() { return pieces3().map(function (p) { return pieceEls[p[0] + p[1]]; }); }
  /* one face turn, animated for real */
  function turn(m, dur, done) {
    var spin = C.moveSpin(m);

      return;

      app.state = C.applyMove(app.state, m);

  }
  /* one whole cube turn in her hands */
  function turnWhole(key, dur, done, quiet) {
    var w = C.WHOLE[key];

      /* a turn over is ONE action with one name. Showing its two halves put the wrong tile up
         twice, so the halves stay quiet and the whole turn keeps its own tile. */
      var half = key === 'x2' ? 'x' : key;
      if (!quiet) showTile(key);
      turnWhole(half, dur, function () { turnWhole(half, dur, done, true); }, true);
      return;
    }
    if (!quiet) showTile(key);
    spinLayer(big() ? allEls3() : slotEls([0, 1, 2, 3, 4, 5, 6, 7]), w.axis, w.deg, dur, function () {
      app.state = big() ? C.applyMove(app.state, key) : C.applySeq(app.state, w.moves);

    var i = 0;

      if (onEach) onEach(i);
      i++;
      turn(m, dur, step);
    })();
  }

  /* ---- the big move tile ---- */
  function tileCaption(kind) {
    if (C.WHOLE[kind]) return C.WHOLE[kind].cap;

  }
  function tileLetter(kind) {

      + '<div class="letter">' + esc(tileLetter(kind)) + '</div>'
      + '<div class="cap">' + esc(tileCaption(kind)) + '</div></div>';
  }
  function idleTile(msg) {

      + '<div class="cap" style="font-weight:600;color:#6b675f">The move you are doing shows up here, with its picture.</div></div>';
  }

  /* ---------------------------------------------------------------- pads */
  var PAD_HAND = ['R', "R'", 'U', "U'", 'L', "L'", 'D', "D'", 'F', "F'"];
  var PAD_WHOLE = ['y', 'yp', 'x2', 'xp', 'x'];
  function buildPads() {
    var wrap = $('pads');
    wrap.innerHTML = '';
    [['Your right hand does the turning', PAD_HAND], ['The whole cube, in both hands', PAD_WHOLE]].forEach(function (grp) {
      var g = el('div', 'padgroup'), row = el('div', 'padrow');
      g.appendChild(el('div', 'tag', grp[0]));
      grp[1].forEach(function (k) {
        var b = el('button', 'pad');
        b.type = 'button';

        b.innerHTML = movePic(k) + '<b>' + esc(tileLetter(k)) + '</b><small>' + esc(tileCaption(k)) + '</small>';
        b.onclick = function () { padPress(k); };

  }
  function padPress(k) {
    if (app.busy) return;

    if (app.mode === 'solve' && app.level !== 'solo') { say('In Watch and Try I do the turning. Switch to On my own if you want to drive.', 'oops'); render(); return; }
    app.busy = true;
    app.undo.push(C.clone(app.state));
    var after = function () { app.busy = false; watchSolo(); render(); };
    if (C.WHOLE[k]) turnWhole(k, SPEED, after); else turn(k, SPEED, after);
  }

  /* ---------------------------------------------------------------- saying it out loud
     The browser's own voice, nothing fetched from anywhere. If the browser has no voice the
     button never appears and everything else carries on exactly as before. On iOS the first
     utterance has to come from a tap, and it does: every beat arrives through one. */
  var CAN_SPEAK = (typeof window !== 'undefined') && !!window.speechSynthesis
    && (typeof window.SpeechSynthesisUtterance === 'function');
  function loadSpeak() {
    var v = storeGet('speak');
    return v !== 'off';
  }
  function saveSpeak() { storeSet('speak', app.speak ? 'on' : 'off'); }

    if (!CAN_SPEAK) return;
    try { window.speechSynthesis.cancel(); } catch (e) { /* nothing to cancel */ }
  }
  function speakText(t) {
    if (!CAN_SPEAK || !app.speak || !t) return;
    try {
      var u = new window.SpeechSynthesisUtterance(String(t));
      u.rate = 0.85; u.pitch = 1.05; u.lang = 'en-GB';

  }
  function plainWords(s) { return String(s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
  /* A mastered chant gets its move count said ONCE, on the announcement that already names it,
     and then not another number until the chant is over. Works for a plan beat and for a guide
     step alike, because both carry a chant name and a list of moves. */
  function smoothTail(b) {
    if (!b || !b.chant || !b.moves || !b.moves.length || !knowsChant(b.chant)) return '';
    var n = chantGoes(b);
    return n.goes > 1 ? ('. ' + n.goes + ' smooth goes, ' + n.per + ' moves each')
      : ('. ' + b.moves.length + ' moves, one smooth go');
  }
  /* ===== SPEECH START =====
     WHAT SHE HEARS. The instruction every single time, because it is what to do next. The
     reason ONCE per kind of beat in a sitting: the Righty explanation is the same sentence on
     the first corner and on the fourth, and hearing it five times is what made the voice
     tiring. It stays on the screen either way. */
  function beatWhyKey(b) { return 'b' + b.phase + '/' + b.kind + (b.chant ? '/' + b.chant : ''); }
  function reasonOnce(key, text) {
    if (!text || !key) return '';
