  function panelSolve() {
    var h = '';
    /* when the guide is driving, it owns the panel: no plan, no levels, no cube state talk */
    if (app.guide) return panelGuide();
    h += '<div class="card"><h2>Solve with me</h2><div class="lede">Pick how much you want me to do. Move down the list as you get stronger.</div>'
      + '<div class="levels" style="margin-top:8px">'
      + [['watch', 'Watch', 'I do it all. You copy me on your cube.'],
         ['try', 'Try', 'I ask, you answer, then we do the move.'],
         ['solo', 'On my own', 'You drive. I only cheer and nudge.']]
        .map(function (l) {
          return '<button class="btn' + (app.level === l[0] ? ' on' : '') + '" data-lvl="' + l[0] + '"><b>' + l[1] + '</b><br><small style="font-weight:600">' + esc(l[2]) + '</small></button>';
        }).join('') + '</div></div>';

    if (!app.scheme.standard) {
      h += '<div class="say"><span class="head">One thing about your cube</span>On your cube the colour opposite white is <b>' + esc(YEL())
        + '</b>. So everywhere I say ' + esc(YEL()) + ', I mean the colour opposite white. Same method, different colour.</div>';
    }

    if (app.level === 'solo') {
      h += '<div class="card"><h2>Your hands, your cube</h2><div class="lede">Use the move buttons. I am watching and I will shout when you finish a step. I will not interrupt.</div>'
        + '<div class="row" style="margin-top:8px"><button class="btn" data-act="nudge">I am stuck, nudge me</button>'
        + '<button class="btn" data-act="undo">Undo</button></div></div>';

    }

    if (!app.plan) {
      h += knownDoor();
      h += frontDoor();
      h += diagCard() || '<div class="card"><h2>Ready?</h2><div class="lede">Press start and I will work out your cube.</div>'
        + '<div class="row" style="margin-top:8px"><button class="btn primary" data-act="coach">Start</button></div></div>';
      h += sayBox();
      if (!app.busy) h += chantShelf();
      h += badgeShelf();
      return h;
    }

    var b = beat();
    h += countdownCard();
    h += transportBar();
    h += railHtml();
    h += sayBox();
    h += chantStrip();

    if (app.askState === 'asking' || app.askState === 'askingAfter') {
      var q = askFor(b, app.askState === 'askingAfter');
      if (q) {
        h += '<div class="card askbox"><div class="askq">' + esc(q.q) + '</div>';
        if (q.opts) h += '<div class="asks">' + q.opts.map(function (o, i) { return '<button class="btn" data-opt="' + i + '">' + esc(o) + '</button>'; }).join('') + '</div>';
        else h += '<div class="lede">Tap it on the cube picture, up there on the left.</div>';
        h += '<div class="row"><button class="btn" data-act="showme">Show me</button></div></div>';
      }
    }
    h += sidesRead();
    h += ceilingRead();
    /* NO CONFIRM TAPS ANYWHERE. There is no "I did it" and no "Next move": the forward arrow
       on the player is both. She is holding the cube, so she is the one who knows when the move
       is done, and pressing forward is her saying so. */
    h += '<div class="card"><div class="row">'
      + (b && b.moves.length ? '<button class="btn" data-act="demo-again">Watch that again</button>' : '')
      + '<button class="btn" data-act="block-again">Start this block again</button>'
      + '<button class="btn" data-act="restart">Work it out again</button>'
      + '</div><div class="lede" style="margin-top:7px">Do the move on your cube, then press the forward arrow. Step '
      + (b ? b.phase : 3) + ', move ' + Math.min(app.idx + 1, app.plan.beats.length) + ' of ' + app.plan.beats.length + '.</div></div>';
    if (!app.busy && app.askState === null) h += chantShelf();
    h += badgeShelf();
    return h;
  }

  function panelMess() {
    var h = puzzleCard();
    h += '<div class="card"><h2>Known messes</h2><div class="lede">Every one is a real cube, made by turning a solved one. So every one can be solved. Tap a card, answer the reading question, then solve it.</div></div>';
    h += '<div class="shelf">' + C.PRESETS.map(function (p) {
      var st = C.presetState(p);
      return '<button class="mess" data-preset="' + p.id + '">' + isoAny(st, viewHome(), 88, {}) + '<b>' + esc(p.name) + '</b><small>' + esc(p.hint) + '</small></button>';
    }).join('') + '</div>';

        + '</div>' + (app.quizPick !== null

            + (app.quizPick === q.right ? 'Spot on' : 'Nearly') + '</span>' + esc(q.why) + '</div>'

  /* ---------------------------------------------------------------- render
     TWO WAYS TO DRAW. render() rebuilds the whole panel and is what every tap uses. While the
     PLAYER is running it is never called: rebuilding forty cards between every move is what made
     the numbers stutter and the page jump under her hand. renderLive() swaps only the words
     inside a frame that is already the right shape, so nothing moves but the text. */
  function renderLive() {
    var e, wt = liveWhyText(), pos = playerPos(), waiting = playerBlocked();
    e = $('liveSay');
    if (e) e.className = 'say ' + app.sayKind;
    e = $('liveSayHead');
    if (e) { e.textContent = app.sayHead || ''; e.hidden = !app.sayHead; }
    e = $('liveSayBody');
    if (e) e.innerHTML = app.says || '';
    e = $('liveWhy');
    if (e) { e.textContent = wt; e.hidden = !wt; }
    e = $('liveRail');
    if (e) e.innerHTML = railInner(railNames(), railPhase());
    e = $('liveStrip');
    if (e) e.innerHTML = chantStripInner();
    e = $('liveCount');
    if (e && app.plan) e.textContent = planMoves(app.plan, app.idx) + ' to go.';
    e = $('livePosBig');
    if (e) e.textContent = pos.big;
    e = $('livePosSmall');
    if (e) e.textContent = waiting ? playerWaitWords() : (app.playMsg || pos.small);
    e = $('livePlayer');
    if (e) e.className = 'player' + (waiting ? ' waiting' : '');
    e = $('pbBack');
    if (e) e.disabled = !playerCanBack();
    e = $('pbFwd');
    if (e) e.disabled = !playerCanFwd();
    e = $('pbGo');
    if (e) {
      e.disabled = !(app.playing || playerCanFwd());
      e.setAttribute('data-act', app.playing ? 'player-pause' : 'player-play');
      e.setAttribute('aria-label', app.playing ? 'Pause' : 'Play');
      e.innerHTML = app.playing ? GLYPH.pause : GLYPH.play;
    }
  }
  /* what the stepper calls: live while playing, a full rebuild otherwise */
  function renderStep() {
    if (app.playing && $('livePlayer')) { renderLive(); return; }
    render();
  }
  function render() {
    var p = $('panel'), h = '';
    if (app.mode === 'play') h = panelPlay();
    else if (app.mode === 'paint') h = panelPaint();
    else if (app.mode === 'solve') h = panelSolve();
    else h = panelMess();
    p.innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-mode') === app.mode ? 'true' : 'false');
    });
    var tag = $('exampleTag');
    if (tag) tag.hidden = !app.guide;
    var note = $('gripNote');
    note.textContent = app.guide
      ? 'My example cube. Yours will look different. The red ring is your working corner.'
      : app.mode === 'paint'
      ? 'Paint on the two pictures in the panel. This cube shows what I have understood.'
      : 'Home grip. The red ring is your working corner.';
  }

  /* ---------------------------------------------------------------- events */
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b || app.busy) return;
    app.mode = b.getAttribute('data-mode');
    speakStop();
    app.says = null; app.auto = false;
    app.confirmReset = false; app.playing = false; app.playMsg = null;
    if (app.mode !== 'mess') { app.setup = null; }
    if (app.mode === 'paint') { if (app.paintIntent !== 'side') app.paintIntent = 'match'; idleTile('Paint your cube'); }
    else { app.sideHold = false; app.sideMsg = null; }
    if (app.mode === 'solve' && !app.diag) app.diag = C.diagnose(app.state);
    render();
  });

  $('sizeswitch').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-size]');
    if (b) switchSize(parseInt(b.getAttribute('data-size'), 10));
  });

  $('panel').addEventListener('click', function (e) {
    var t = e.target.closest('button, .swatch, polygon.sticker');
    if (!t) return;
    if (t.hasAttribute('data-size')) { switchSize(parseInt(t.getAttribute('data-size'), 10)); return; }
    if (t.hasAttribute('data-hold')) { answerHold(t.getAttribute('data-hold')); return; }
    if (t.hasAttribute('data-infer')) { inferAnswer(t.getAttribute('data-infer')); return; }
    var act = t.getAttribute('data-act');
    if (t.getAttribute('data-col')) { app.paintColour = t.getAttribute('data-col'); render(); return; }
    if (t.getAttribute('data-scr')) { scramble(parseInt(t.getAttribute('data-scr'), 10)); return; }
    if (t.getAttribute('data-lvl')) {
      app.level = t.getAttribute('data-lvl'); app.auto = false; app.plan = null; app.nudge = null;
      app.diag = C.diagnose(app.state); app.cheered = {}; app.says = null; render(); return;
    }
    if (t.hasAttribute('data-guideopt')) { guideAnswer(parseInt(t.getAttribute('data-guideopt'), 10)); return; }
    if (t.hasAttribute('data-opt')) { answerOpt(parseInt(t.getAttribute('data-opt'), 10)); return; }
    if (t.hasAttribute('data-quiz')) { app.quizPick = parseInt(t.getAttribute('data-quiz'), 10); render(); return; }
    if (t.hasAttribute('data-puz')) {
      var kind = t.getAttribute('data-puz');
      app.puzzle = puzzleMake(kind === 'layer' ? 'layer' : parseInt(kind, 10));
      app.setup = null; app.units = []; app.moveAt = 0; app.awaitMove = false;
      app.quiz = null; app.quizPick = null; app.says = null;
      app.state = C.solved(); clearGlow(); renderCube();
      idleTile('A brand new muddle'); render(); return;
    }
    /* the grown up's tick. It changes nothing that is already flying: whole chants only means
       the chant she is in the middle of finishes the way it started, and the new setting picks
       up at the next one. */
    if (t.hasAttribute('data-know')) {
      var kid = t.getAttribute('data-know');
      setKnown(kid, !knowsChant(kid));
      renderStep(); return;
    }
    if (t.hasAttribute('data-preset')) { loadPreset(t.getAttribute('data-preset')); return; }
    if (t.hasAttribute('data-chant')) { playChant(t.getAttribute('data-chant'), parseInt(t.getAttribute('data-times'), 10)); return; }
    if (!act) return;
    if (act === 'side') {
      app.paintIntent = 'side'; app.mode = 'paint';
      app.sideHold = true; app.sideMsg = null; app.says = null;
      savePaint();
      idleTile('White at the floor'); render(); return;
    }
    if (act === 'side-ready') {
      app.sideHold = false; app.sideMsg = null; app.whiteDown = true; savePaint(); render(); return;
    }
    /* the way out of every painter state: ask once, then wipe the lot */
    if (act === 'start-again') { app.confirmReset = true; render(); return; }
    if (act === 'reset-no') { app.confirmReset = false; render(); return; }
    if (act === 'reset-yes') { startAgain(); return; }
    /* the standing rule, armed and disarmed from the painter itself, on any way in */
    if (act === 'set-white') {
      var wasAsking = !!app.inferQ;
      app.whiteDown = true; app.whiteMsg = null; savePaint();
      app.inferQ = null; app.inferSpot = null; app.inferRes = null; app.inferSkip = null;
      if (wasAsking) inferRun(); else render();
      return;
    }
    if (act === 'unpaint-ringed') {
      app.paintSuspects.forEach(function (sid) { app.paint[sid] = null; });
      app.paintSuspects = []; app.rejectKind = null; app.inferMsg = null;
      app.inferQ = null; app.inferSpot = null; app.inferRes = null; app.inferSkip = null;
      savePaint(); render(); return;
    }
    if (act === 'unset-white') {
      app.whiteDown = false; app.whiteMsg = null; savePaint();
      app.rejectKind = null; app.paintSuspects = []; app.inferMsg = null;
      app.inferQ = null; app.inferSpot = null; app.inferRes = null; app.inferSkip = null; render(); return;
    }
    if (act === 'undo') { if (app.undo.length) { app.state = app.undo.pop(); renderCube(); app.says = null; render(); } return; }
    if (act === 'reset') { app.state = C.solved(); app.undo = []; app.cheered = {}; app.diag = null; app.says = null; renderCube(); render(); return; }
    if (act === 'cubesays') { cubeSaysStart(); return; }
    if (act === 'fill-solved') { paintReset('solved'); savePaint(); render(); return; }
    if (act === 'fill-clear') { paintReset(); app.whiteDown = false; forgetPaint(); app.whiteMsg = null; render(); return; }
    if (act === 'fill-screen') { paintReset('screen'); savePaint(); render(); return; }
    if (act === 'infer') { app.inferAsked = 0; app.inferMsg = null; inferRun(); return; }
    if (act === 'infer-none') {
      app.inferQ = null; app.inferRes = null; app.inferSkip = null;
      app.inferMsg = { ok: false, text: 'Then one of the squares in the first picture is not quite right. Have another look at it, or paint the rest yourself.' };
      render(); return;
    }
    if (act === 'paint-rest') { app.paintPath = 'paint2'; app.inferQ = null; app.inferSpot = null; app.inferSkip = null; app.inferMsg = null; render(); return; }
    if (act === 'spot-yes') { inferSpotYes(); return; }
    if (act === 'spot-no') { inferSpotFix(); return; }
    if (act === 'check') { paintCheck(); return; }
    if (act === 'showturn') { demoTurnOver(); return; }
    if (act === 'tosolve') { app.mode = 'solve'; app.plan = null; app.diag = C.diagnose(app.state); app.says = null; render(); return; }
    if (act === 'puz-setup') { puzzleSetup(); return; }
    if (act === 'setup-again') { puzzleSetup(); return; }
    if (act === 'puz-screen' || act === 'puz-solve') {
      /* the state is KNOWN either way, so this is the identified path: she gets the countdown */
      app.state = C.clone(app.puzzle.state);
      app.setup = null; app.units = []; app.moveAt = 0; app.awaitMove = false;
      app.undo = []; app.cheered = {}; app.usedShowMe = false; app.guide = null;
      clearGlow(); renderCube();
      app.mode = 'solve'; app.diag = C.diagnose(app.state);
      startSolve(null); return;
    }
    if (act === 'puz-mine') {
      app.state = C.clone(app.puzzle.state);
      app.setup = null; app.units = []; app.moveAt = 0; app.awaitMove = false;
      app.undo = []; app.cheered = {}; app.guide = null;
      clearGlow(); renderCube();
      app.mode = 'solve'; app.level = 'solo'; app.plan = null; app.diag = C.diagnose(app.state);
      app.says = null; render(); return;
    }
    if (act === 'coach') { app.mode = 'solve'; app.usedShowMe = false; app.cheered = {}; app.guide = null; startSolve(null); return; }
    if (act === 'guide') { guideStart(); return; }
    if (act === 'guide-stop') { guideStop(); return; }
    if (act === 'guide-again') { guideDemo(); return; }
    if (act === 'guide-step') { guideGo(app.guide ? app.guide.id : null, true); return; }
    if (act === 'guide-back') { guideBack(); return; }
    if (act === 'practice') {
      app.guide = null;
      app.state = practiceState();
      app.whiteDown = true; savePaint();
      app.undo = []; app.cheered = {}; app.usedShowMe = false;
      renderCube(); idleTile('White layer done, chants to practise');
      app.mode = 'solve'; startSolve(null); return;
    }
    if (act === 'fullscramble') {
      app.guide = null;
      app.state = C.randomState(18 + Math.floor(Math.random() * 8));
      app.whiteDown = false; savePaint();
      app.undo = []; app.cheered = {}; app.usedShowMe = false;
      renderCube(); idleTile('Full scramble');
      app.mode = 'solve'; startSolve(null); return;
    }
    if (act === 'player-rate') { setRate(app.playRate === 1 ? 2 : 1); return; }
    if (act === 'player-play') { playerPlay(); return; }
    if (act === 'player-pause') { playerPause(false); return; }
    if (act === 'player-fwd') { playerPause(false); playerFwd(); return; }
    if (act === 'player-back') { playerBack(); return; }
    if (act === 'block-again') { restartBlock(); return; }
    if (act === 'demo-again') { watchAgain(); return; }
    if (act === 'next') { app.auto = false; advance(); return; }
    if (act === 'prev') { app.auto = false; goBack(); return; }
    if (act === 'play') { app.auto = true; advance(); return; }
    if (act === 'pause') { app.auto = false; render(); return; }
    if (act === 'restart') { app.plan = null; app.diag = C.diagnose(app.state); app.says = null; render(); return; }
    if (act === 'showme') {
      app.usedShowMe = true; app.askState = (app.askState === 'askingAfter') ? 'doneAfter' : 'done';
      say('No problem. Watch this one and try the next.', '');
      var b = beat();
      render();
      if (app.askState === 'doneAfter') setTimeout(function () { beatDone(b); }, 500); else setTimeout(advance, 500);
      return;
    }
    if (act === 'nudge') { nudge(); return; }
    if (act === 'undochant') { undoChant(); return; }
  });

  /* painting taps */
  $('panel').addEventListener('click', function (e) {
    var s = e.target.closest('polygon.sticker');
    if (!s || app.mode !== 'paint') return;
    var sid = parseInt(s.getAttribute('data-sid'), 10);
    if (app.sideHold) {
      app.sideMsg = 'Hold your cube with the side you finished pointing at the floor first, then tap the button.';
      render();
      return;
    }
    /* no silent path into the second picture: it only takes paint once the hold is checked */
    if (sid >= firstViewCount() && !app.holdOk) {
      app.paintPath = 'paint2';
      app.holdMsg = { ok: false, text: 'The second picture is locked until I know how you are holding your cube. Do the three turns below, then answer the question.' };
      render();
      return;
    }
    app.paint[sid] = app.paintColour;
    app.paintSuspects = [];
    app.inferQ = null; app.inferSpot = null; app.inferRes = null; app.inferFilled = null; app.inferSkip = null;
    /* a whole side painted one colour is knowledge the moment the last square lands */
    autoPinPainted();
    app.rejectKind = null;
    /* AND: can I finish it from here? The moment only a handful of cubes are left she should be
       offered the way out, not left painting squares I could have worked out. */
    checkHandover();
    savePaint();
    render();
  });

  /* tapping a block on the 3D cube (coach questions) */
  $('stage').addEventListener('click', function (e) {
    var c = e.target.closest('.cubie');
    if (!c || app.busy) return;
    if (app.mode !== 'solve' || app.askState !== 'asking') return;
    if (big()) {
      var key = c.getAttribute('data-piece');
      if (key) answerTap3(key.charAt(0), parseInt(key.slice(1), 10));
      return;
    }
    var k = parseInt(c.getAttribute('data-cubie'), 10);
    answerTap(k, C.slotOf(app.state, k));
  });

  function scramble(n) {
    if (app.busy) return;
    app.undo.push(C.clone(app.state));
    app.busy = true;
    app.cheered = {}; app.diag = null; app.plan = null;
    var list = C.randomScramble(n);
    playMoves(list, 190, null, function () { app.busy = false; idleTile('Messed up in ' + n + ' turns'); say('Right, that is a mess. Go to Solve with me when you are ready.', ''); render(); });
  }
  function loadPreset(id) {
    var p = C.PRESETS.filter(function (x) { return x.id === id; })[0];
    if (!p || app.busy) return;
    app.state = C.presetState(p);
    app.undo = []; app.cheered = {}; app.plan = null; app.diag = C.diagnose(app.state);
    app.quiz = p.quiz; app.quizPick = null; app.quizFor = id;
    app.says = null;
    renderCube(); idleTile(p.name); render();
  }
  /* the same three named turns the words say, played one at a time */
  function demoTurnOver() {
    if (app.busy) return;
    app.busy = true;
    var before = C.clone(app.state), i = 0;
    (function step() {
      if (i >= HOLD_TURNS.length) {
        setTimeout(function () {
          app.state = before; renderCube(); app.busy = false;
          idleTile('That is the turn'); render();
        }, 1600);
        return;
      }
      turnWhole(HOLD_TURNS[i++], 560, step);
    })();
  }
  function nudge() {
    var p = C.buildPlan(app.state);
    if (!p.ok || !p.beats.length) { app.nudge = 'I cannot read that one. Try Match my cube.'; render(); return; }
    var b = p.beats[0], i = 0;
    while (b && !b.moves.length && i < p.beats.length - 1) { i++; b = p.beats[i]; }
    app.nudge = esc(b.say) + (b.moves.length ? ' <b>' + esc(b.moves.join(' ')) + '</b>' : '');
    render();
  }

  /* ---------------------------------------------------------------- which cube */
  var stash = {};
  function headline() {
    $('headline').textContent = big() ? 'Eight steps, six chants' : 'Three steps, two chants';
    $('subline').textContent = big()
      ? 'The middle squares never move. They tell you where every block belongs.'
      : 'The best day is the day you do not need me.';
    $('foot').textContent = big()
      ? 'Cube Quest Studio. Eight steps, six chants, the same words as your board.'
      : 'Cube Quest Studio. Same three steps, same two chants as your board.';
    Array.prototype.forEach.call(document.querySelectorAll('#sizeswitch button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-size') === String(app.size) ? 'true' : 'false');
    });
  }
  function switchSize(n) {
    if (app.busy || app.size === n) return;
    speakStop();
    stash[app.size] = { state: app.state, scheme: app.scheme, undo: app.undo, paint: app.paint, cheered: app.cheered };
    app.size = n; C = (n === 3) ? C3 : C2;
    var st = stash[n];
    app.state = st ? st.state : C.solved();
    app.scheme = st ? st.scheme : C.PLAIN_SCHEME;
    app.undo = st ? st.undo : [];
    app.paint = new Array(n === 3 ? 54 : 24).fill(null);
    app.whiteDown = false; app.whiteMsg = null;
    app.cheered = st ? st.cheered : {};
    app.plan = null; app.idx = 0; app.askState = null; app.auto = false; app.nudge = null;
    app.puzzle = null; app.setup = null; app.playing = false; app.playMsg = null;
    app.guide = null; app.guideWhy = ''; app.guideChant = null; app.guideAsk = false;
    app.diag = null; app.quiz = null; app.quizPick = null; app.drill = null; app.chantUndo = null; app.cubeSays = null;
    app.paintMsg = null; app.paintSuspects = []; app.usedShowMe = false; app.fromFace = false;
    app.holdOk = false; app.holdMsg = null; app.holdNeed = [];
    app.paintPath = 'infer'; app.inferRes = null; app.inferQ = null; app.inferSpot = null;
    app.inferMsg = null; app.inferFilled = null; app.inferAsked = 0; app.inferSkip = null;
    app.sideHold = false; app.sideMsg = null; app.confirmReset = false;
    restorePaint(n);
    buildCube(); buildPads(); applyCam(true);
    setTimeout(function () { applyCam(false); }, 60);
    headline();
    idleTile('Ready when you are');
    say(big()
      ? 'The big cube, 26 blocks. Press a move button and watch what happens. Nothing you press can break it.'
      : 'The small cube, 8 blocks. Press a move button and watch what happens. Nothing you press can break it.', '');
    if (app.mode === 'solve') app.diag = C.diagnose(app.state);
    render();
  }

  /* ---------------------------------------------------------------- peek */
  var peek = { x: 0, y: 0, on: false, sx: 0, sy: 0 };
  function applyCam(instant) {
    var c = $('cube3d');
    c.classList.toggle('nofade', !!instant);
    c.style.transform = 'rotateX(' + (-24 + peek.x) + 'deg) rotateY(' + (-34 + peek.y) + 'deg)';
  }
  var stage = $('stage');
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.cubie') && app.askState === 'asking') return;
    peek.on = true; peek.sx = e.clientX; peek.sy = e.clientY;
    stage.classList.add('peeking'); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!peek.on) return;
    peek.y = Math.max(-165, Math.min(165, (e.clientX - peek.sx) * 0.7));
    peek.x = Math.max(-45, Math.min(60, -(e.clientY - peek.sy) * 0.5));
    applyCam(true);
  });
  function springBack() {
    if (!peek.on) return;
    peek.on = false; peek.x = 0; peek.y = 0;
    stage.classList.remove('peeking');
    applyCam(false);
  }
  stage.addEventListener('pointerup', springBack);
  stage.addEventListener('pointercancel', springBack);
  stage.addEventListener('pointerleave', springBack);

  var sb = $('speakBtn');
  if (CAN_SPEAK) {
    sb.hidden = false;
    app.speak = loadSpeak();
    sb.textContent = app.speak ? 'Voice on' : 'Voice off';
    sb.addEventListener('click', function () {
      app.speak = !app.speak;
      saveSpeak();
      sb.textContent = app.speak ? 'Voice on' : 'Voice off';
      speakStop();
      if (!app.speak) return;
      if (app.guide) { var gn = guideNode(); if (gn) speakText(guideSpeech(gn)); return; }
      if (app.mode === 'solve' && app.plan) speakBeat(beat());
    });
  } else {
    app.speak = false;
  }

  var pb = $('peekBtn');
  function holdPeek() { peek.on = true; peek.y = 150; peek.x = 12; applyCam(false); }
  function dropPeek() { peek.on = true; springBack(); }
  pb.addEventListener('pointerdown', holdPeek);
  pb.addEventListener('pointerup', dropPeek);
  pb.addEventListener('pointerleave', dropPeek);
  pb.addEventListener('focus', holdPeek);
  pb.addEventListener('blur', dropPeek);

  /* ---------------------------------------------------------------- go */
  restorePaint(2);
  buildCube();
  buildPads();
  headline();
  applyCam(true);
  setTimeout(function () { applyCam(false); }, 60);
  idleTile('Ready when you are');
  say('Press a move button and watch what happens. Nothing you press can break it.', '');
  render();
  window.STUDIO = app;
})();
</script>
</body>
</html>
