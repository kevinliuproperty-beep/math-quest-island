<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Oral Quest</title>
<style>
:root{
  --ground:#FFF7E4; --paper:#FFFFFF; --ink:#2B2540; --ink-soft:#6B6480; --line:#EADFC4;
  --accent:#F4622E; --accent-ink:#FFFFFF; --teal:#1FA9A0; --teal-soft:#D9F3F0;
  --gold:#FFC53D; --gold-soft:#FFF0C2; --plum-soft:#EFE8FF; --rose:#E85D75;
  --shadow:0 6px 0 rgba(43,37,64,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1B1826; --paper:#262238; --ink:#F4EFFF; --ink-soft:#B4ACCB; --line:#3A3550;
    --accent:#FF7A45; --accent-ink:#1B1826; --teal:#3AD1C6; --teal-soft:#1E3F3E;
    --gold:#FFC53D; --gold-soft:#4A3A12; --plum-soft:#332C4E; --rose:#FF7E93;
    --shadow:0 6px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#1B1826; --paper:#262238; --ink:#F4EFFF; --ink-soft:#B4ACCB; --line:#3A3550;
  --accent:#FF7A45; --accent-ink:#1B1826; --teal:#3AD1C6; --teal-soft:#1E3F3E;
  --gold:#FFC53D; --gold-soft:#4A3A12; --plum-soft:#332C4E; --rose:#FF7E93;
  --shadow:0 6px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5;padding-block:0 48px;padding-inline:16px}
h1,h2,h3,.display{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;min-height:44px}
html{-webkit-text-size-adjust:100%}
/* iPad: one tap is one tap, never the double-tap zoom wobble */
button,.tab,.chip,.quest,.sitelinks a,summary{touch-action:manipulation;-webkit-tap-highlight-color:rgba(31,169,160,.28)}
.chip{min-height:44px;display:inline-flex;align-items:center}
.sitelinks{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px}
.sitelinks a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink-soft);text-decoration:none;font-weight:800;font-size:.8rem;letter-spacing:.06em}
.sitelinks a:active{transform:translateY(2px)}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.5rem}
.brand small{display:block;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.starbank{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border:2px solid var(--gold);border-radius:999px;padding:6px 14px 6px 10px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.starbank svg{width:24px;height:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-block:8px 18px}
.tab{flex:1 1 120px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 12px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);transition:transform .12s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tab:active{transform:translateY(3px);box-shadow:none}
.tab .dot{width:12px;height:12px;border-radius:50%;background:var(--teal);flex:none}
.tab[data-m="read"] .dot{background:var(--teal)}
.tab[data-m="talk"] .dot{background:var(--gold)}
/* stage */
.stage{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.eyebrow{font-weight:800;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.stage h2{font-size:1.7rem;margin-bottom:6px}
.lead{color:var(--ink-soft);margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 20px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:1.1rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:var(--plum-soft);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.08)}
.btn.teal{background:var(--teal);color:#fff}
.btn.small{padding:8px 14px;font-size:.95rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
/* home */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:8px}
.quest{border:2px solid var(--line);border-radius:18px;padding:16px;background:var(--ground);display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);font-family:inherit}
.quest .display{font-size:1.25rem}
.quest p{margin:0;color:var(--ink-soft);font-size:.95rem}
.quest .prog{margin-top:auto;padding-top:8px;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.tips{margin-top:20px;border-top:2px dashed var(--line);padding-top:16px}
.tips h3{font-size:1.1rem;margin-bottom:8px}
.tips ul{margin:0;padding-left:20px;color:var(--ink-soft)}
.tips li{margin-bottom:4px}
/* passage */
.passage{font-size:1.45rem;line-height:1.75;margin:16px 0;padding:18px 22px;background:var(--ground);border-radius:18px;border:2px solid var(--line)}
.passage p{margin:0 0 .9em}
.passage p:last-child{margin-bottom:0}
.passage .title{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:1.6rem;display:block;margin-bottom:.4em}
.hints .pause{display:inline-block;width:.35em;height:.35em;border-radius:50%;background:var(--teal);margin:0 .12em 0 .05em;vertical-align:middle}
.hints .stop{display:inline-block;width:.55em;height:.55em;border-radius:3px;background:var(--accent);margin:0 .2em 0 .08em;vertical-align:middle}
.hints .q{color:var(--rose);font-weight:800}
.hints .say{background:var(--plum-soft);border-radius:6px;padding:0 4px}
.hints .big{font-weight:800;color:var(--accent)}
.timer{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:2.4rem;font-variant-numeric:tabular-nums;line-height:1;min-width:110px}
.timer.warn{color:var(--accent)}
.ring{display:flex;align-items:center;gap:14px;padding:10px 0}
.label{font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--ink-soft);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* stimulus */
.stim{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--ground);margin:12px 0}
.stim svg{display:block;width:100%;height:auto;max-width:100%}
.qcard{background:var(--gold-soft);border:2px solid var(--gold);border-radius:18px;padding:16px 18px;margin:14px 0}
.qcard .who{font-weight:800;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.qcard .qtext{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;font-size:1.45rem;line-height:1.35}
.helpers{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:2px solid var(--teal);background:var(--teal-soft);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem}
.steps{display:flex;gap:6px;margin:8px 0 2px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--gold)}
.steps i.done{background:var(--teal)}
/* done button caption */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);padding:12px 22px;border-radius:999px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:1.15rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
details.parent{margin-top:16px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--ground)}
details.parent summary{cursor:pointer;font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);min-height:44px;display:flex;align-items:center;gap:6px}
details.parent ul{margin:8px 0 0;padding-left:20px;color:var(--ink-soft);font-size:.95rem}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.stage{padding:18px 16px}.passage{font-size:1.3rem;padding:14px 16px}.brand h1{font-size:1.3rem}}
</style>
</head>

<div class="wrap">
  <nav class="sitelinks" aria-label="Other apps">
    <a href="/">← Math Quest Island</a>

  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-m="home" aria-selected="true">Home</button>

  <div class="stage" id="stage"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- CONTENT ---------- */
const PASSAGES = [
{title:"The Lost Kitten", text:[
"On Saturday morning, Mei Ling heard a tiny sound outside her flat. \"Meow! Meow!\" She opened the door and found a small grey kitten shivering on the doormat.",
"\"Oh, you poor thing!\" she said softly. \"Where is your mummy?\"",
"Mei Ling wrapped the kitten in a warm towel and gave it a saucer of milk. Then she made a poster and stuck it on the notice board downstairs. That evening, an old man knocked on her door. \"Thank you for finding Snowy,\" he said with a big smile. Mei Ling felt proud, but a little sad too."]},
{title:"Sports Day Surprise", text:[
"It was Sports Day at Greenview Primary School. Raj stood at the starting line, his heart beating fast. He had practised every evening for two weeks.",
"\"On your marks, get set, GO!\" shouted Mr Tan.",
"Raj ran as fast as he could. Halfway through the race, he heard a shout. His friend Ahmad had tripped and fallen! Raj stopped, turned back and helped Ahmad to his feet. They crossed the finish line together, last of all. Raj did not win a medal, but when the whole school cheered, he knew he had done the right thing."]},
{title:"Grandma's Kueh", text:[
"Every Sunday, Grandma makes ondeh-ondeh in her small kitchen. \"Come and help me, Wei Jie,\" she calls. \"Wash your hands first!\"",
"Wei Jie loves rolling the green dough into little balls. He hides a piece of gula melaka inside each one, just like Grandma taught him. Then he rolls them in fresh coconut.",
"\"Careful, they are hot!\" Grandma warns as she lifts them out of the pot. Wei Jie waits, but not for long. He pops one into his mouth. Sweet syrup bursts out. \"Delicious!\" he says. Grandma laughs. \"You are my best helper.\""]},
{title:"The Rainy Recess", text:[
"Dark clouds filled the sky just before recess. Suddenly, there was a loud crash of thunder. Rain poured down and the whole field turned into a big brown puddle.",
"\"Oh no!\" groaned Farhan. \"Now we cannot play football.\"",
"Siti had an idea. \"Let's play a board game in the classroom instead,\" she suggested. Soon, six friends were sitting in a circle, laughing and rolling dice. When the bell rang, Farhan looked out of the window. The sun was shining again. \"That was the best recess ever,\" he said. \"Can we play again tomorrow?\""]},
{title:"A Trip to the Zoo", text:[
"Last week, Primary Three went on a learning journey to the zoo. Devi could not stop smiling. She had never seen a real giraffe before.",
"\"Look at its long neck!\" she whispered to her partner, Lucas. \"It is taller than our classroom!\"",
"At the elephant show, one elephant sprayed water with its trunk. Some of the water splashed onto Mrs Lim's shoes. Everyone giggled, and even Mrs Lim laughed. On the bus home, Devi wrote in her journal: \"Today I learnt that animals need us to protect their homes. I want to be a zookeeper when I grow up.\""]},
{title:"The Broken Robot", text:[
"Ethan's little brother, Jayden, had borrowed his favourite toy robot without asking. Now the robot's arm was broken. Ethan was furious.",
"\"Why did you touch my things?\" he shouted. Jayden's eyes filled with tears. \"I'm sorry,\" he sobbed. \"I only wanted to play with you.\"",
"Ethan took a deep breath. He remembered how lonely he had felt when he was five. Slowly, he picked up the robot. \"Let's fix it together,\" he said. They found some glue in the drawer. An hour later, the robot's arm was as good as new, and the two brothers were laughing again."]},
{title:"The Void Deck Wedding", text:[
"On Sunday morning, Priya heard drums booming under her block. She ran to the lift and pressed the button seven times.",
"\"Aunty, what is happening downstairs?\" she asked her neighbour, Mdm Salmah.\n\"There is a wedding at the void deck,\" Mdm Salmah laughed. \"Come and see!\"",
"The void deck was covered with red cloth and yellow flowers. A photographer climbed onto a plastic chair, waving his arms. Priya watched the bride walk slowly past the bicycle racks, her dress glistening in the sunlight. Someone handed Priya a small box of cake. She ate it on the stairs, grinning, with the drums still booming in her ears."]},
{title:"Lost on the MRT", text:[
"The train doors closed before Daniel could step out. He pressed his palms against the glass and watched his mother grow smaller on the platform.",
"\"Get off at the next station and wait there,\" a voice called. It was Uncle Raju, his neighbour, holding a bag of vegetables.\n\"But what if she cannot find me?\" Daniel whispered.",
"\"She will. Mothers always do.\" At Bishan, Daniel stood beside the station control room and counted to one hundred. Before he reached eighty, his mother came running down the escalator. \"Daniel!\" she cried, and hugged him so tightly that he squeaked."]},
{title:"The Chicken Rice Queue", text:[
"The queue at the hawker centre stretched past three stalls. Marcus groaned and shifted from foot to foot.",
"\"Must we wait so long?\" he asked. \"I am starving!\"\n\"Good food is worth waiting for, boy,\" his grandfather said.",
"A cat wandered under the tables, hunting for scraps. The uncle at the stall chopped chicken so quickly that his cleaver blurred. When their plates finally arrived, the rice was warm and fragrant and the cucumber was cold. Marcus took one bite and forgot every minute of the wait. His grandfather watched him and laughed quietly, saying nothing at all."]},
{title:"The CCA Audition", text:[
"Nadia clutched her recorder outside the music room. Inside, the teacher was listening to another girl play.",
"\"Your hands are shaking,\" said her friend Jun Kai.\n\"I know!\" Nadia whispered. \"What if I forget the notes?\"\n\"Then play slowly. Slow sounds confident.\"",
"Her name was called. Nadia walked in reluctantly, sat down and lifted the recorder to her lips. The first note wobbled. The second was clear, and the third was clearer still. When she finished, Mrs Fernandez wrote something on her clipboard and smiled. Nadia never found out what it said, but on Friday her name was on the band list."]},
{title:"The Wet Market Fish", text:[
"Ice glistened on the trays at the wet market. Aisyah held her mother's hand and stared at one silver fish with a very round eye.",
"\"Is it looking at me?\" she asked.\n\"Fish cannot see once they are on ice,\" her mother laughed. \"Choose one for dinner!\"",
"Aisyah pointed at the smallest fish on the tray. The fishmonger wrapped it in newspaper and handed it over with a wink. On the way home, the heavy plastic bag bumped against Aisyah's knee at every step. That night, she ate two bowls of rice and told her father the whole story, twice."]},
{title:"The Night Before NDP", text:[
"Fireworks practice began at eight o'clock. Ryan dragged a chair onto the corridor and climbed up to see over the parapet.",
"\"Careful!\" his sister Elise shouted. \"You will fall.\"\n\"Just one more minute,\" he said. \"Can you see the red one?\"",
"The sky cracked open in gold and green. Below, the whole block seemed to be outside, and somebody on the fifth floor cheered every time a rocket burst. Elise stopped scolding and climbed onto the chair beside him. They watched until the last spark faded and the neighbourhood went quiet again, smelling faintly of smoke."]},
{title:"The Library Card", text:[
"Jerome had lost his library card twice already. When he lost it a third time, he did not tell anybody.",
"\"Where is your card?\" asked the librarian, Miss Chan.\n\"I think it is at home,\" Jerome mumbled, staring hard at the counter.\n\"Then we shall make a new one!\" she said. \"But this time, keep it inside your wallet.\"",
"Jerome nodded so hard that his fringe bounced. He wrote his name on the fresh card carefully, letter by letter, and pushed it deep into the pocket of his wallet. That was in January, and he has not lost it since."]},
{title:"The School Bus Song", text:[
"Every morning, the school bus turned three corners before it reached Hafiz's block. On Wednesday, the bus was very late.",
"\"Uncle, why so slow today?\" Hafiz asked the driver.\n\"Traffic jam near the expressway,\" the driver sighed. \"Sit down first.\"\n\"We will be late!\" groaned Hafiz.",
"Somebody at the back began to sing an old National Day song, and soon half the bus had joined in. Hafiz sang too, though he only knew the chorus. When they finally reached school they were eleven minutes late, and nobody, not even the discipline master, seemed able to stay cross with them."]},
{title:"Reunion Dinner", text:[
"The table was so crowded that Grandma had to put the soup on a stool. Cousins squeezed onto the benches, elbow to elbow.",
"\"Where is the yu sheng?\" shouted Uncle Terence from the kitchen.\n\"Coming, coming!\" Grandma called back.",
"When the plate arrived, everybody stood up with chopsticks raised. They tossed the shredded vegetables high, shouting good wishes, and strips of carrot landed on the floor and in Zara's hair. Grandma laughed until she had to wipe her eyes. Later, Zara found a piece of pomelo behind her ear and decided it was the best dinner of the year."]},
{title:"Hari Raya Visiting", text:[
"Green packets bulged in Farah's pocket by the third house. Her feet ached, but the rendang at Aunty Zaitun's flat was worth the long walk.",
"\"Can we go home soon?\" her little brother whispered. \"I am so full!\"\n\"One more house,\" Farah replied. \"Then we go home, I promise.\"",
"At the last flat, an old uncle asked the two of them to sing. Farah's brother hid behind her legs and refused, so Farah sang alone, off key and much too fast. Everybody clapped anyway. Walking home, her brother held her hand the whole way and did not complain once."]},
{title:"The Sentosa Cable Car", text:[
"The cable car swung gently as it left the tower. Far below, the sea glittered and the ships looked like toys.",
"\"Do not lean on the door!\" gasped Mrs Devi, gripping the seat. \"Are you trying to frighten me?\"\n\"It is locked, Ma,\" said Arun, though he sat back anyway.",
"A seagull drifted past the window, so close that Arun could see its yellow eye. Halfway across, the cabin stopped for a moment and swayed, and even Arun held his breath. Then it moved again. When they stepped out at Sentosa, Mrs Devi announced that she would be taking the bus home, and she meant it."]},
{title:"The Recess Bell", text:[
"Somebody had drawn a hopscotch grid in chalk beside the canteen. By the time Shermaine arrived, eight children were already queueing to play.",
"\"Can I join?\" she asked.\n\"You are last,\" said a boy called Amirul. \"But you can join.\"",
"Shermaine waited, hopping on the spot. When her turn came at last, she threw her eraser onto the fourth square and hopped the whole way without wobbling once. \"Not bad!\" said Amirul, and the others cheered. Then the bell rang, loud and rude, and everybody groaned and trudged back to class."]}
];

/* ---------- STATE ---------- */
const KEY="oralquest-v1";
let S = {stars:0, readDone:{}, talkDone:{}, mode:"home", readIdx:0, talkIdx:0, qi:0, phase:"prep", prepRunning:false};
let saved=null; try{saved=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
function persist(){ try{localStorage.setItem(KEY,JSON.stringify({stars:S.stars,readDone:S.readDone,talkDone:S.talkDone}))}catch(e){} }

const stage=document.getElementById("stage");
const toastEl=document.getElementById("toast");
let tInt=null, tStart=0, tLeft=60;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove("show"),1800)}
function addStars(n){ if(!n)return; S.stars+=n; persist(); document.getElementById("starcount").textContent=S.stars; const b=document.getElementById("starbank"); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); toast(n===1?"⭐ 1 star!":`⭐ ${n} stars!`); }
function stopTimer(){clearInterval(tInt);tInt=null}
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,"0")}`}

function setMode(m){ stopTimer(); S.prepRunning=false; S.mode=m; S.phase="prep"; S.qi=0; document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.m===m)); render(); window.scrollTo({top:0}); }
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setMode(t.dataset.m)));

/* ---------- RENDERERS ---------- */
function render(){
  stage.classList.remove("pop"); void stage.offsetWidth; stage.classList.add("pop");
  if(S.mode==="read") renderRead();
  else if(S.mode==="talk") renderTalk();
  else { S.mode="home"; renderHome(); }
}

function renderHome(){
  const rd=Object.keys(S.readDone).length, td=Object.keys(S.talkDone).length;
  stage.innerHTML=`
   <p class="eyebrow">Monday's exam · two parts</p>
   <h2>Ready, hero?</h2>
   <p class="lead">Pick a quest. A grown-up is your examiner and taps the star. Do a little every day, not everything at once.</p>
   <div class="home-grid">
     <button class="quest" data-go="read"><span class="display">Reading Aloud</span><p>Read a story clearly with pauses and expression, just like the exam.</p><span class="prog">${rd} of ${PASSAGES.length} stories done</span></button>
     <button class="quest" data-go="talk"><span class="display">Picture Talk</span><p>Look at a poster, answer the examiner's three questions in full sentences.</p><span class="prog">${td} of ${STIMULI.length} pictures done</span></button>
   </div>
   <div class="tips">
     <h3>Exam-day secrets</h3>
     <ul>
       <li><b>Reading:</b> use the preparation time to spot full stops, question marks and speech marks. Finger under the line is fine.</li>
       <li><b>Picture talk:</b> answer, then say <b>because</b>, then give an example. Three sentences beats one word.</li>
       <li>If you don't understand, say: <i>"Could you repeat the question, please?"</i> That is allowed.</li>
       <li>Sit up, look at the teacher, smile. Slow is better than fast.</li>
     </ul>
   </div>`;
  stage.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.go)));
}

/* Reading Aloud */
function markup(text){
  return text.split("\n").map(p=>{
    let out="", inQ=false;
    for(const ch of p){
      if(ch==='"'){ inQ=!inQ; out+= inQ? '<span class="say">"' : '"</span>'; continue; }
      if(ch===','){ out+=',<span class="pause" title="short pause"></span>'; continue; }
      if(ch==='.'){ out+='.<span class="stop" title="stop, breathe"></span>'; continue; }
      if(ch==='?'||ch==='!'){ out+=`<span class="q">${ch}</span><span class="stop"></span>`; continue; }
      out+=esc(ch);
    }
    out=out.replace(/\b(GO|shouted|exclaimed|gasped|giggled|whispered|sobbed|groaned|cheered|yelled|cried|laughed|sighed|wailed|mumbled|furious|Delicious|enormous|Careful)\b/g,'<span class="big">$1</span>');
    return `<p>${out}</p>`;
  }).join("");
}
function renderRead(){
  stopTimer();
  const p=PASSAGES[S.readIdx%PASSAGES.length];
  const hints=S.hints!==false;
  const body=p.text.join("\n");
  stage.innerHTML=`
   <p class="eyebrow">Reading Aloud · story ${S.readIdx%PASSAGES.length+1} of ${PASSAGES.length} ${S.readDone[S.readIdx%PASSAGES.length]?"· ✓ done":""}</p>
   <h2>${esc(p.title)}</h2>
   <p class="lead" id="readLead">${S.phase==="prep"?"Get ready: read it silently. Find the full stops, the questions and who is talking. Then press Start.":S.phase==="go"?"Read aloud now. Slow, clear, with feeling.":"Nice reading. Tap the star button to save it and go to the next story."}</p>
   <div class="ring">
     <div class="timer" id="timer">${S.phase==="prep"?fmt(60):S.phase==="go"?"0:00":fmt(S.elapsed||0)}</div>
     <div>
       <span class="label" id="tlabel">${S.phase==="prep"?"Preparation time":S.phase==="go"?"Reading time":"Your time"}</span>
       <div class="row" style="margin-top:6px">
         ${S.phase==="prep"?`<button class="btn small ghost" id="prepBtn">Start 1-min prep</button><button class="btn small" id="goBtn">Start reading</button>`:""}
         ${S.phase==="go"?`<button class="btn small" id="stopBtn">I finished!</button>`:""}
         ${S.phase==="rate"?`<button class="btn small ghost" id="againBtn">Read again</button>`:""}
       </div>
     </div>
   </div>
   <div class="passage ${hints?"hints":""}" id="passage"><span class="title">${esc(p.title)}</span>${markup(body)}</div>
   <div class="row" style="justify-content:space-between">
     <button class="btn ghost small" id="hintBtn">${hints?"Hide reading hints":"Show reading hints"}</button>
     <div class="legend" ${hints?"":"hidden"}><span><i class="pause" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal)"></i> tiny pause</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent)"></i> stop &amp; breathe</span><span><i style="display:inline-block;width:14px;height:12px;border-radius:3px;background:var(--plum-soft)"></i> someone talking</span></div>
   </div>
   ${S.phase==="rate"?`<div class="row" id="doneRow" style="margin-top:14px"><button class="btn" id="doneRead">Done! Next ⭐</button><span class="label">One story, one star</span></div>`:""}
   <div class="row" style="margin-top:12px">
     <button class="btn ghost" id="prevP">◀ Story</button>
     <button class="btn ghost" id="nextP">Story ▶</button>
   </div>
   <details class="parent"><summary>For the examiner</summary><ul><li>Real exam: about 1 minute to prepare, then read the whole passage. Examiner may say "Please begin."</li><li>Common slips: dropped word endings, no pause at commas, flat voice on "?" and "!", speeding up in the last two lines.</li></ul></details>`;
  const timer=stage.querySelector("#timer");
  const hb=stage.querySelector("#hintBtn"); hb.onclick=()=>{S.hints=!hints;renderRead()};
  stage.querySelector("#prevP").onclick=()=>{stopTimer();S.prepRunning=false;S.readIdx=(S.readIdx-1+PASSAGES.length)%PASSAGES.length;S.phase="prep";renderRead()};
  stage.querySelector("#nextP").onclick=()=>{stopTimer();S.prepRunning=false;S.readIdx=(S.readIdx+1)%PASSAGES.length;S.phase="prep";renderRead()};
  if(S.phase==="prep"){
    const pb=stage.querySelector("#prepBtn");
    const runPrep=()=>{ stopTimer(); pb.disabled=true; timer.textContent=fmt(Math.max(tLeft,0)); if(tLeft<=10)timer.classList.add("warn");
      tInt=setInterval(()=>{tLeft--; timer.textContent=fmt(Math.max(tLeft,0)); if(tLeft<=10)timer.classList.add("warn"); if(tLeft<=0){stopTimer();S.prepRunning=false;toast("Time's up. Please begin!");}},1000); };
    if(S.prepRunning && tLeft>0) runPrep();
    pb.onclick=()=>{ tLeft=60; S.prepRunning=true; timer.classList.remove("warn"); runPrep(); };
    stage.querySelector("#goBtn").onclick=()=>{ stopTimer(); S.prepRunning=false; S.phase="go"; tStart=Date.now(); renderRead(); };
  }
  if(S.phase==="go"){
    tInt=setInterval(()=>{timer.textContent=fmt(Math.floor((Date.now()-tStart)/1000))},250);
    stage.querySelector("#stopBtn").onclick=()=>{stopTimer();S.elapsed=Math.floor((Date.now()-tStart)/1000);S.phase="rate";renderRead();stage.querySelector("#doneRow")?.scrollIntoView({behavior:"smooth",block:"center"})};
  }
  if(S.phase==="rate"){
    stage.querySelector("#againBtn").onclick=()=>{S.prepRunning=false;S.phase="prep";renderRead()};
    stage.querySelector("#doneRead").onclick=()=>{ S.readDone[S.readIdx%PASSAGES.length]=true; addStars(1); S.prepRunning=false; S.phase="prep"; S.readIdx=(S.readIdx+1)%PASSAGES.length; renderRead(); window.scrollTo({top:0,behavior:"smooth"}); };
  }
}

/* Picture Talk */
function renderTalk(){
  const st=STIMULI[S.talkIdx%STIMULI.length];
  const qn=Math.min(S.qi,st.qs.length);
  const rating=qn>=st.qs.length;
  const q=st.qs[Math.min(qn,st.qs.length-1)];
  stage.innerHTML=`
   <p class="eyebrow">Picture Talk · picture ${S.talkIdx%STIMULI.length+1} of ${STIMULI.length} ${S.talkDone[S.talkIdx%STIMULI.length]?"· ✓ done":""}</p>
   <h2>${esc(st.title)}</h2>
   <p class="lead">${rating?"Great talking. Tap the star button to save it and go to the next picture.":"Look carefully for 30 seconds. The examiner reads each question aloud. Answer in full sentences."}</p>
   <div class="stim">${st.svg()}</div>
   <div class="steps">${st.qs.map((_,i)=>`<i class="${i<qn?"done":i===qn?"on":""}"></i>`).join("")}</div>
   ${rating?`<div class="row" id="doneRow" style="margin-top:14px"><button class="btn" id="doneTalk">Done! Next ⭐</button><span class="label">One picture, one star</span></div>`:`
   <div class="qcard"><div class="who">Examiner asks · question ${qn+1} of ${st.qs.length}</div><div class="qtext">${esc(q.q)}</div></div>
   <span class="label">Sentence helpers</span>
   <div class="helpers">${q.h.map(h=>`<span class="chip">${esc(h)}</span>`).join("")}</div>
   <div class="row" style="margin-top:12px">
     ${qn>0?`<button class="btn ghost" id="backQ">◀ Back</button>`:""}
     <button class="btn" id="nextQ">${qn===st.qs.length-1?"Finish & rate":"Next question ▶"}</button>
   </div>`}
   <div class="row" style="margin-top:14px">
     <button class="btn ghost small" id="prevS">◀ Picture</button>
     <button class="btn ghost small" id="nextS">Picture ▶</button>
   </div>
   <details class="parent"><summary>For the examiner</summary><ul><li>Real exam: the same picture is shown during Reading Aloud, then the teacher asks 2 to 3 questions that move from the picture to the child's own life to their opinion.</li><li>Goal answer shape: <b>Answer → because → example</b>. Three sentences.</li></ul></details>`;
  stage.querySelector("#prevS").onclick=()=>{S.talkIdx=(S.talkIdx-1+STIMULI.length)%STIMULI.length;S.qi=0;renderTalk()};
  stage.querySelector("#nextS").onclick=()=>{S.talkIdx=(S.talkIdx+1)%STIMULI.length;S.qi=0;renderTalk()};
  if(!rating){
    stage.querySelector("#nextQ").onclick=()=>{S.qi++;renderTalk();(S.qi<st.qs.length?stage.querySelector(".qcard"):stage.querySelector("#doneRow"))?.scrollIntoView({behavior:"smooth",block:"center"})};
    const b=stage.querySelector("#backQ"); if(b)b.onclick=()=>{S.qi--;renderTalk()};
  } else {
    stage.querySelector("#doneTalk").onclick=()=>{ S.talkDone[S.talkIdx%STIMULI.length]=true; addStars(1); S.qi=0; S.talkIdx=(S.talkIdx+1)%STIMULI.length; renderTalk(); window.scrollTo({top:0,behavior:"smooth"}); };
  }
}

/* ---------- BOOT ---------- */
function start(hot){
  if(hot && hot.stars!==undefined){ S=Object.assign(S,hot); }
  else if(saved){ S=Object.assign(S,saved); }
  document.getElementById("starcount").textContent=S.stars;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.m===S.mode));
  S.prepRunning=false; S.phase="prep"; render();
}
start(null);
</script>
