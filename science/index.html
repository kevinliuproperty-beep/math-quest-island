<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Vercel serves this page at /science with NO trailing slash, which would resolve
     topics/*.js to /topics/*.js (404, empty home). Pin the base so both URLs work. -->
<base href="/science/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Science Quest</title>
<link rel="icon" href="data:,">
<style>
:root{
  --ground:#FFF7E4; --paper:#FFFFFF; --ink:#2B2540; --ink-soft:#6B6480; --line:#EADFC4;
  --accent:#F4622E; --accent-ink:#FFFFFF; --teal:#1FA9A0; --teal-soft:#D9F3F0;
  --gold:#FFC53D; --gold-soft:#FFF0C2; --plum-soft:#EFE8FF; --rose:#E85D75; --rose-soft:#FDE3E8;
  --leaf:#3FA34D; --shadow:0 6px 0 rgba(43,37,64,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1B1826; --paper:#262238; --ink:#F4EFFF; --ink-soft:#B4ACCB; --line:#3A3550;
    --accent:#FF7A45; --accent-ink:#1B1826; --teal:#3AD1C6; --teal-soft:#1E3F3E;
    --gold:#FFC53D; --gold-soft:#4A3A12; --plum-soft:#332C4E; --rose:#FF7E93; --rose-soft:#4A2330;
    --leaf:#6FD27C; --shadow:0 6px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#1B1826; --paper:#262238; --ink:#F4EFFF; --ink-soft:#B4ACCB; --line:#3A3550;
  --accent:#FF7A45; --accent-ink:#1B1826; --teal:#3AD1C6; --teal-soft:#1E3F3E;
  --gold:#FFC53D; --gold-soft:#4A3A12; --plum-soft:#332C4E; --rose:#FF7E93; --rose-soft:#4A2330;
  --leaf:#6FD27C; --shadow:0 6px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5;padding-block:0 48px;padding-inline:16px;overflow-x:hidden}
h1,h2,h3,.display{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;min-height:44px;color:inherit}
button,a,.opt,.tile,summary,label.key{touch-action:manipulation;-webkit-tap-highlight-color:rgba(31,169,160,.28)}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto}
.sitelinks{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px}
.sitelinks a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink-soft);text-decoration:none;font-weight:800;font-size:.8rem;letter-spacing:.06em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .logo{font-size:2rem;line-height:1}
.brand h1{font-size:1.5rem}
.brand small{display:block;font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.stage{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.eyebrow{font-weight:800;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.stage h2{font-size:1.6rem;margin-bottom:6px}
.lead{color:var(--ink-soft);margin:0 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:14px;padding:12px 20px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:1.1rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:var(--plum-soft);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.08)}
.btn.teal{background:var(--teal);color:#fff}
.btn.small{padding:8px 14px;font-size:.95rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--ink-soft);font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:6px 0}
/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px}
.tile{border:2px solid var(--line);border-radius:18px;padding:14px;background:var(--ground);display:flex;flex-direction:column;gap:4px;text-align:left;font-family:inherit;color:var(--ink);box-shadow:var(--shadow);transition:transform .1s}
.tile:active{transform:translateY(3px);box-shadow:none}
.tile .em{font-size:2rem;line-height:1.1}
.tile .display{font-size:1.1rem;line-height:1.25}
.tile small{color:var(--ink-soft);font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.pct{font-weight:800;font-size:.8rem;color:var(--teal);letter-spacing:.06em}
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}
.tile.wide{flex-direction:row;align-items:center;gap:14px;background:var(--gold-soft);border-color:var(--gold)}
.badge{display:inline-block;background:var(--plum-soft);color:var(--ink);border-radius:99px;padding:1px 8px}
.tile.wide.alt{background:var(--rose-soft);border-color:var(--rose)}
/* Power-Up (2026-10-17): charge, not failure. Batteries fill teal and glow gold when full; never red, never a % */
.tile.wide.power{background:var(--teal-soft);border-color:var(--teal)}
.batt{display:inline-flex;align-items:center;gap:3px;padding:3px 5px 3px 4px;border:2px solid var(--ink-soft);border-radius:7px;position:relative;margin-right:6px;vertical-align:middle;flex:none}
.batt::after{content:"";position:absolute;right:-6px;top:50%;width:4px;height:9px;transform:translateY(-50%);background:var(--ink-soft);border-radius:0 3px 3px 0}
.batt i{display:block;width:13px;height:14px;border-radius:3px;background:var(--line)}
.batt i.on{background:var(--teal)}
.batt.full{border-color:var(--gold)}
.batt.full::after{background:var(--gold)}
.batt.full i{background:var(--gold)}
.powers{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.powers li{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px 4px 8px;font-weight:700;font-size:.9rem}
.powers li.full{border-color:var(--gold);background:var(--gold-soft)}
.powers li small{color:var(--ink-soft);font-weight:700;margin-left:4px}
.pchip{display:inline-flex;align-items:center;gap:2px;text-transform:none;letter-spacing:.02em}
.pclose{font-size:1.15rem;margin:6px 0 4px}
.pnext{font-size:1.1rem;margin:4px 0 14px;color:var(--ink)}
.tile.wide .em{font-size:2.4rem}
.tile.wide p{margin:2px 0 0;color:var(--ink-soft);font-size:.92rem}
.section{margin-top:20px}
.section h3{font-size:1.1rem;margin-bottom:6px}
/* learn */
.card{background:var(--ground);border:2px solid var(--line);border-radius:20px;padding:20px;min-height:220px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.card h3{font-size:1.3rem;margin-bottom:10px}
.card p{margin:0 0 .6em;font-size:1.15rem;line-height:1.6;white-space:pre-line}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--teal)}
/* quiz */
.steps{display:flex;gap:4px;margin:8px 0 14px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--gold)}
.steps i.ok{background:var(--teal)}
.steps i.bad{background:var(--ink-soft);opacity:.55}   /* a miss is a pip to learn from, not a red mark */
.steps i.part{background:var(--gold)}
/* exam navigator (Exam Navigator lane, 2026-10-07): WineQuiz's numbered grid -
   current (ringed), answered (filled), not answered (outline), flagged (corner) */
.qnav{margin-top:16px;border-top:2px dashed var(--line);padding-top:12px}
.qnav .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.qnav .grp b{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);width:100%}
.qn{position:relative;width:44px;height:44px;min-height:44px;padding:0;border:2px solid var(--line);border-radius:12px;background:var(--paper);font-weight:800;font-size:1rem;color:var(--ink-soft);overflow:hidden}
.qn.done{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}
.qn.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);color:var(--ink)}
.qn.flag::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent var(--accent) transparent transparent}
.btn.flagon{background:var(--gold-soft);color:var(--ink);box-shadow:0 0 0 2px var(--gold) inset}
.handin{width:100%;margin-top:10px}
.cfm{border:2px solid var(--gold);background:var(--gold-soft);border-radius:18px;padding:16px;margin-top:6px}
.cfm p{margin:6px 0}
.cfm .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.fig{border:2px solid var(--line);border-radius:16px;background:#fff;color:#2B2540;padding:8px;margin:0 0 14px;overflow-x:auto;max-width:100%}
.fig svg{display:block;width:100%;max-width:640px;max-height:min(60vh,520px);height:auto;margin:0 auto}
.fig table{border-collapse:collapse;margin:0 auto;min-width:min(100%,360px);font-size:1rem;background:#fff;color:#2B2540}
.fig th,.fig td{border:1.5px solid #9C94B0;padding:6px 10px;text-align:center;vertical-align:middle}
.fig th{background:#F3EEFF;font-weight:700}
@media (max-width:420px){.fig th,.fig td{padding:6px 6px}}
.fig caption{caption-side:top;font-weight:700;padding:4px;color:#2B2540}
.stem{font-size:1.2rem;line-height:1.55;margin:0 0 14px;white-space:pre-line}
.marks{display:inline-block;font-weight:800;font-size:.85rem;color:var(--ink-soft);margin-left:6px;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--ground);border-radius:14px;padding:12px 14px;font-size:1.08rem;line-height:1.4;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt .n{font-weight:800;color:var(--ink-soft);flex:none;min-width:2em}
.opt.picked{border-color:var(--gold);background:var(--gold-soft)}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;border:2px solid var(--line);background:var(--ground)}
.fb.ok{border-color:var(--teal);background:var(--teal-soft)}
.fb b.h{display:block;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-size:1.15rem;margin-bottom:2px}
.fb p{margin:4px 0 0;white-space:pre-line}
.fb.hint{border-color:var(--gold);background:var(--gold-soft)}
.fb p.reveal{border-left:4px solid var(--gold);padding-left:10px}
.fb .fig{margin:10px 0 0}
/* F13: figure beside the question on wide screens (see renderQuiz) */
@media (min-width:1100px){
  body.quizfig .wrap{max-width:1180px}
  .qgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
  .qfig{position:sticky;top:12px}
  .qfig .fig svg{max-height:calc(100vh - 290px)}
  .qsolo{max-width:720px;margin:0 auto}   /* same wide stage for every question, so the navigator does not jump */
}
/* Coaching walk-through (C6, 2026-10-17): kind framing, technique badge, steps one at a time, answer last */
.opt.mine{border-color:var(--gold);background:var(--gold-soft)}
.opt.tried{border-style:dashed;border-color:var(--ink-soft);opacity:.75}
.opt .tag{margin-left:auto;flex:none;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding-left:8px;align-self:center}
.fb.coach{border-color:var(--line);background:var(--plum-soft)}
.fb.coach .cyou{margin:6px 0 0}
.fb.coach .cline{margin:6px 0 0}
.techrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:12px 0 4px}
.tech{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--teal);background:var(--teal-soft);color:var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-size:.85rem;letter-spacing:.04em}
.techrow small{color:var(--ink-soft);font-size:.9rem}
ol.csteps{margin:8px 0 4px;padding-left:1.6em;display:flex;flex-direction:column;gap:6px}
ol.csteps li{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;line-height:1.45}
ol.csteps li::marker{font-weight:800;color:var(--teal)}
.fb.coach .btn{margin-top:8px}
.cans{margin-top:12px;border:2px solid var(--teal);background:var(--teal-soft);border-radius:12px;padding:10px 12px}
.cans .h{display:block;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-size:1.1rem;font-weight:600;margin:0}
.cans .model{margin-top:0}
.cans p.close{font-weight:700;margin-top:8px}
.cans .row{margin-top:10px}
.cans.bare{background:none;border:0;padding:0}
.cans details.more{margin-top:6px}
.cans details.more summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
/* hintFigure lives in the answer reveal, shown last (conn ruling 2026-10-17): the steps run on the plain figure */
.hfig{margin-top:10px}
.hfig .figlab{margin:0 0 6px}
.hfig .fig{margin:0}
.hfig .fig svg{max-height:min(48vh,420px)}
ul.rev .tech{font-size:.75rem;padding:0 8px;margin-left:6px;vertical-align:middle}
ul.rev .row{margin-top:8px}
.well{font-size:1.1rem;margin:4px 0 6px}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:1.1rem;background:var(--ground);color:var(--ink);resize:vertical}
.model{background:var(--teal-soft);border:2px solid var(--teal);border-radius:14px;padding:12px 14px;margin-top:14px}
.model p{margin:4px 0 0;font-size:1.1rem;white-space:pre-line}
.model mark{background:var(--gold);color:#2B2540;border-radius:4px;padding:0 2px}
.yours{margin-top:10px;font-size:1rem;color:var(--ink-soft);white-space:pre-line}
.keys{display:flex;flex-direction:column;gap:8px;margin-top:12px}
label.key{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);cursor:pointer;min-height:48px}
label.key input{width:26px;height:26px;flex:none;accent-color:var(--teal)}
label.key.on{border-color:var(--teal)}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.timer{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--accent)}
.score{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-size:3rem;font-weight:700;line-height:1;margin:8px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:.98rem}
table.tbl th,table.tbl td{padding:8px 6px;border-bottom:1.5px solid var(--line);text-align:left;vertical-align:top}
table.tbl th{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
ul.rev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.rev li{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--ground)}
ul.rev .r{font-weight:800;margin-right:6px}
ul.rev small{display:block;color:var(--ink-soft);margin-top:4px;white-space:pre-line}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.choice button{border:2px solid var(--line);background:var(--ground);border-radius:12px;padding:8px 14px;font-weight:700}
.choice button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--ground)}
.empty{color:var(--ink-soft);padding:12px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);padding:12px 22px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Fun layer (Science Fun Layer Card, 2026-10-17): ported from the maths island - Star Crystals per land,
   place names on the map, the hero greeting, a short tap-to-skip banner, light confetti, optional sound.
   Rewards follow learning (finish a round, a comeback after a miss, a battery filling); never speed. */
.hello{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-weight:700;color:var(--ink)}
.hello .av{font-size:1.8rem;line-height:1}
.crystot{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);border:2px solid var(--gold);border-radius:999px;padding:2px 12px;font-weight:800;font-size:.9rem;margin:4px 0 10px}
.tile .place{color:var(--ink);font-weight:800;font-size:.82rem;letter-spacing:.02em;text-transform:none}
.crys{display:inline-flex;gap:2px;font-size:1rem;line-height:1;letter-spacing:0}
.crys .no{opacity:.35;filter:grayscale(1)}
.tile.done{border-color:var(--gold)}
.howcrys{margin-top:14px;color:var(--ink-soft);font-size:.92rem}
.howcrys summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center;color:var(--ink)}
.howcrys ul{margin:4px 0 0;padding-left:1.2em}
.crysbox{border:2px solid var(--gold);background:var(--gold-soft);border-radius:16px;padding:12px 14px;margin-top:16px}
.crysbox h3{font-size:1.1rem;margin:0 0 4px}
.crysbox p{margin:4px 0 0}
.crysbox .crys{font-size:1.4rem;gap:6px;margin:4px 0}
.fb .won{margin:6px 0 0;font-weight:800}
.sndbtn{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;color:var(--ink-soft)}
.sndbtn[aria-pressed="true"]{border-color:var(--teal);color:var(--ink)}
.cele{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:var(--paper);color:var(--ink);border:3px solid var(--gold);border-radius:999px;padding:10px 22px;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-weight:700;font-size:1.1rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center;min-height:44px;animation:celeIn .35s ease-out}
.cele[hidden]{display:none}
@keyframes celeIn{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.05);opacity:1}100%{transform:translateX(-50%) scale(1)}}
.confetti{position:fixed;top:-24px;font-size:20px;z-index:55;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){
  .stage{padding:18px 14px;border-radius:20px}
  .brand h1{font-size:1.3rem}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:12px}
  .stem{font-size:1.12rem}
  .fig{padding:6px}
  .fig{padding:4px}
  .fig table{font-size:.8rem;line-height:1.3}
  .fig th,.fig td{padding:4px 3px;overflow-wrap:break-word;hyphens:auto}
  .fig caption{font-size:.85rem}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="sitelinks" aria-label="Other apps">
    <a href="/">← Math Quest Island</a>
    <a href="/oral">🎤 Oral Quest</a>
  </nav>
  <div class="top">
    <button class="brand" data-act="home" aria-label="Science Quest home">
      <span class="logo">🔬</span>
      <span><small>Primary 3 Science</small><h1>Science Quest</h1></span>
    </button>
    <button class="sndbtn" id="sndbtn" data-act="sound" aria-pressed="false">🔇 Sound off</button>
  </div>
  <main class="stage" id="view" aria-live="polite"></main>
</div>
<div class="toast" id="toast"></div>
<div class="cele" id="cele" role="status" data-act="celeOff" title="Tap to close" hidden></div>

<script>
"use strict";
/* ---------- SCI: the topic registry the content files call ----------
   Content contract: "P3 Science Brief — 2026-10-06" (vault). A topic file calls
   SCI.registerTopic({...}). Anything malformed is dropped with a console.warn so one
   bad item (or one bad file) never takes the app down. */
(function () {
  var topics = [], byId = {}, items = {}, warnings = [];
  function warn(msg) { warnings.push(msg); try { console.warn('[SCI] ' + msg); } catch (e) {} }
  function str(x) { return typeof x === 'string' && x.trim().length > 0; }
  function okItem(it, tid) {
    if (!it || !str(it.id)) { warn(tid + ': item without id dropped'); return false; }
    if (items[it.id]) { warn(tid + ': duplicate item id ' + it.id + ' dropped'); return false; }
    if (!str(it.stem)) { warn(it.id + ': no stem, dropped'); return false; }
    if (it.type === 'mcq') {
      if (!Array.isArray(it.options) || it.options.length < 2) { warn(it.id + ': mcq needs options'); return false; }
      if (!(Number.isInteger(it.answer) && it.answer >= 0 && it.answer < it.options.length)) { warn(it.id + ': answer out of range'); return false; }
      return true;
    }
    if (it.type === 'oeq') {
      if (!str(it.model)) { warn(it.id + ': oeq without model answer dropped'); return false; }
      return true;
    }
    warn(it.id + ': unknown type ' + it.type); return false;
  }
  window.SCI = {
    topics: topics, byId: byId, items: items, warnings: warnings,
    registerTopic: function (t) {
      try {
        if (!t || !str(t.id)) { warn('topic without id ignored'); return; }
        if (byId[t.id]) { warn('topic ' + t.id + ' registered twice; second ignored'); return; }
        var clean = [];
        (Array.isArray(t.items) ? t.items : []).forEach(function (it) {
          if (!okItem(it, t.id)) return;
          var level = [1, 2, 3].indexOf(it.level) >= 0 ? it.level : 2;
          var o = { id: it.id, topic: t.id, type: it.type, level: level, stem: it.stem,
            figure: typeof it.figure === 'string' && it.figure.trim() ? it.figure : null,
            explain: str(it.explain) ? it.explain : '' };
          /* x17 (2026-10-17): hint ladder [nudge, reveal] + optional reveal figure; syllabus tag */
          if (Array.isArray(it.hints)) { var hs = it.hints.filter(str).map(String).slice(0, 2); if (hs.length) o.hints = hs; }
          if (str(it.hintFigure)) o.hintFigure = it.hintFigure;
          if (str(it.syl)) o.syl = String(it.syl);
          /* Coaching (C6, 2026-10-17): technique name, 3-5 think-aloud steps, per-choice coaching.
             Anything malformed is simply left off, so the item falls back to the explain review. */
          if (str(it.technique)) o.technique = String(it.technique).trim();
          if (Array.isArray(it.steps)) { var st = it.steps.filter(str).map(String).slice(0, 5); if (st.length) o.steps = st; }
          if (it.type === 'mcq' && it.optionFeedback && typeof it.optionFeedback === 'object') {
            var of = {}, nof = 0;
            Object.keys(it.optionFeedback).forEach(function (key) {
              var ix = +key;
              if (Number.isInteger(ix) && ix >= 0 && ix < it.options.length && ix !== it.answer && str(it.optionFeedback[key])) { of[ix] = String(it.optionFeedback[key]); nof++; }
            });
            if (nof) o.optionFeedback = of;
          }
          if (it.type === 'mcq') { o.options = it.options.map(String); o.answer = it.answer; o.marks = 2; }   /* SG EOY Section A: 2 marks per MCQ */
          else {
            o.model = it.model;
            var keys = Array.isArray(it.keys) ? it.keys.map(function (k) {
              return (Array.isArray(k) ? k : [k]).filter(str).map(String);
            }).filter(function (k) { return k.length; }) : [];
            o.keys = keys.length ? keys : [['the whole answer']];
            o.noKeys = !keys.length;
            o.marks = Number.isInteger(it.marks) && it.marks > 0 ? it.marks : o.keys.length;
          }
          items[o.id] = o; clean.push(o);
        });
        var topic = { id: t.id, title: str(t.title) ? t.title : t.id, emoji: str(t.emoji) ? t.emoji : '🔬',
          theme: str(t.theme) ? t.theme : '', extra: t.extra === true || t.id === 'plant-parts',
          hidden: t.hidden === true,   /* off the child's path: no home tile, mock, Power-Up; parent page P4 section only */
          moeRef: str(t.moeRef) ? t.moeRef : '',
          notes: (Array.isArray(t.notes) ? t.notes : []).filter(function (n) { return n && (str(n.title) || str(n.body)); }),
          items: clean };
        byId[t.id] = topic; topics.push(topic);
      } catch (e) { warn('registerTopic failed for ' + (t && t.id) + ': ' + e.message); }
    }
  };
})();
</script>

<script>
"use strict";
(function () {
var SCI = window.SCI;
var KEY = 'sq1';
var ORDER = ['living-things', 'materials', 'life-cycles', 'magnets', 'plant-parts', 'process-skills'];
var view = document.getElementById('view');

/* ---------- storage (per-viewer, try/catch-wrapped) ---------- */
/* power (Power-Up, 2026-10-17): { <technique, or 'topic:<id>' for an item without one>: { s: 0-2 clean rights in a row, full, t } }.
   Same key, same v: 1 store; an older save simply gets an empty power map from fresh(). */
/* crys (fun layer, 2026-10-17): { <topic id>: { e: t, c: t, p: t } } Star Crystals rescued, kept once rescued.
   sound: off unless she turns it on. */
function fresh() { return { v: 1, items: {}, notes: {}, exams: [], timer: true, size: 'full', power: {}, crys: {}, sound: false }; }
function load() {
  try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === 1 && s.items) return Object.assign(fresh(), s); } catch (e) {}
  return fresh();
}
var S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
/* hinted: she used the nudge (an MCQ first miss, or the OEQ hint button). r.h counts those, r.lh is the latest try. */
function record(it, score, hinted) {
  var r = S.items[it.id] || (S.items[it.id] = { a: 0, c: 0, miss: 0, last: 0, t: 0 });
  r.a += 1; r.c = Math.round((r.c + score) * 1000) / 1000; r.last = score; r.t = Date.now();
  if (score < 1) r.miss += 1;
  if (hinted) r.h = (r.h || 0) + 1;
  r.lh = !!hinted;
  charge(it, hinted ? Math.min(score, 0.5) : score);
}
/* Power meter: two clean rights in a row on a technique fill its bar. A full miss empties it and puts it
   back in rotation. A half (right on the second try, or with the hint) breaks the run; on a full bar it
   leaves one cell and re-opens it, so one more clean right refills it. */
function charge(it, score) {
  if (!S.power || typeof S.power !== 'object') S.power = {};
  var k = pkey(it), p = S.power[k] || (S.power[k] = { s: 0, full: false, t: 0 });
  if (score >= 1) { p.s = Math.min(2, p.s + 1); if (p.s >= 2) p.full = true; }
  else if (score <= 0) { p.s = 0; p.full = false; }
  else if (p.full) { p.full = false; p.s = 1; }   /* a full bar keeps one cell: one more clean right refills it */
  else p.s = 0;   /* "two in a row" (card): a half breaks the run (refuter R7) */
  p.t = Date.now();
}
function pkey(it) { return it.technique || 'topic:' + it.topic; }

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pct(x) { return Math.round(x * 100) + '%'; }
var toastT;
function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 1800); }

/* ---------- fun layer (Science Fun Layer Card, 2026-10-17) ----------
   Ported from the maths island so the two feel like one game: an island map with named lands (the
   science place names are new), Star Crystals to rescue (three per land), the hero she picked on the maths island, a short banner,
   light confetti and optional sound. Not ported: monster HP, lost lives, timers, streaks,
   the Hall of Fame. Every crystal is earned by learning, never by speed or by being right first time. */
var PLACES = { 'living-things': 'Wild Woods', 'materials': 'Material Mines', 'life-cycles': 'Butterfly Bay',
  'magnets': 'Magnet Mountain', 'plant-parts': 'Leafy Lagoon', 'process-skills': 'Experiment Cove' };
function place(t) { return PLACES[t.id] || t.title; }
var CRYS = [
  { k: 'e', em: '🧭', name: 'Explorer crystal', how: 'Finish a practice round in this land.' },
  { k: 'c', em: '💪', name: 'Comeback crystal', how: 'Have another go after a miss, and get it right.' },
  { k: 'p', em: '⚡', name: 'Power crystal', how: 'Fill up a power battery with a question from this land.' }

function crysOf(id) { if (!S.crys || typeof S.crys !== 'object') S.crys = {}; return S.crys[id] || {}; }
function crysCount(id) { var c = crysOf(id); return CRYS.filter(function (x) { return c[x.k]; }).length; }
function crysHTML(id) {
  var c = crysOf(id), n = crysCount(id);
  return '<span class="crys" role="img" aria-label="' + n + ' of 3 Star Crystals">' +
    CRYS.map(function (x) { return (c[x.k] ? '<span>⭐</span>' : '<span class="no">❔</span>'); }).join('') + '</span>';
}
/* a new crystal for a land; null if it was already rescued, or the land is hidden / not on the map */
function award(topicId, k) {
  var t = SCI.byId[topicId];
  if (!t || t.hidden || shownTopics().indexOf(t) < 0) return null;
  if (!S.crys || typeof S.crys !== 'object') S.crys = {};
  var c = S.crys[topicId] || (S.crys[topicId] = {});
  if (c[k]) return null;
  c[k] = Date.now();
  var x = CRYS.filter(function (y) { return y.k === k; })[0];
  return { t: topicId, k: k, em: x.em, name: x.name, land: place(t), all: crysCount(topicId) === 3 };
}
function wonLine(w) { return '⭐ ' + w.name + ' rescued in ' + w.land + '!' + (w.all ? " That's all 3 in this land! 🏝️" : ''); }
/* the hero she picked on the maths island (same site, same browser). Read only: science never writes it. */
function hero() {
  try { var d = JSON.parse(localStorage.getItem('fq1') || 'null'); if (d && typeof d.avatar === 'string' && d.avatar) return { av: d.avatar, name: typeof d.name === 'string' && d.name.trim() ? d.name.trim().slice(0, 14) : '' }; } catch (e) {}

}
function reducedMotion() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }
var celeT;
/* a short banner: shows for 2 s, tap to close, never covers the question for long */
function celebrate(msg, snd, burst) {
  var el = document.getElementById('cele'); el.textContent = msg; el.hidden = false;
  clearTimeout(celeT); celeT = setTimeout(function () { el.hidden = true; }, 2000);
  if (snd) sfx(snd);
  if (burst && !reducedMotion()) confetti();

  if (document.querySelector('.confetti')) return;   /* one light burst at a time */
  for (var i = 0; i < 16; i++) {
    var el = document.createElement('div');
    el.className = 'confetti'; el.setAttribute('aria-hidden', 'true');
    el.textContent = ['⭐', '✨', '🎉', '💛'][i % 4];
    el.style.left = Math.round(Math.random() * 96) + 'vw';
    el.style.animationDuration = (1.1 + Math.random() * 0.6).toFixed(2) + 's';
    el.style.animationDelay = (Math.random() * 0.3).toFixed(2) + 's';
    document.body.appendChild(el);
    setTimeout(function (n) { return function () { n.remove(); }; }(el), 2200);
  }
}
/* sound: off by default; only happy chimes, never a sound for a miss */
var AC = null;

  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(vol || 0.08, AC.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(AC.currentTime + t0); o.stop(AC.currentTime + t0 + dur + 0.05);
  } catch (e) {}
}
function sfx(kind) {
  if (!S.sound) return;
  if (kind === 'ok') { tone(523, 0, 0.1); tone(784, 0.09, 0.16); }
  else if (kind === 'crystal') { tone(659, 0, 0.1); tone(880, 0.09, 0.1); tone(1175, 0.18, 0.22); }
  else if (kind === 'finish') [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.12, 0.18); });
}
function sndBtn() {
  var b = document.getElementById('sndbtn'); if (!b) return;
  b.setAttribute('aria-pressed', String(!!S.sound)); b.textContent = S.sound ? '🔊 Sound on' : '🔇 Sound off';
}
/* after an answer in practice, Power-Up or "one like it" (never the mock): the comeback and power crystals */
function funAfter(it, a, score, prevLast, wasFull) {
  var se = session, won = [];
  if (score > 0 && (a.miss1 != null || (prevLast != null && prevLast < 1))) won.push(award(it.topic, 'c'));
  if (!wasFull && pstate(pkey(it)).full) won.push(award(it.topic, 'p'));   /* a battery filling (practice or Power-Up; refuter R1) */
  won = won.filter(Boolean);
  a.won = won;
  if (won.length) {
    se.won = (se.won || []).concat(won);
    save();
    celebrate(wonLine(won[won.length - 1]), 'crystal', true);
  } else if (score >= 1) sfx('ok');
}
/* crystals rescued in a "one like it" detour count for the round she came from (refuter R4) */
function carryWon() { if (session && session.back && session.won && session.won.length) session.back.won = (session.back.won || []).concat(session.won); }
function wonHTML(a) { return (a.won || []).map(function (w) { return '<p class="won">' + esc(wonLine(w)) + '</p>'; }).join(''); }
var PRAISE = ['✅ Correct!', '✅ Great thinking!', '✅ Nice one!', '✅ You got it!', '✅ Super!'];

function shownTopics() {
  var real = SCI.topics.filter(function (t) { return t.id.charAt(0) !== '_' && !t.hidden && t.items.length; });
  real.sort(function (a, b) {
    var ia = ORDER.indexOf(a.id), ib = ORDER.indexOf(b.id);
    return ((a.extra ? 1000 : 0) + (ia < 0 ? 99 : ia)) - ((b.extra ? 1000 : 0) + (ib < 0 ? 99 : ib));
  });
  var wantSample = /[?&]sample=1/.test(location.search);
  if (!real.length || wantSample) real = real.concat(SCI.topics.filter(function (t) { return t.id.charAt(0) === '_' && t.items.length; }));
  return real;
}
/* P4-preview topics (extra: true, e.g. plant-parts) stay out of the mock paper and Power-Up.
   Hidden topics (hidden: true, e.g. body-systems) never reach shownTopics(), so they are also off
   the home grid, the mock, Power-Up and anything else built on these two. */
function hiddenTopics() { return SCI.topics.filter(function (t) { return t.hidden && t.items.length; }); }
function examTopics() { return shownTopics().filter(function (t) { return !t.extra; }); }
function topicStats(t) {
  var att = 0, sc = 0, mastered = 0, seen = 0, notYet = 0;
  t.items.forEach(function (it) {
    var r = S.items[it.id]; if (!r) return;
    seen++; att += r.a; sc += r.c; if (r.last >= 1) mastered++; else notYet++;
  });
  return { n: t.items.length, seen: seen, att: att, acc: att ? sc / att : null, mastered: mastered, notYet: notYet,
    pct: t.items.length ? Math.round(mastered / t.items.length * 100) : 0 };
}
/* ---------- Power-Up (2026-10-17, replaces the old practise-again drill) ----------
   Kev: "something that focuses on the area that they are not strong at to reinforce", without
   demoralising. Groups her missed and hinted items by technique (an item without one groups by its
   topic), leads with the group she misses most, serves FRESH items of it first and re-serves missed
   ones only after that, opens with 1-2 warm-ups she is likely to get right, and charges a meter per
   technique. A full meter drops out of rotation until she misses it again. Never a count of misses. */
function pname(k) { if (k.indexOf('topic:') !== 0) return k; var t = SCI.byId[k.slice(6)]; return t ? t.title : k.slice(6); }
/* the name inside a sentence: quote names that carry a comma, a "?" or their own "and" (refuter R1/R2/R3/R5) */
function pq(k) { var n = pname(k); return /[,?]| and /.test(n) ? '“' + n + '”' : n; }
function pstate(k) { var p = S.power && S.power[k]; return p ? { s: p.s || 0, full: !!p.full } : { s: 0, full: false }; }
function needsPower(r) { return !!r && (r.last < 1 || !!r.lh); }
function powerPool() { var out = []; examTopics().forEach(function (t) { t.items.forEach(function (it) { out.push(it); }); }); return out; }
/* the groups in rotation, most-missed first: any group she has missed or needed a hint on, unless its bar is full */
function powerRotation() {
  var g = {}, out = [];
  powerPool().forEach(function (it) {
    var r = S.items[it.id]; if (!r || !((r.miss || 0) + (r.h || 0) > 0 || needsPower(r))) return;
    var k = pkey(it); if (pstate(k).full) return;
    var x = g[k] || (g[k] = { k: k, need: 0, now: 0, topics: {} });
    x.need += (r.miss || 0) + (r.h || 0) + (needsPower(r) ? 2 : 0);
    if (needsPower(r)) x.now++;
    x.topics[it.topic] = (x.topics[it.topic] || 0) + 1;
  });
  Object.keys(g).forEach(function (k) { out.push(g[k]); });
  out.sort(function (a, b) { return (b.need - a.need) || (b.now - a.now) || (a.k < b.k ? -1 : 1); });
  return out;
}
/* target items for one group: fresh ones first (her topics first, easier first), then the ones to re-serve */
function powerTargets(grp, n, used) {
  var all = powerPool().filter(function (it) { return pkey(it) === grp.k && !used[it.id]; });
  var tw = function (it) { return -(grp.topics[it.topic] || 0); };
  var fresh = shuffle(all.filter(function (it) { return !S.items[it.id]; }))
    .sort(function (a, b) { return (tw(a) - tw(b)) || (a.level - b.level); });
  var again = all.filter(function (it) { return needsPower(S.items[it.id]); })
    .sort(function (a, b) { return (S.items[b.id].miss - S.items[a.id].miss) || (a.level - b.level); });
  var rest = all.filter(function (it) { var r = S.items[it.id]; return r && !needsPower(r); })
    .sort(function (a, b) { return S.items[a.id].t - S.items[b.id].t; });
  return fresh.concat(again, rest).slice(0, n).sort(function (a, b) { return a.level - b.level; });
}
/* warm-ups: ones she got right cleanly before (easiest first), else easy unseen MCQs, from her lead topics */
function powerWarmups(lead, n, used) {
  var pool = powerPool().filter(function (it) { return !used[it.id] && !(lead && pkey(it) === lead.k); });
  var near = function (it) { return lead && lead.topics[it.topic] ? 0 : 1; };
  var known = shuffle(pool.filter(function (it) { var r = S.items[it.id]; return r && r.last >= 1 && !r.lh; }))
    .sort(function (a, b) { return (a.level - b.level) || ((a.type === 'mcq' ? 0 : 1) - (b.type === 'mcq' ? 0 : 1)) || (near(a) - near(b)); });
  var easy = shuffle(pool.filter(function (it) { return !S.items[it.id] && it.level === 1 && it.type === 'mcq'; }))
    .sort(function (a, b) { return near(a) - near(b); });
  return known.concat(easy).slice(0, n);
}
/* "Keep your powers charged": a mixed review, one item per group in turn, oldest-practised first */
function powerReview(n, used) {
  var g = {};
  shuffle(powerPool()).forEach(function (it) { if (!used[it.id]) (g[pkey(it)] = g[pkey(it)] || []).push(it); });
  var lists = shuffle(Object.keys(g)).map(function (k) {
    return g[k].sort(function (a, b) { var ra = S.items[a.id], rb = S.items[b.id]; return (ra ? ra.t : 0) - (rb ? rb.t : 0) || a.level - b.level; });
  });
  var out = [];
  for (var round = 0; out.length < n && round < 20; round++) lists.forEach(function (l) { if (out.length < n && l[round]) out.push(l[round]); });
  return out.sort(function (a, b) { return a.level - b.level; });
}
/* one round of 5-8: warm-ups, then the lead group, then a second group if there is one */
function powerRound() {
  var rot = powerRotation(), used = {}, mark = function (l) { l.forEach(function (it) { used[it.id] = 1; }); return l; };
  if (!rot.length) {
    var rv = mark(powerReview(6, used));
    return { items: rv, warm: 0, keys: [], review: true };
  }
  var lead = rot[0], second = rot[1] || null;
  var t1 = mark(powerTargets(lead, second ? 4 : 5, used));
  var t2 = second ? mark(powerTargets(second, 2, used)) : [];
  var warm = mark(powerWarmups(lead, t1.length + t2.length >= 4 ? 2 : 1, used));
  var list = warm.concat(t1, t2);
  if (list.length < 5) list = list.concat(mark(powerReview(5 - list.length, used)));
  return { items: list.slice(0, 8), warm: warm.length, keys: [lead.k].concat(second ? [second.k] : []), review: false };
}
function battHTML(k) {
  var p = pstate(k);
  return '<span class="batt' + (p.full ? ' full' : '') + '" role="img" aria-label="' + (p.full ? 'fully charged' : p.s ? 'charging' : 'ready to charge') + '">' +
    '<i class="' + (p.full || p.s >= 1 ? 'on' : '') + '"></i><i class="' + (p.full || p.s >= 2 ? 'on' : '') + '"></i></span>';
}
function powersHTML(keys) {
  return '<ul class="powers">' + keys.map(function (k) { var p = pstate(k);
    return '<li class="' + (p.full ? 'full' : '') + '">' + battHTML(k) + esc(pname(k)) + (p.full ? '<small>⚡ fully charged</small>' : '') + '</li>'; }).join('') + '</ul>';
}
/* every group she has started charging or has in rotation, for the home screen */
function powerKeys() {
  var seen = {}, out = [];
  powerRotation().forEach(function (g) { seen[g.k] = 1; out.push(g.k); });
  Object.keys(S.power || {}).forEach(function (k) { var p = S.power[k]; if (!seen[k] && p && (p.s > 0 || p.full)) { seen[k] = 1; out.push(k); } });
  return out;
}
function andList(a) {

/* weighting: missed items come back first, unseen next, mastered rarely */
function weight(it) { var r = S.items[it.id]; if (!r) return 3; if (r.last < 1) return 6 + Math.min(r.miss, 4); return 1; }
function pickWeighted(pool, k, avoid) {
  pool = pool.filter(function (it) { return !avoid || !avoid[it.id]; });
  var out = [];
  while (out.length < k && pool.length) {
    var tot = 0; pool.forEach(function (it) { tot += weight(it); });
    var x = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { x -= weight(pool[i]); if (x < 0) break; }

}
function byLevel(a, b) { return a.level - b.level; }
function practiceSet(t) {
  var m = t.items.filter(function (i) { return i.type === 'mcq'; }), o = t.items.filter(function (i) { return i.type === 'oeq'; });
  var nO = Math.min(4, o.length), nM = Math.min(10 - nO, m.length);
  if (nM + nO < 10) nO = Math.min(o.length, 10 - nM);
  return pickWeighted(m, nM).sort(byLevel).concat(pickWeighted(o, nO).sort(byLevel));
}
/* Real P3 EOY papers (12 school papers, 2024-25) split marks roughly evenly across the four
   content areas, with experiments embedded in each. Process skills is cross-cutting, so it
   gets half a share; every other topic gets one. */
var EXAM_WEIGHT = { 'process-skills': 0.5 };
function spreadPick(topics, type, k) {
  var used = {}, out = [], ts = shuffle(topics), guard = 0;
  var w = ts.map(function (t) { return EXAM_WEIGHT[t.id] != null ? EXAM_WEIGHT[t.id] : 1; });
  var tw = w.reduce(function (a, x) { return a + x; }, 0) || 1;
  var quota = w.map(function (x) { return Math.floor(k * x / tw); });
  var rest = k - quota.reduce(function (a, x) { return a + x; }, 0);
  /* hand the leftover seats out by largest remainder (ties broken by the shuffle) */
  ts.map(function (t, j) { return j; }).sort(function (x, y) { return (k * w[y] / tw - quota[y]) - (k * w[x] / tw - quota[x]); })
    .slice(0, rest).forEach(function (j) { quota[j]++; });
  ts.forEach(function (tt, j) {
    pickWeighted(tt.items.filter(function (i) { return i.type === type; }), quota[j], used).forEach(function (it) { used[it.id] = 1; out.push(it); });
  });
  while (out.length < k && guard++ < k * 10) {   /* a topic ran short: top up round-robin */
    var got = null;
    for (var j = 0; j < ts.length && !got; j++) {
      var tt = ts[(out.length + j) % ts.length];
      got = pickWeighted(tt.items.filter(function (i) { return i.type === type; }), 1, used)[0];
    }
    if (!got) break;
    used[got.id] = 1; out.push(got);
  }

}

/* ---------- marking-point highlight ---------- */
/* whole-word match (plural s/es allowed): "air" must not fire inside "fair test" */
function wordRe(syn) {
  return new RegExp('(^|[^a-z0-9-])(' + syn.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:e?s)?)(?=[^a-z0-9]|$)', 'g');
}
function highlight(text, keys) {
  var lo = text.toLowerCase(), ranges = [];
  keys.forEach(function (k) { k.forEach(function (syn) {
    var s = syn.toLowerCase(); if (!s) return;
    var re = wordRe(s), m;
    while ((m = re.exec(lo))) { var st = m.index + m[1].length; ranges.push([st, st + m[2].length]); if (!m[0].length) re.lastIndex++; }
  }); });
  ranges.sort(function (a, b) { return a[0] - b[0]; });
  var merged = [];
  ranges.forEach(function (r) { var l = merged[merged.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); });
  var out = '', pos = 0;
  merged.forEach(function (r) { out += esc(text.slice(pos, r[0])) + '<mark>' + esc(text.slice(r[0], r[1])) + '</mark>'; pos = r[1]; });
  return out + esc(text.slice(pos));
}

function startExam() {
  var ts = examTopics(), full = S.size !== 'short';
  var a = spreadPick(ts, 'mcq', full ? 21 : 8), b = spreadPick(ts, 'oeq', full ? 10 : 3);
  /* Section B of the real paper is 2-4 mark questions, ~28 marks in 10. Lift the
     marks total toward that by swapping the cheapest picks for unused bigger ones. */
  var target = Math.round(b.length * 2.8), used = {};
  b.forEach(function (it) { used[it.id] = 1; });
  var spare = [];
  ts.forEach(function (t) { t.items.forEach(function (it) { if (it.type === 'oeq' && !used[it.id]) spare.push(it); }); });
  spare = shuffle(spare);
  /* Swap the cheapest pick for a bigger question, same topic if possible, so the topic balance
     holds and the mark mix lands near the real paper (about 4 x 2, 4 x 3, 2 x 4 marks in 10):
     bring in 4-mark questions until a fifth of Section B is 4 marks, then the smallest bigger. */
  var want4 = Math.round(b.length * 0.2);
  for (var g = 0; g < 40; g++) {
    var tot = b.reduce(function (n, it) { return n + it.marks; }, 0);
    if (tot >= target || !spare.length) break;
    var lo = 0; b.forEach(function (it, k) { if (it.marks < b[lo].marks) lo = k; });
    var need4 = b.filter(function (it) { return it.marks >= 4; }).length < want4;
    var rank = function (it) {   /* lower is better; null = not a candidate */
      if (it.marks <= b[lo].marks) return null;
      var r = need4 ? (it.marks >= 4 ? 0 : 10 + it.marks) : it.marks;
      return r * 2 + (it.topic === b[lo].topic ? 0 : 1);
    };
    var best = -1, bestR = null;
    spare.forEach(function (it, k) { var r = rank(it); if (r != null && (bestR == null || r < bestR)) { best = k; bestR = r; } });
    if (best < 0) break;
    b[lo] = spare.splice(best, 1)[0];
  }
  b.sort(byLevel);
  var max = a.concat(b).reduce(function (n, it) { return n + it.marks; }, 0);
  var mins = full ? 75 : Math.max(10, Math.round(75 * max / 70));   /* EOY pace: 70 marks in 75 min */
  startSession('exam', 'Mock paper', a.concat(b), { nA: a.length, timerEnd: S.timer ? Date.now() + mins * 60000 : null, mins: mins, flags: [] });
}

  if (se.kind === 'exam') {

    se.items.forEach(function (it, k) { if (k < se.nA) { aGot += se.ans[k].score * it.marks; aMax += it.marks; } else { bGot += se.ans[k].score * it.marks; bMax += it.marks; } });
    h += '<p class="lead">Section A: ' + aGot + ' / ' + aMax + ' · Section B: ' + (Math.round(bGot * 10) / 10) + ' / ' + bMax + '</p>';
  }
  if (se.kind !== 'exam') {
    /* practice: wins first (what she powered up, crystals), then the marks, lower and quieter */
    var pu = [], ps = {};
    if (se.p0) se.items.forEach(function (it) { var k = pkey(it), b = se.p0[k] || { s: 0, full: false };
      if (!ps[k] && pstate(k).full && !b.full) { ps[k] = 1; pu.push(k); } });
    if (pu.length) h += '<p class="well">⚡ You powered up ' + esc(andList(pu.map(pq))) + ' today!</p>';
    h += crysBox(se);
    h += '<p class="lead section">This round: ' + got + ' of ' + max + ' marks. Every question you look at again makes you stronger.</p>';
  }
  h += '<div class="section"><h3>By topic</h3><table class="tbl"><tr><th>Topic</th><th class="num">Marks</th><th class="num">%</th></tr>' +
    ids.map(function (id) { var t = SCI.byId[id], b = by[id];
      return '<tr><td>' + esc(t ? t.emoji + ' ' + t.title : id) + '</td><td class="num">' + (Math.round(b.got * 10) / 10) + ' / ' + b.max + '</td><td class="num">' + pct(b.max ? b.got / b.max : 0) + '</td></tr>'; }).join('') +
    '</table></div>';
  if (missed.length) {
    h += '<div class="section"><div class="spread"><h3>🔍 Let\'s look again together</h3><button class="btn small teal" data-act="revGo" data-k="' + missed[0] + '">Start the walk-through →</button></div>' +
      '<p class="lead" style="margin:4px 0 10px">These are the ones to learn from. Each one comes with a walk-through.</p><ul class="rev">' + missed.map(function (k) {
      var it = se.items[k], a = se.ans[k];
      var gotK = Math.round((a.score || 0) * it.marks * 10) / 10;
      var mine = it.type === 'mcq' ? (a.choice != null ? 'You chose (' + (a.choice + 1) + ')' : 'Left blank') : gotK > 0 ? gotK + ' of ' + it.marks + ' marks' : 'Let\'s build this one';
      return '<li><span class="r">' + (a.score > 0 ? '½' : '🔍') + '</span>' + esc(it.stem) + (it.technique ? '<span class="tech">🧭 ' + esc(it.technique) + '</span>' : '') +
        '<small>' + esc(mine) + '</small><div class="row"><button class="btn ghost small" data-act="revGo" data-k="' + k + '">Walk me through it →</button></div></li>';
    }).join('') + '</ul></div>';
  }
  h += '<div class="nav">' + (missed.length ? '<button class="btn" data-act="retryMissed">Try these again</button>' : '<span></span>') +
    '<button class="btn ghost" data-act="home">Home</button></div>';
  paint(h);
  if (se.kind !== 'exam') finishCheer(se);   /* the mock report stays exactly as it was */
}
/* the Star Crystals panel on a practice report and the Power-Up close: what she found, then the next one to find */
function crysBox(se) {
  var won = se.won || [], t = se.topicId ? SCI.byId[se.topicId] : null;
  var land = t && !t.hidden && shownTopics().indexOf(t) >= 0 ? t : null;
  if (!land && !won.length) return '';
  var h = '<div class="crysbox section">';
  if (land) {
    var c = crysOf(land.id), next = CRYS.filter(function (x) { return !c[x.k]; })[0];
    h += '<h3>⭐ Star Crystals · ' + esc(land.emoji + ' ' + place(land)) + '</h3>' + crysHTML(land.id);
    won.forEach(function (w) { h += '<p><b>' + esc(w.em + ' ' + w.name) + '</b> rescued' + (w.t !== land.id ? ' in ' + esc(w.land) : '') + '!</p>'; });
    h += next ? '<p>Next, look for the ' + esc(next.em + ' ' + next.name) + '. ' + esc(next.how) + '</p>'
              : '<p>🏝️ You rescued all 3 Star Crystals in ' + esc(place(land)) + '!</p>';
  } else {
    h += '<h3>⭐ Star Crystals rescued today</h3>';
    won.forEach(function (w) { h += '<p><b>' + esc(w.em + ' ' + w.name) + '</b> in ' + esc(w.land) + (w.all ? ". That's all 3 there! 🏝️" : '') + '</p>'; });
  }
  return h + '</div>';
}
/* once per finished round: a short banner (and confetti unless reduced motion) for finishing */
function finishCheer(se) {
  if (se.cheered) return; se.cheered = true;
  var won = se.won || [];
  celebrate(won.length ? '🎉 Round finished! ' + won.length + ' Star Crystal' + (won.length === 1 ? '' : 's') + ' rescued!' : '🎉 Round finished! Well done.', 'finish', true);
}

/* ---------- parent ---------- */
function renderParent() {
  var ts = shownTopics();
  var rows = ts.map(function (t) { var s = topicStats(t);
    return '<tr><td>' + esc(t.emoji + ' ' + t.title) + (t.extra ? ' <span class="badge">P4</span>' : '') + '</td><td class="num">' + s.seen + ' / ' + s.n + '</td><td class="num">' + (s.acc == null ? '—' : pct(s.acc)) + '</td><td class="num">' + s.pct + '%</td></tr>'; }).join('');
  var most = Object.keys(S.items).filter(function (id) { return SCI.items[id] && S.items[id].miss > 0; })
    .sort(function (a, b) { return (S.items[b].miss - S.items[a].miss) || (S.items[a].c / S.items[a].a - S.items[b].c / S.items[b].a); }).slice(0, 12);
  var ex = S.exams.slice(0, 6).map(function (e) { var d = new Date(e.t);
    return '<tr><td>' + d.getDate() + '/' + (d.getMonth() + 1) + ' ' + (e.size === 'short' ? 'short' : 'full') + '</td><td class="num">' + e.got + ' / ' + e.max + '</td><td class="num">' + pct(e.max ? e.got / e.max : 0) + '</td></tr>'; }).join('');
  paint(
    '<button class="link" data-act="home">← All topics</button>' +
    '<p class="eyebrow" style="margin-top:8px">For grown-ups</p><h2>👪 Progress report</h2>' +
    '<p class="lead">Accuracy counts every attempt (open-ended answers by the marks ticked). Mastered = right on the latest try. Stored on this device only.</p>' +
    '<div class="section"><h3>By topic</h3><table class="tbl"><tr><th>Topic</th><th class="num">Tried</th><th class="num">Accuracy</th><th class="num">Mastered</th></tr>' + rows + '</table></div>' +
    p4Section() +
    '<div class="section"><h3>Most-missed questions</h3>' + (most.length ? '<ul class="rev">' + most.map(function (id) {
      var it = SCI.items[id], r = S.items[id], t = SCI.byId[it.topic];
      return '<li><span class="r">' + (r.last >= 1 ? '✓ now' : '↺') + '</span>' + esc(it.stem) + '<small>' + esc((t ? t.title : '') + ' · missed ' + r.miss + ' of ' + r.a + ' tries · ' + it.id) + '</small></li>';
    }).join('') + '</ul>' : '<p class="empty">Nothing missed yet.</p>') + '</div>' +
    '<div class="section"><h3>Mock papers</h3>' + (ex ? '<table class="tbl"><tr><th>Date</th><th class="num">Score</th><th class="num">%</th></tr>' + ex + '</table>' : '<p class="empty">No mock paper done yet.</p>') + '</div>' +
    '<div class="nav"><button class="btn ghost small" data-act="reset">Reset all progress</button></div>'
  );
}

/* Hidden topics live here only (Kev 2026-10-17: "hide in 4 section"). */
function p4Section() {
  var hs = hiddenTopics();
  if (!hs.length) return '';
  return '<div class="section" id="p4"><h3>P4 section <small class="badge">hidden from the child\'s home screen</small></h3>' +
    '<p class="lead" style="margin:0 0 8px">Not in the mock paper or Power-Up. Open a topic to practise it together.</p>' +
    '<table class="tbl"><tr><th>Topic</th><th class="num">Tried</th><th class="num">Accuracy</th><th class="num">Mastered</th></tr>' +
    hs.map(function (t) { var s = topicStats(t);
      return '<tr><td>' + esc(t.emoji + ' ' + t.title) + ' <span class="badge">P4</span></td><td class="num">' + s.seen + ' / ' + s.n + '</td><td class="num">' + (s.acc == null ? '—' : pct(s.acc)) + '</td><td class="num">' + s.pct + '%</td></tr>'; }).join('') +
    '</table><div class="row" style="margin-top:10px">' +
    hs.map(function (t) { return '<button class="btn small teal" data-act="topic" data-id="' + esc(t.id) + '">' + esc(t.emoji + ' ' + t.title) + ' →</button>'; }).join('') +
    '</div></div>';
}

/* ---------- events ---------- */
var A = {
  home: function () { go(''); },
  topic: function (el) { go('topic/' + el.dataset.id); },
  learn: function (el) { learn = { id: el.dataset.id, i: 0 }; go('learn/' + el.dataset.id); },
  lnext: function () { learn.i++; renderLearn(SCI.byId[learn.id]); },
  lprev: function () { learn.i--; renderLearn(SCI.byId[learn.id]); },
  practice: function (el) { startPractice(SCI.byId[el.dataset.id]); },
  power: startPower,
  sound: function () { S.sound = !S.sound; save(); sndBtn(); if (S.sound) sfx('ok'); },
  celeOff: function () { clearTimeout(celeT); document.getElementById('cele').hidden = true; },
  exam: function () { go('exam'); },
  parent: function () { go('parent'); },
  esize: function (el) { S.size = el.dataset.v; save(); renderExamSetup(); },
  etimer: function (el) { S.timer = el.dataset.v === '1'; save(); renderExamSetup(); },
  estart: startExam,
  pick: function (el) {
    var se = session, it = se.items[se.i], a = se.ans[se.i], k = +el.dataset.k;
    if (se.kind === 'exam') { a.choice = k; renderQuiz(); return; }
    if (a.choice != null || k === a.miss1) return;
    se.scrollFb = true;
    if (nudgeText(it) && a.miss1 == null && k !== it.answer) { a.miss1 = k; renderQuiz(); return; }   /* first miss: nudge (hints[0], else steps[0]) + retry */
    var prev = S.items[it.id], prevLast = prev ? prev.last : null, wasFull = pstate(pkey(it)).full;
    a.choice = k; a.score = k === it.answer ? (a.miss1 != null ? 0.5 : 1) : 0; record(it, a.score, a.miss1 != null); save();
    if (a.score > 0) a.praise = a.miss1 != null ? '✅ You got it on your second try!' : PRAISE[Math.floor(Math.random() * PRAISE.length)];
    funAfter(it, a, a.score, prevLast, wasFull); renderQuiz();
  },
  reveal: function () { var a = session.ans[session.i]; saveText(); a.shown = true; renderQuiz(); },
  hint: function () { var a = session.ans[session.i]; saveText(); a.hint1 = true; session.scrollFb = true; renderQuiz(); },
  tick: function (el) {
    var se = session, idx = se.phase === 'markB' ? se.markIdx : se.i, it = se.items[idx], a = se.ans[idx];
    a.ticks[+el.dataset.j] = el.checked; el.closest('label').classList.toggle('on', el.checked);
    var m = document.getElementById('markNow'); if (m) m.textContent = 'Marks: ' + Math.min(a.ticks.filter(Boolean).length, it.marks) + ' / ' + it.marks;
  },
  saveMark: function () {
    var se = session, it = se.items[se.i], a = se.ans[se.i];
    var prev = S.items[it.id], prevLast = prev ? prev.last : null, wasFull = pstate(pkey(it)).full;
    a.score = oeqScore(it, a.ticks); record(it, a.score, !!a.hint1); save();
    funAfter(it, a, a.score, prevLast, wasFull);
    /* refuter R9 (build day 2026-10-23): saveMark moves straight on, so a clean open-ended answer in
       Power-Up gets its ⚡ line as a toast, which outlives the re-render (the MCQ shows it in the feedback) */
    if (se.kind === 'power' && a.score >= 1 && !a.hint1) toast('⚡ ' + pq(pkey(it)) + (pstate(pkey(it)).full ? ' is fully charged!' : ' is charging up!'));
    A.next();
  },
  next: function () {
    saveText();
    if (session.i < session.items.length - 1) { session.i++; renderQuiz(); }
    else if (session.kind === 'like') { carryWon(); session = session.back; renderQuiz(); }   /* back to the walk-through she came from */
    else finishSession();
  },
  /* coaching walk-through: steps one at a time in place (no re-render, so the page keeps its scroll) */
  nextStep: function (el) {
    var se = session, k = +el.dataset.k, it = se.items[k], a = se.ans[k], box = el.closest('[data-coach]');
    if (!it || !it.steps || !box) return;
    var n = Math.max(1, Math.min(a.stepN || 1, it.steps.length)), show;
    if (n < it.steps.length) {
      a.stepN = n + 1; show = box.querySelectorAll('ol.csteps li')[n]; if (show) show.hidden = false;
      if (a.stepN >= it.steps.length) el.textContent = box.hasAttribute('data-noans') ? 'Got it →' : SHOW_ANS;
    } else {
      a.ansShown = true;
      box.querySelectorAll('[data-ans]').forEach(function (x) { x.hidden = false; show = show || x; });
      if (!box.hasAttribute('data-noans')) {
        view.querySelectorAll('.opt[data-k="' + it.answer + '"]').forEach(function (o) { o.classList.remove('mine', 'tried'); o.classList.add('right'); });
      }
      el.remove();
    }
    if (show && show.getBoundingClientRect().bottom > window.innerHeight) show.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  },
  tryLike: function (el) {
    var it = SCI.items[el.dataset.id]; if (!it || !session) return;
    var back = session.kind === 'like' ? session.back : session;
    var seen = {}; back.items.forEach(function (x) { seen[x.id] = 1; }); seen[it.id] = 1;
    var pool = likePool(it), fresh = pool.filter(function (x) { return !seen[x.id]; });
    var pick = pickWeighted(fresh.length ? fresh : pool, 1)[0];
    if (!pick) { toast('No more like this one yet'); return; }
    startSession('like', 'One like it', [pick], { back: back, topicId: back.topicId });
  },
  revGo: function (el) { var se = session; se.revK = +el.dataset.k; se.phase = 'review'; renderQuiz(); },
  toReport: function () { session.phase = 'report'; renderQuiz(); },
  prev: function () { saveText(); if (session.i > 0) { session.i--; renderQuiz(); } },
  /* Hand in: an in-app check first (never window.confirm), then marking as before */
  finishExam: function () { saveText(); examSave(); session.confirm = true; renderQuiz(); },
  cfBack: function () { session.confirm = false; renderQuiz(); },
  handIn: function () {
    var se = session;
    se.confirm = false; examClear();
    clearInterval(timerId);
    if (se.nA < se.items.length) { se.phase = 'markB'; se.markIdx = se.nA; renderQuiz(); } else finishSession();
  },
  jump: function (el) { saveText(); session.confirm = false; session.i = +el.dataset.k; renderQuiz(); },
  flag: function () { var se = session; se.flags[se.i] = !se.flags[se.i]; renderQuiz(); },
  markNext: function () { var se = session; if (se.markIdx < se.items.length - 1) { se.markIdx++; renderQuiz(); } else finishSession(); },
  retryMissed: function () {
    var se = session, list = se.items.filter(function (it, k) { return (se.ans[k].score || 0) < 1; });
    startSession(se.kind === 'exam' ? 'practice' : se.kind, se.kind === 'exam' ? 'Another go at the mock' : se.title, list, { topicId: se.topicId });
  },
  quit: function () {
    if (session && session.kind === 'like') { carryWon(); session = session.back; renderQuiz(); return; }
    if (session && session.phase !== 'report' && session.phase !== 'review' && !confirm('Stop this set? Answers already marked are kept.')) return;
    var back = session && session.topicId ? 'topic/' + session.topicId : '';
    if (session && session.kind === 'exam') examClear();
    session = null; go(back);
  },
  reset: function () { if (confirm('Erase all Science Quest progress on this device?')) { S = fresh(); save(); sndBtn(); renderParent(); toast('Progress cleared'); } }
};
function saveText() { var ta = document.getElementById('oeqText'); if (ta && session) { session.ans[session.i].text = ta.value; examSave(); } }
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.dataset.act === 'tick') return;   /* checkboxes handled on change */
  var f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('change', function (e) { var el = e.target; if (el.dataset && el.dataset.act === 'tick') A.tick(el); });
document.addEventListener('input', function (e) { if (e.target.id === 'oeqText') saveText(); });
window.addEventListener('hashchange', route);
sndBtn();
if (examResume()) { if (location.hash !== '#quiz') location.hash = 'quiz'; }
route();
})();
</script>
</body>
</html>
