    app.saidWhy[key] = 1;
    return text;
  }
  function beatSpeech(b) {
    if (!b) return '';
    var bits = [];
    if (b.chant && C.CHANTS[b.chant]) {
      bits.push(C.CHANTS[b.chant].name + (b.of > 1 ? ', number ' + b.ord + ' of ' + b.of : ''));
    }
    if (b.say) bits.push(plainWords(b.say));
    var r = reasonOnce(beatWhyKey(b), b.why);
    if (r) bits.push(r);
    return bits.join('. ');
  }
  function speakBeat(b) { speakStop(); speakText(beatSpeech(b) + smoothTail(b)); }
  function guideSpeech(n) {
    if (!n) return '';
    var bits = [plainWords(n.say)], r = reasonOnce('g/' + n.id, n.why);
    if (r) bits.push(r);
    return bits.join('. ');
  }
  /* ===== SPEECH END ===== */

  /* ---------------------------------------------------------------- talking */
  function say(text, kind, head) {
    app.says = text; app.sayKind = kind || ''; app.sayHead = head || '';
  }
  function cheer(text) { say(text, 'good', 'Yes!'); }

  /* ---------------------------------------------------------------- solo watching */
  function watchSolo() {
    if (app.mode !== 'solve' || app.level !== 'solo') {
      if (app.mode === 'play' && C.facesAllOneColour(app.state) && !app.cheered.play) {
        app.cheered.play = 1; cheer('Every side is one colour. Solved!');
      }
      return;
    }
    if (big()) { watchSolo3(); return; }
    if (C.facesAllOneColour(app.state)) {
      if (!app.cheered.solved) { app.cheered.solved = 1; cheer('Every side is one colour. You solved it with your own hands.'); win('solo'); }
      return;
    }
    if (C.layerIntact(app.state)) {
      if (!app.cheered.layer) { app.cheered.layer = 1; cheer('White layer done. Real one too, side colours and all.'); win('layer'); if (app.fromFace) win('real'); }
      if (C.ceilingAllYellow(app.state) && !app.cheered.yellow) { app.cheered.yellow = 1; cheer('All 4 ceiling squares are ' + YEL() + '. Step 2 done.'); win('yellow'); }
    }
  }

  function watchSolo3() {
    var s = app.state;
    if (C3.facesAllOneColour(s)) {
      if (!app.cheered.solved) { app.cheered.solved = 1; cheer('Every side is one colour. You solved the big cube with your own hands.'); win('solo3'); }
      return;
    }
    if (C3.twoLayersDone(s) && !app.cheered.two) { app.cheered.two = 1; cheer('The floor row and the middle row are both finished. Only the yellow ceiling left.'); win('two3'); }
    else if (C3.firstLayerDone(s) && !app.cheered.layer) { app.cheered.layer = 1; cheer('The whole white layer is solid, side colours and all.'); win('layer3'); }
    else if (C3.crossDone(s) && !app.cheered.cross) { app.cheered.cross = 1; cheer('A real white cross, every arm matching its middle square.'); win('cross3'); }
  }

  /* ---------------------------------------------------------------- solve engine */
  function beat() { return app.plan && app.plan.beats[app.idx]; }
  /* When the cube IS identified, she can be told exactly how far she is from finished, and
     watch that number come down. Chants are counted as chants, because that is how she counts
     them out loud. Nothing here guesses: the plan is the whole road. */
  function planMoves(p, from) {
    var n = 0, i;
    for (i = from || 0; i < p.beats.length; i++) n += p.beats[i].moves.length;
    return n;
  }
  function planShape(p) {
    var chants = 0, turns = 0, seen = {}, i, b;
    for (i = 0; i < p.beats.length; i++) {
      b = p.beats[i];
      if (b.chant) { if (!seen[b.group]) { seen[b.group] = 1; chants += (b.of || 1); } }
      else turns += b.moves.length;
    }
    return { chants: chants, turns: turns };
  }
  function countdownCard() {
    if (!app.plan) return '';
    var total = planMoves(app.plan, 0), left = planMoves(app.plan, app.idx), sh = planShape(app.plan);
    var bits = [];
    if (sh.chants) bits.push(sh.chants + ' chant' + (sh.chants === 1 ? '' : 's'));
    if (sh.turns) bits.push(sh.turns + ' turn' + (sh.turns === 1 ? '' : 's'));
    return '<div class="say good"><span class="head">Your cube is identified.</span>'
      + 'You are <b>' + total + ' moves</b> from solved'
      + (bits.length ? ': ' + esc(bits.join(' and ')) : '') + '. '
      + '<b id="liveCount">' + left + ' to go.</b></div>';
  }
  function startSolve(hint) {
    var p = C.buildPlan(app.state, hint);
    if (!p.ok) { say('I got muddled working that one out. Press Start again and I will have another go.', 'oops'); app.plan = null; render(); return; }
    app.plan = p; app.idx = 0; app.askState = null; app.auto = false; app.awaitDemo = false;
    app.units = []; app.moveAt = 0; app.chantAt = -1; app.awaitMove = false;
    app.drill = null; app.playing = false; app.playMsg = null;
    app.saidWhy = {};
    app.diag = C.diagnose(app.state);
    app.fromFace = app.diag.kind === 'face';
    /* THE FIRST FRAME IS HER CUBE. The plan was built from app.state, so the picture has to be
       app.state too, drawn before a single move is played. Without this the screen keeps
       whatever it was showing before and the walkthrough appears to start from the wrong cube. */
    clearGlow(); renderCube();
    say(app.plan.beats[0].say, '');
    render();
    /* nothing moves on its own from here. Beat one is on the screen, waiting for her tap. */
  }
  function advance() {
    if (app.busy || !app.plan) return;
    speakStop();
    var b = beat();
    if (!b) return;
    if (app.level === 'try' && b.ask && app.askState !== 'done') { app.askState = 'asking'; render(); return; }
    playBeat(b);
  }
  function playBeat(b) {
    app.busy = true;
    say(b.say, b.panic ? 'panic' : (b.cheer ? 'good' : ''), b.panic ? 'Read this before you start' : (b.cheer || ''));
    speakBeat(b);
    clearGlow();
    if (b.blockHi !== undefined) glowBlock(b.blockHi);
    if (b.barFace !== undefined) { var f = b.barFace; C.FACELET[f].slice(0, 2).forEach(function (m) { glowSlotFac(m[0], m[1]); }); }
    if (b.cornerHi !== undefined) glowPiece3('c', b.cornerHi);
    if (b.edgeHi !== undefined) glowPiece3('e', b.edgeHi);
    if (b.cornerSlotHi !== undefined) glowSlot3('c', b.cornerSlotHi);
    renderStep();
    app.units = beatUnits(b);
    app.moveAt = 0;
    if (!app.units.length) { setTimeout(function () { finishBeat(b); }, b.read ? 1500 : 260); return; }
    playUnit(false);
  }
  /* One unit is one named move, or one whole cube turn. A chant is four or fourteen of them
     and she gets to keep up with every single one: the cube does one, then waits for her.
     THE MASTERY RULE. Once a grown up has ticked a chant off, that chant is ONE unit instead:
     one card, one smooth go on the example cube, one forward tap past the lot. The beat is the
     same beat and the moves are the same moves, so every snapshot, every count and every reason
     underneath carries on working untouched. Everything not ticked is stepped exactly as before.
     This is the fluent mode the grouping groundwork was laid for. */
  function isRun(u) { return !!(u && u.run); }
  function unitsAreRuns() { return isRun(app.units && app.units[0]); }
  /* a step whose moves are whole goes of one chant, cut into one unit per go. A shelf drill can
     be two goes of the same chant, and two goes she knows are two smooth goes, never one fused
     blur: the count she chants out loud is still the count she sees. */
  /* how many whole goes of its chant a step is holding, and how long one go is. ONE answer, used
     by the cutter, by the card and by the voice, so the three can never disagree about it. */
  function chantGoes(b) {
    var c = (b && b.chant) ? C.CHANTS[b.chant] : null, per = c ? c.moves.length : 0;
    if (!per || !b.moves.length || b.moves.length % per !== 0) return { per: b && b.moves ? b.moves.length : 0, goes: 1 };
    return { per: per, goes: b.moves.length / per };
  }
  function chantRuns(b) {
    var n = chantGoes(b), out = [], i;
    if (n.goes <= 1) return [{ run: b.moves.slice(), chant: b.chant, at: 1, times: 1 }];
    for (i = 0; i < n.goes; i++) {
      out.push({ run: b.moves.slice(i * n.per, (i + 1) * n.per), chant: b.chant, at: i + 1, times: n.goes });
    }
    return out;
  }
  function beatUnits(b) {
    if (!b || !b.moves.length) return [];
    if (b.kind === 'whole') return [b.whole];
    if (b.chant && knowsChant(b.chant)) return chantRuns(b);
    return b.moves.slice();
  }
  /* ONE SMOOTH GO. The moves of a mastered chant run back to back on the example cube, at the
     tempo the rate button is set to, and nothing stops in the middle: whole chants only was
     always the rule, and this is that rule with the brakes off. */
  function runDur(dur) { return Math.max(150, Math.round(dur / (app.playRate || 1))); }
  function runChant(u, dur, done) {
    var list = u.run, i = 0, gap = runDur(dur);
    (function step() {
      /* a smooth go is proof of life, so the player's stuck-run watchdog is fed by every turn */
      app.playWait = 0;
      if (i >= list.length) { done(); return; }
      var m = list[i]; i++;
      if (C.WHOLE[m]) turnWhole(m, gap + 80, step); else turn(m, gap, step);
    })();
  }
  /* Forward tapped while a chant is flying past is REMEMBERED, not obeyed halfway. Cutting a
     chant in half is the one thing this app has never done, so the tap waits for the end of the
     go and then does what it always does: moves her on. */
  function flushFwd() {
    if (!app.fwdQueued) return;
    app.fwdQueued = false;
    if (app.busy || app.playing) return;
    setTimeout(playerFwd, 0);
  }
  function playUnit(speakIt) {
    /* one stepper, two callers. The guide hands it a script step instead of a plan beat, so a
       14 move chant is stepped exactly the same way here as it is in the coached solve. */
    var b = app.setup ? app.setup : (app.drill ? app.drill : (app.guide ? guideNode() : beat()));
    if (!b || !app.units || app.moveAt >= app.units.length) return;
    var u = app.units[app.moveAt], dur = app.auto ? 520 : SPEED;
    /* a move is playing, so any "your turn" left over from the last thing is stale */
    app.playMsg = null;
    app.busy = true; app.awaitMove = false;
    app.chantAt = app.moveAt;
    if (speakIt) speakMove(u, b);
    renderStep();
    var after = function () {
      app.moveAt++;
      if (app.moveAt >= app.units.length) {
        app.chantAt = -1;
        if (app.setup) { setupDone(); return; }
        if (app.drill) { chantUnitsDone(); return; }
        if (app.guide) { guideUnitsDone(); return; }
        finishBeat(b); return;
      }
      if (app.auto) { playUnit(true); return; }
      app.busy = false; app.awaitMove = true; renderStep();
      /* the player drives itself from its OWN loop and nowhere else. Kicking a second chain off
         from here raced the first one: two of them called forward around each other until one
         got swallowed while the other was busy, and playback stopped dead with nothing pending. */
    };
    if (isRun(u)) { runChant(u, dur, function () { after(); flushFwd(); }); return; }
    if (C.WHOLE[u]) turnWhole(u, dur + 80, after); else turn(u, dur, after);
  }
  /* what a smooth go is called out loud: the chant, and which go it is when there is more than
     one. The move count rides with it once, and that is the whole of the counting. */
  function runWords(u, b) {
    var c = C.CHANTS[u.chant], nth = 0, of = 1;
    if (b && b.of > 1) { nth = b.ord; of = b.of; }
    if (u.times > 1) { nth = u.at; of = u.times; }
    return (c ? c.name : 'Chant') + (of > 1 ? ', ' + C.ordinal(nth) + ' time' : '');
  }
  function speakMove(u, b) {
    if (!app.speak) return;
    /* a chant she knows is named and counted ONCE, never counted out move by move */
    if (isRun(u)) { speakStop(); speakText(runWords(u, b) + '. ' + u.run.length + ' moves.'); return; }
    var words = C.WHOLE[u] ? C.WHOLE[u].cap : (C.CAPTION[u] || u);
    var pre = (b && b.chant && app.units.length > 1) ? ('Move ' + (app.moveAt + 1) + ' of ' + app.units.length + '. ') : '';
    speakStop();
    speakText(pre + words);
  }
  function finishBeat(b) {
    app.busy = false; app.awaitMove = false;
    if (app.level === 'try' && b.askAfter && app.askState !== 'doneAfter') { app.askState = 'askingAfter'; render(); return; }
    /* the cube has just shown her the move. Hold there so she can watch it again or copy
       it on her own cube, unless she asked me to run the whole thing without stopping. */
    if (b.moves.length && !app.auto) { app.awaitDemo = true; renderStep(); return; }
    beatDone(b);
  }
  function beatDone(b) {
    app.askState = null; app.chantAt = -1; app.awaitDemo = false; app.awaitMove = false; app.moveAt = 0;
    if (b.cheer) {
      cheer(b.cheer === 'Solved!'
        ? (big() ? 'Every side is one colour. Eight steps, six chants, done.' : 'Every side is one colour. Three steps, two chants, done.')
        : b.say);
      if (big()) {
        if (b.cheer === 'White cross done!') win('cross3');
        if (b.cheer === 'White layer done!') win('layer3');
        if (b.cheer === 'Two layers done!') win('two3');
        if (b.cheer === 'Solved!') {
          if (app.level === 'watch') win('watch3');
          if (app.level === 'try') { win('watch3'); if (!app.usedShowMe) win('try3'); }
          if (app.level === 'watch' && !app.badges.try3) app.level = 'try';
        }
      } else {
        if (b.cheer === 'White layer done!') { win('layer'); if (app.fromFace) win('real'); }
        if (b.cheer === 'Yellow ceiling done!') win('yellow');
        if (b.cheer === 'Solved!') {
          if (app.level === 'watch') win('watch');
          if (app.level === 'try') { win('watch'); if (!app.usedShowMe) win('try'); }
          if (app.level === 'watch' && !app.badges.try) app.level = 'try';
        }
      }
    }
    app.idx++;
    clearGlow();
    renderStep();
    if (app.auto && beat()) setTimeout(advance, 800);

  }
  /* Back always lands on a snapshot the plan kept, never on an undone guess. If the move has
     just been shown, Back puts it back the way it was and leaves you on the same step. */
  function goBack() {
    if (app.busy || !app.plan) return;
    speakStop();
    if (app.awaitDemo || app.awaitMove) {
      app.awaitDemo = false; app.awaitMove = false; app.moveAt = 0; app.chantAt = -1;
      app.state = C.clone(app.plan.states[app.idx]);
      app.askState = null; clearGlow(); renderCube();
      say(app.plan.beats[app.idx].say, '');
      render(); speakBeat(app.plan.beats[app.idx]);
      return;
    }
    if (app.idx === 0) return;
    app.idx--;
    app.state = C.clone(app.plan.states[app.idx]);
    app.askState = null; clearGlow(); renderCube();
    say(app.plan.beats[app.idx].say, '');
    render();
    speakBeat(app.plan.beats[app.idx]);
  }
  /* Watch again: put the cube back exactly where it stood before the move and play it again.
     The plan keeps the state before every beat, so the replay always starts from the truth. */
  function watchAgain() {
    if (app.busy || !app.plan) return;
    speakStop();
    var b = beat();
    if (!b || !b.moves.length) return;
    app.awaitDemo = false; app.awaitMove = false; app.moveAt = 0; app.chantAt = -1;
    app.state = C.clone(app.plan.states[app.idx]);
    clearGlow(); renderCube(); render();
    setTimeout(function () { playBeat(b); }, 220);
  }
  /* A block is one whole piece of work: find this block, aim it, chant it home. Restarting the
     block rewinds to the snapshot the plan kept at its first beat, so it is exact, never undone
     by guesswork. Coarser than watching one move again, finer than working the cube out afresh. */
  var BLOCK_OPENERS = ['look', 'read', 'warn', 'guard', 'skip', 'cheer', 'done'];
  function blockStart(i) {
    var beats = app.plan.beats, j = i;
    while (j > 0) {
      var b = beats[j], prev = beats[j - 1];
      if (BLOCK_OPENERS.indexOf(b.kind) >= 0) break;
      if (b.phase !== prev.phase) break;
      if (prev.chant && !b.chant) break;
      j--;
    }
    return j;
  }
  function restartBlock() {
    if (app.busy || !app.plan) return;
    speakStop();
    var j = blockStart(app.idx), b = app.plan.beats[j];
    app.idx = j;
    app.state = C.clone(app.plan.states[j]);
    app.awaitDemo = false; app.awaitMove = false; app.moveAt = 0; app.chantAt = -1; app.askState = null;
    clearGlow(); renderCube();
    say(b.say, '');
    render();
    speakBeat(b);
  }
  function replan(hint, note) {
    app.plan = C.buildPlan(app.state, hint);

    if (note) say(note, 'good', 'Good spot!');
    render();
  }

  /* ---- the questions ---- */
  var SHAPES = ['dot', 'L', 'line', 'cross'];
  function askFor(b, after) {

    if (kind === 'yellow-yet') return { q: 'That is 2 chants. Look at the block inside the red ring. Is its ceiling square ' + YEL() + ' yet?', opts: ['yes', 'not yet'] };
    if (kind === 'count-sides') return { q: 'On each side, count the 2 squares nearest the side marked CEILING. How many sides show 2 the same?', opts: ['none', 'one', 'all four'] };

  function answerOpt(i) {

      else say('Have another look at the 2 squares nearest the ceiling on each side. The answer is ' + ['none', 'one', 'all four'][want] + '. It is only ever 0, 1 or all 4.', 'oops', 'Nearly');

    }

      var faces = [C.F, C.R, C.B, C.L];

      else say('Not that one. The bar is on ' + C.SIDE_WORDS[b.askFace] + '. Only one side has 2 matching squares.', 'oops', 'Nearly');

  function answerOpt3(i, b, kind) {
    var right, want;

      right = (i === 0) === (b.askSide === 'right');

        ? 'Yes. To your ' + b.askSide + ', so it is the ' + (b.askSide === 'right' ? 'Right-drop' : 'Left-drop') + ' chant.'
        : 'Have another look. That middle square is to your ' + b.askSide + ', so it is the ' + (b.askSide === 'right' ? 'Right-drop' : 'Left-drop') + ' chant.',
        right ? 'good' : 'oops', right ? 'Spot on' : 'Nearly');
    } else if (kind === 'cross-shape') {
      want = SHAPES.indexOf(b.askShape);
      right = (i === want);
      say(right
        ? ['Yes, a dot. None of them is yellow.', 'Yes, an L. Two yellow ones next to each other.', 'Yes, a line. Two yellow ones opposite each other.', 'Yes, the cross. All four are yellow.'][want]
        : 'Have another look at the four flat spots and ignore the corners. It is ' + ['a dot', 'an L', 'a line', 'the cross'][want] + '. It is only ever 0, 2 or 4 yellow ones, never 1 and never 3.',
        right ? 'good' : 'oops', right ? 'Good reading' : 'Nearly');
    } else if (kind === 'count-match') {
      want = b.askCount === 4 ? 1 : 0;
      right = (i === want);
      say(right
        ? (want ? 'Yes, all four. That is step 6 finished.' : 'Yes, exactly 2. That means one Edge-spinner chant.')
        : 'Have another look at the side squares, not the ceiling ones. The answer is ' + ['2', 'all four'][want] + '. It is always all 4 or exactly 2.',
        right ? 'good' : 'oops', right ? 'Good reading' : 'Nearly');
    } else if (kind === 'count-home') {
      want = b.askCount === 0 ? 0 : (b.askCount === 1 ? 1 : 2);
      right = (i === want);
      say(right
        ? ['Yes, none of them. Chant once from wherever you are holding it.', 'Yes, exactly 1. Spin it round to your working corner first.', 'Yes, all four. Do not chant, that would throw them all out again.'][want]
        : 'Count again. A block is home when its 3 colours match the 3 middle squares around it, even if it is twisted. The answer is ' + ['none', '1', 'all four'][want] + '. It is only ever none, 1 or all 4.',
        right ? 'good' : 'oops', right ? 'Good counting' : 'Nearly');

    app.askState = 'done'; render(); setTimeout(advance, 1200);
  }
  function answerTap3(kind, idx) {
    var b = beat(), ask = b.ask, s = app.state;
    if (ask === 'pick-petal') {

        say('That block has no white square on it. We are hunting for the four 2 square blocks with white on them.', 'oops', 'Nearly'); render(); return;

        var slot = C3.slotOfEdge(s, idx);
        if (slot >= 4 && slot < 8 && C3.edgeSeated(s, slot)) {
          say('That one is already down at the floor and matching. Pick a petal that is still up at the ceiling.', 'oops', 'Nearly'); render(); return;

      setTimeout(advance, 900); return;

      }
      var p = C3.slotOfCorner(s, idx);
      if (p < 4 && C3.cornerSeated(s, p)) {
        say('That one is already done, white square at the ceiling and both side colours matching. Find one that is not.', 'oops', 'Nearly'); render(); return;
      }
      if (idx === b.askTarget) { say('Yes, that is the one. Watch where it has to go.', 'good', 'Spot on'); app.askState = 'done'; render(); setTimeout(advance, 900); return; }
      replan({ corner: idx }, 'That one works too. Let us do yours instead.');

  }
  function answerTap(cubie, slot) {
    var b = beat(), kind = b.ask;
    if (kind === 'find-white' || kind === 'pick-white') {
      var isWhite = C.cornerColours(cubie).indexOf('white') >= 0;
      if (!isWhite) { say('That block has no white square on it. Turn the cube round and hunt for white.', 'oops', 'Nearly'); render(); return; }
      var prog = C.whiteProgress(app.state);
      if (prog.seated.indexOf(cubie) >= 0) { say('That one is already done. Look for a white block you have not done yet.', 'oops', 'Nearly'); render(); return; }
      if (cubie === b.askTarget) { say('Yes, that is the one. Watch where it has to go.', 'good', 'Spot on'); app.askState = 'done'; render(); setTimeout(advance, 900); return; }
      replan(kind === 'find-white' ? { anchor: cubie } : { block: cubie }, 'That one works too. Let us do yours instead.');
      setTimeout(advance, 900); return;
    }
    if (kind === 'pick-not-yellow') {
      if (slot === undefined || slot > 3) { say('Look at the 4 blocks up at the ceiling. Tap one whose ceiling square is not ' + YEL() + '.', 'oops', 'Nearly'); render(); return; }
      if (C.ceilColour(app.state, slot) === 'yellow') { say('That one is already ' + YEL() + ' at the ceiling. It is done. Find one that is not.', 'oops', 'Nearly'); render(); return; }
      say('Good. That block still hides its ' + YEL() + ' round the side.', 'good', 'Spot on');

  /* ---------------------------------------------------------------- Cube Says */
  function cubeSaysStart() {
    app.cubeSays = { left: 5, want: null, score: 0 };
    cubeSaysNext();
  }
  function cubeSaysNext() {
    var pool = PAD_HAND.concat(['y', 'yp', 'x2']);
    app.cubeSays.want = pool[Math.floor(Math.random() * pool.length)];
    say('Cube says: <b>' + esc(tileCaption(app.cubeSays.want)) + '</b>', '', 'Round ' + (6 - app.cubeSays.left));
    render();
  }
  function cubeSaysAnswer(k) {
    var g = app.cubeSays;
    if (k !== g.want) { say('That one is "' + esc(tileCaption(k)) + '". Cube says <b>' + esc(tileCaption(g.want)) + '</b>. Try again.', 'oops', 'Nearly'); render(); return; }
    g.score++; g.left--;
    app.busy = true;
    var after = function () {
      app.busy = false;
      if (g.left <= 0) { app.cubeSays = null; cheer('5 out of 5. Cube Says Champion.'); render(); return; }
      cheer('Yes.'); render();
      setTimeout(cubeSaysNext, 700);
    };

  /* ---------------------------------------------------------------- painting */
  /* ---------------------------------------------------------------- keeping her painting
     Once she paints a square it stays painted: through a refresh, a walk to another tab, a
     closed lid. Only Rub it all out forgets it. */
  function paintKey(n) { return 'paint-' + (n || app.size); }
  function savePaint() {
    storeSet(paintKey(), JSON.stringify({
      v: 1, size: app.size, paint: app.paint, holdOk: app.holdOk, whiteDown: app.whiteDown,
      paintPath: app.paintPath, paintIntent: app.paintIntent, sideHold: app.sideHold
    }));
  }
  function forgetPaint() { storeDel(paintKey()); }
  function loadPaint(n) {
    var raw = storeGet(paintKey(n)), o;
    if (!raw) return null;
    try { o = JSON.parse(raw); } catch (e) { return null; }
    if (!o || o.size !== n || !o.paint || o.paint.length !== (n === 3 ? 54 : 24)) return null;
    return o;
  }
  function restorePaint(n) {
    var o = loadPaint(n);
    if (!o) return false;
    app.paint = o.paint.slice();
    app.holdOk = !!o.holdOk;
    app.whiteDown = !!o.whiteDown;
    app.paintPath = o.paintPath || 'infer';
    app.paintIntent = o.paintIntent || 'match';
    app.sideHold = !!o.sideHold;
    /* a painting that comes back with a solid white floor arms the rule again by itself */
    autoPinPainted();
    return true;
  }
  /* white at the floor is knowledge, not a guess: once the flow has established it, the floor
     squares are white and the engine never asks about them again */
  function floorSids() {
    var per = big() ? 9 : 4, base = C.D * per, out = [], i;
    for (i = 0; i < per; i++) out.push(base + i);
    return out;
  }
  function assumedSid(sid) {
    if (!app.whiteDown || app.paint[sid]) return false;
    return floorSids().indexOf(sid) >= 0;
  }
  /* what the engine is allowed to take as known: what she painted, plus what the flow proved */
  function effPaint() {
    if (!app.whiteDown) return app.paint;
    var out = app.paint.slice(), f = floorSids(), i;
    for (i = 0; i < f.length; i++) { if (!out[f[i]]) out[f[i]] = 'white'; }
    return out;
  }
  /* ---------------------------------------------------------------- knowing a whole side
     A side is settled when every one of its squares is the same colour and we are sure of it.
     Two ways to be sure: she painted the whole side that colour, or the complete list of cubes
     that match her painting all agree on it. A settled side is never asked about again, and a
     settled white floor arms the standing rule on its own, with no question at all. */
  function solidFaceColour(paint, f) {
    var per = facePer(), base = f * per, c = paint[base], i;
    if (!c) return null;
    for (i = 1; i < per; i++) { if (paint[base + i] !== c) return null; }
    return c;
  }
  /* the same side, read off every cube still in the running. Only trusted when the list is
     the whole truth, because a list cut short can agree by accident. */
  function agreedFaceColour(res, f) {
    var per = facePer(), base = f * per, want = null, i, k, st, c0;
    if (!res || res.capped || !res.list || !res.list.length) return null;
    for (i = 0; i < res.list.length; i++) {
      st = res.list[i].stickers; c0 = st[base];
      if (!c0) return null;
      for (k = 1; k < per; k++) { if (st[base + k] !== c0) return null; }
      if (want === null) want = c0;
      else if (want !== c0) return null;
    }
    return want;
  }
  function armWhiteDown(why) {
    if (app.whiteDown) return false;
    app.whiteDown = true;
    app.whiteMsg = why || null;
    savePaint();
    return true;
  }
  /* pin every side we can already be sure of. Returns the squares it filled in. */
  function pinSolid(res) {
    var per = facePer(), filled = [], f, i, base, col;
    for (f = 0; f < 6; f++) {
      base = f * per;
      col = solidFaceColour(app.paint, f) || agreedFaceColour(res, f);
      if (!col) continue;
      for (i = 0; i < per; i++) {
        /* the assumed floor is already known to the engine, so leave it assumed and undoable */
        if (app.paint[base + i] || assumedSid(base + i)) continue;
        app.paint[base + i] = col; filled.push(base + i);
      }
      if (f === C.D && col === 'white') {
        armWhiteDown('I could see it: every square on your floor side is white. So I pinned it.');
      }
    }
    if (filled.length) savePaint();
    return filled;
  }
  /* the cheap half of the same idea, run on every tap: no enumeration, just her own painting */
  function autoPinPainted() {
    if (solidFaceColour(app.paint, C.D) === 'white') {
      armWhiteDown('I could see it: you painted every floor square white. So I pinned it.');
    }
  }
  /* ===== RESET START =====
     One way out of anywhere. The painter has a lot of little states: painting, locked second
     picture, turn and check your hold, a question, a spot check, a told off painting, and the
     hold it at the floor first screen that draws nothing else at all. Every one of them has to
     have the same exit, or she is stuck. Fenced so the gate can prove that, from every one of
     those states, one tap lands on the same clean painter. */
  function paintReset(fill) {
    app.paint = new Array(big() ? 54 : 24).fill(null);
    if (fill === 'solved') app.paint = C.stateToStickers(C.solved()).map(function (c) { return c; });
    if (fill === 'screen') app.paint = C.stateToStickers(app.state).map(function (c) { return app.scheme.back[c] || c; });
    app.paintMsg = null; app.paintSuspects = [];
    /* filling it in from a real cube needs no hold checking: those squares never came from
       a turn she made. Hand painting the second picture always does. */
    app.holdOk = (fill === 'solved' || fill === 'screen');
    /* a painting handed to us whole tells us where white is by itself, so read it, never guess */
    if (fill) { app.whiteDown = solidFaceColour(app.paint, C.D) === 'white'; app.whiteMsg = null; }
    app.holdMsg = null; app.holdNeed = [];
    app.paintPath = 'infer'; app.inferRes = null; app.inferQ = null; app.inferSpot = null;
    app.inferMsg = null; app.inferFilled = null; app.inferAsked = 0; app.inferSkip = null;
    app.inferHint = null; app.rejectKind = null;
  }
  /* What a clean painter looks like. ONE list, read by the reset and by the gate, so the two
     can never drift apart and quietly leave a state behind. */
  function painterClean() {
    var n = big() ? 54 : 24, i;
    for (i = 0; i < n; i++) { if (app.paint[i]) return false; }
    return app.sideHold === false && !app.sideMsg
      && app.holdOk === false && !app.holdMsg && app.holdNeed.length === 0
      && app.paintPath === 'infer' && app.paintIntent === 'match'
      && !app.inferQ && !app.inferSpot && !app.inferRes && !app.inferFilled && !app.inferMsg
      && app.inferAsked === 0
      && !app.paintMsg && app.paintSuspects.length === 0
      && app.confirmReset === false
      && app.whiteDown === true;
  }
  /* wipe the lot: squares, question, candidates, spot check, locks, hold check, the told off
     message, the hold it at the floor screen, the voice, and the saved copy on the iPad so
     none of it comes back after a refresh */
  function resetPainter() {
    speakStop();
    paintReset();
    app.sideHold = false; app.sideMsg = null;
    app.paintIntent = 'match';
    app.paintColour = 'white';
    app.confirmReset = false;
    app.whiteDown = false; app.whiteMsg = null;
    app.paintSuspects = []; app.holdNeed = [];
    app.rejectKind = null; app.inferHint = null;
    /* the saved copy goes with it, the same one forgetPaint drops, so nothing resurrects */
    storeDel(paintKey());
  }
  /* Start again. White at the floor comes back armed, because that is how the cube is held in
     this house nearly every time, and the I remember banner still has its way out. */
  function startAgain() {
    resetPainter();
    app.whiteDown = true;
    app.whiteMsg = 'Fresh start. Nearly always you hold it with white at the floor, so I put that back.';
    savePaint();
    app.says = null; app.sayKind = ''; app.sayHead = '';
    idleTile('Fresh start');
    render();
  }
  /* the way out, drawn at the very top of the painter, in every single one of its states */
  function startAgainCard() {
    if (app.confirmReset) {
      return '<div class="card" style="border-width:3px;border-color:' + RED + ';margin-bottom:12px">'
        + '<h2 style="color:' + RED + '">Start again from the beginning?</h2>'
        + '<div class="lede">This rubs out every square and every answer, and we begin with a clean cube. '
        + 'Nothing you have painted is kept.</div>'
        + '<div class="row" style="margin-top:10px">'
        + '<button class="btn primary big" data-act="reset-yes">Yes, start again</button>'
        + '<button class="btn big" data-act="reset-no">Keep going</button></div></div>';
    }
    return '<div class="row" style="margin-bottom:12px">'
      + '<button class="btn big" data-act="start-again" style="border-color:' + RED + ';color:' + RED + '">Start again</button>'
      + '<span class="lede" style="flex:1 1 160px">Stuck? This rubs everything out and starts the painting fresh.</span></div>';
  }
  /* ===== RESET END ===== */
  /* HOW MUCH IS LEFT TO GUESS. Cheap, capped, and only once there is enough paint to bother.
     If the field is small the offer comes to her instead of waiting to be found. */
  /* Measured, not assumed. On the small cube the field is still in the hundreds until the last
     square of the view goes on, and then it collapses to about ten: so twelve squares IS the
     earliest uniqueness allows, and white at the floor brings it forward to about nine. On the
     big cube the field is still enormous even with all twenty seven painted, so there the honest
     offer is not "only a few left" but "you have painted everything you can see, let me peek". */
  var HANDOVER_AT = 12;
  function viewDone() {
    var i, k = firstViewCount(), known = effPaint();
    for (i = 0; i < k; i++) { if (!known[i]) return false; }
    return true;
  }
  /* Cheap only. Until she has a whole block painted (or all six middles on the big cube) the
     engine has to try every way her colours could sit on a cube, which is 720 schemes, and doing
     that on every tap makes the painter treacle. There is nothing to offer that early anyway. */
  function hasAnchor(known) {
    var i;
    if (big()) {
      for (i = 0; i < 6; i++) { if (!known[C.WHERE_N[i]]) return false; }
      return true;
    }
    for (i = 0; i < 8; i++) {
      var wsid = C.WHERE[i];
      if (known[wsid[0]] && known[wsid[1]] && known[wsid[2]]) return true;
    }
    return false;
  }
  function checkHandover() {
    app.inferHint = null;
    var known = effPaint(), painted = app.paint.filter(Boolean).length, least = big() ? 12 : 6;
    if (painted < least || !hasAnchor(known)) return;
    var res = INFER.completions(C, known, { cap: HANDOVER_AT + 1, budget: 1500 });
    if (!res.capped && res.count > 0 && res.count <= HANDOVER_AT) { app.inferHint = res.count; return; }
    /* not down to a handful, but she has painted everything she can actually see */
    if (viewDone()) app.inferHint = 'view';
  }
  function handoverCard() {
    if (app.inferHint === null || app.inferQ || app.inferSpot || app.inferSkip) return '';
    var few = app.inferHint !== 'view';
    return '<div class="card" style="border-width:3px;border-color:#009e60;margin-bottom:12px">'
      + '<h2 style="color:#009e60">' + (few ? 'I can nearly see it' : 'That is everything you can see') + '</h2>'
      + '<div class="lede">' + (few
        ? 'You have painted enough. There ' + (app.inferHint === 1 ? 'is only 1 cube' : 'are only ' + app.inferHint + ' cubes')
          + ' left that it could be, so you do not have to paint the rest. '
          + (app.inferHint === 1 ? 'I know exactly which one it is.' : 'Let me finish it for you.')
        : 'You have painted every square you can see without turning your cube over. '
          + 'Let me work out the hidden sides. If I get stuck I will ask you to peek at one square at a time.')
      + '</div>'
      + '<div class="row" style="margin-top:9px"><button class="btn primary big" data-act="infer">Work out the rest for me</button></div></div>';
  }
  function paintCheck() {
    /* the standing rule counts as painted here too, or a cube with white known at the floor
       would be told its floor squares are still empty */
    var known = effPaint();
    var res = C.validate(known);
    if (!res.ok) {
      /* before blaming her squares, check whether it is MY assumption that is wrong */
      if (app.whiteDown && conflictFree(paintedSids())) {
        noteReject();
        app.paintMsg = null; app.diag = null; render(); return;
      }
      app.rejectKind = 'squares';
      app.paintMsg = res.msg; app.paintSuspects = res.suspects; app.diag = null; render(); return;
    }
    app.rejectKind = null;
    app.paint = known.slice(); savePaint();
    app.paintMsg = null; app.paintSuspects = [];
    app.scheme = res.scheme;
    app.state = res.state;
    app.undo = []; app.cheered = {};
    paintStickers(); renderCube();
    app.diag = C.diagnose(app.state);
    app.mode = 'solve'; app.plan = null;
    render();
  }

  /* ===== PLAYER START =====
     ONE PLAYER BAR, MANY OWNERS. Moves get stepped in four places: the coached solve, the puzzle
     setup, the guide, and the chant shelf. They all drive the same playUnit, so they all get the
     same bar: play, step back, step forward, and where you are. There is no second copy of this
     anywhere, on purpose.
     THE LAW OF PLAY: play only ever carries her through MOVES. The moment the app needs an answer
     from her, an ask, a read, a spot check, a confirm, play stops itself and says so. It is a
     soundtrack for the turns, never an autopilot for the thinking. */
  /* FOLLOW ALONG TEMPO. She is turning a real cube with her hands, so the gap between moves has
     to be long enough to actually do one. Two rates, no slider: normal, and a bit quicker once
     she knows the chant by heart. */
  var PLAY_GAP = { step: 1600, move: 850 };
  function playGap(kind) { return Math.round(PLAY_GAP[kind] / (app.playRate || 1)); }
  function loadRate() {
    var v = parseInt(storeGet('playrate'), 10);
    return (v === 2) ? 2 : 1;
  }
  function setRate(r) {
    app.playRate = (r === 2) ? 2 : 1;
    storeSet('playrate', String(app.playRate));
    render();
  }
  var GLYPH = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,4 20,12 7,20"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>',
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="18,4 8,12 18,20"/><rect x="4" y="4" width="3" height="16" rx="1.2"/></svg>',
    fwd: '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6,4 16,12 6,20"/><rect x="17" y="4" width="3" height="16" rx="1.2"/></svg>'
  };
  /* who is stepping moves right now. Same order the stepper itself resolves them in. */
  function playerOwner() {
    if (app.setup) return 'setup';
    if (app.drill) return 'chant';
    if (app.guide) return 'guide';
    if (app.plan) return 'solve';
    return null;
  }
  /* the one thing the player is not allowed to walk past: a question only she can answer */
  function playerBlocked() {
    var o = playerOwner();
    if (app.awaitMove) return false;
    if (o === 'solve') {
      /* ONLY A QUESTION STOPS IT. "I did it" was never information, it was a tax: the app
         cannot see her cube either way, so pressing forward IS her saying she has done it.
         What it genuinely cannot guess is what her cube SHOWS, and that is where it stops. */
      return app.askState === 'asking' || app.askState === 'askingAfter';
    }
    if (o === 'guide') {
      var n = guideNode();
      return !!(n && (n.ask || n.end) && app.guideAsk);
    }
    if (o === 'setup') return !!app.setup.done;
    return false;
  }
  function playerWaitWords() {
    if (playerOwner() === 'setup') return 'All set up';
    return 'Your turn: answer to continue';
  }
  /* a step's own demonstration may not have been kicked off yet. That is a gap to wait through,
     not a reason to stop: stopping there would look like the player had died. */
  function playerPending() {
    if (playerOwner() !== 'guide') return false;
    var n = guideNode();
    return !!(n && n.moves.length && !app.units.length && !app.guideAsk);
  }
  function playerCanFwd() {
    var o = playerOwner();
    if (!o) return false;
    /* MID SMOOTH GO THE ARROW STAYS LIVE. A greyed out arrow cannot park a tap, and parking the
       tap is the whole point: she asks to move on, the chant still finishes, nothing is cut in
       half. Every other kind of move keeps the arrow greyed while it is flying, as before. */
    if (app.busy) return unitsAreRuns();
    if (app.awaitMove) return app.moveAt < app.units.length;
    if (playerBlocked()) return false;
    if (o === 'solve') return !!beat();
    if (o === 'guide') { var n = guideNode(); return !!(n && n.to); }
    return false;
  }
  function playerCanBack() {
    var o = playerOwner();
    if (!o || app.busy) return false;
    if (o === 'solve') return app.idx > 0 || app.awaitDemo || app.awaitMove;
    if (o === 'guide') return app.guide.stack.length > 0;
    if (o === 'setup') return app.moveAt > 0;
    if (o === 'chant') return !!app.chantUndo;
    return false;
  }
  /* where she is, in her words */
  function playerPos() {
    var o = playerOwner();
    /* a chant she knows is a go, not a move: counting moves is the very thing mastery retires */
    if (app.awaitMove && app.units.length && unitsAreRuns()) {
      return { big: 'Go ' + app.moveAt + ' of ' + app.units.length, small: 'one smooth go each' };
    }
    if (app.awaitMove && app.units.length) {
      return { big: 'Move ' + app.moveAt + ' of ' + app.units.length, small: 'one turn at a time' };
    }
    if (o === 'solve' && app.plan) {
      var left = planMoves(app.plan, app.idx);
      return { big: 'Step ' + Math.min(app.idx + 1, app.plan.beats.length) + ' of ' + app.plan.beats.length,
               small: left + ' moves to go' };
    }
    if (o === 'guide') {
      var n = guideNode();
      return { big: 'Step ' + (n ? n.phase : 1) + ' of ' + (big() ? 8 : 3), small: 'you tell me what you see' };
    }
    if (o === 'setup') return { big: 'Setting up', small: app.units.length + ' turns' };
    if (o === 'chant') return { big: C.CHANTS[app.drill.id].name, small: app.drill.moves.length + ' moves' };
    return { big: '', small: '' };
  }
  /* one step on, in whatever is stepping */
  function playerFwd() {
    var o = playerOwner();
    /* mid smooth go the tap is parked, not thrown away, and never lands halfway through a chant */
    if (o && app.busy && unitsAreRuns()) { app.fwdQueued = true; return; }
    if (!o || app.busy) return;
    if (app.awaitMove) { playUnit(true); return; }
    if (playerBlocked()) return;
    /* forward on a finished move means "done, next": no separate tap to say so */
    if (o === 'solve') { if (app.awaitDemo) { beatDone(beat()); return; } advance(); return; }
    if (o === 'guide') { guideNext(); return; }
  }
  /* one step back, on the snapshots that are already proved to restore byte for byte */
  function playerBack() {
    var o = playerOwner();
    if (!o || app.busy) return;
    /* mid play, Back pauses first: she asked to take the wheel */
    if (app.playing) playerPause(false);
    if (o === 'solve') { goBack(); return; }
    if (o === 'guide') { guideBack(); return; }
    if (o === 'setup') { setupBack(); return; }
    if (o === 'chant') { undoChant(); return; }
  }
  function playerPlay() {
    if (!playerOwner() || app.playing) return;
    if (playerBlocked()) { app.playMsg = playerWaitWords(); render(); return; }
    app.playing = true; app.playMsg = null; app.playWait = 0;
    /* the bar is already on the screen, so flipping play to pause is a text swap like any other:
       a full rebuild here was the one panel teardown left during a run */
    renderStep();
    playerStep();
  }
  function playerPause(waiting) {
    app.playing = false;
    app.playMsg = waiting ? playerWaitWords() : null;
    render();
  }
  /* The beat of the player: one move, breathe, one move, and stop the moment she is needed.
     ONE LOOP, and it either moves the cube on, waits, or pauses out loud. It may never simply
     stop with the play button still lit, because that looks exactly like the app has died. */
  function playerWhere() {
    return app.idx + '/' + app.moveAt + '/' + (app.guide ? app.guide.id : '') + '/' + (app.setup ? app.setup.done : '');
  }
  function playerStep() {
    if (!app.playing) return;
    if (app.busy || playerPending()) {
      /* something is mid flight. Wait for it, but not for ever: if nothing has moved for a good
         few seconds the run is stuck, and stopping honestly beats spinning in silence. */
      if (++app.playWait > 90) { playerPause(false); return; }
      setTimeout(playerStep, 120);
      return;
    }
    app.playWait = 0;
    if (playerBlocked()) { playerPause(true); return; }
    if (!playerCanFwd()) { playerPause(false); return; }
    /* between the moves of one chant, a short beat. Crossing from one step to the next, a
       proper breath, because that is where she has to catch her cube up with mine. */
    var slow = !app.awaitMove, was = playerWhere();
    playerFwd();
    /* a forward that changed nothing means the run has nowhere left to go */
    if (playerWhere() === was && !app.busy) { playerPause(false); return; }
    setTimeout(playerStep, playGap(slow ? 'step' : 'move'));
  }
  function transportBar() {
    var o = playerOwner();
    if (!o) return '';
    var pos = playerPos(), waiting = playerBlocked();
    return '<div class="player' + (waiting ? ' waiting' : '') + '" id="livePlayer" style="margin-bottom:12px">'
      + '<button type="button" id="pbBack" data-act="player-back" title="Step back" aria-label="Step back"'
      + (playerCanBack() ? '' : ' disabled') + '>' + GLYPH.back + '</button>'
      + '<button type="button" class="go" id="pbGo" data-act="' + (app.playing ? 'player-pause' : 'player-play') + '"'
      + ' title="' + (app.playing ? 'Pause' : 'Play') + '" aria-label="' + (app.playing ? 'Pause' : 'Play') + '"'
      + ((app.playing || playerCanFwd()) ? '' : ' disabled') + '>' + (app.playing ? GLYPH.pause : GLYPH.play) + '</button>'
      + '<button type="button" id="pbFwd" data-act="player-fwd" title="Step forward" aria-label="Step forward"'
      + (playerCanFwd() ? '' : ' disabled') + '>' + GLYPH.fwd + '</button>'
      + '<button type="button" class="rate" data-act="player-rate" title="How fast" aria-label="How fast">'
      + (app.playRate === 2 ? '2x' : '1x') + '</button>'
      + '<span class="pos"><span id="livePosBig">' + esc(pos.big) + '</span>'
      + '<small id="livePosSmall">' + esc(waiting ? playerWaitWords() : (app.playMsg || pos.small)) + '</small></span>'
      + '</div>';
  }
  /* ===== PLAYER END ===== */

  /* ---------------------------------------------------------------- panels */
  /* The instruction lives in a frame that never changes shape. During playback only the words
     inside it are swapped, so the card cannot grow or shrink under her thumb. */
  function liveWhyText() { return app.guide ? (app.guideWhy || '') : ((beat() && beat().why) || ''); }
  function sayBox() {
    if (!app.says) return '';
    var wt = liveWhyText();
    return '<div class="say ' + app.sayKind + '" id="liveSay">'
      + '<span class="head" id="liveSayHead"' + (app.sayHead ? '' : ' hidden') + '>' + esc(app.sayHead || '') + '</span>'
      + '<span id="liveSayBody">' + app.says + '</span>'
      + '<div class="why" id="liveWhy"' + (wt ? '' : ' hidden') + '>' + esc(wt) + '</div></div>';
  }
  /* the tutorial line: always visible, never a thing she has to go looking for */
  /* The reason, always on the screen, never with a heading in front of it. One function, so
     there is nowhere for a preamble to creep back in. */
  function reasonLine(text) { return text ? '<div class="why">' + esc(text) + '</div>' : ''; }
  function whyLine(b) { return (b && b.why) ? reasonLine(b.why) : ''; }
  function badgeShelf() {
    return '<div class="card"><h2>Badges</h2><div class="badges">'
      + badgeList().map(function (b) { return '<span class="badge' + (app.badges[b.id] ? ' won' : '') + '">' + esc(b.name) + '</span>'; }).join('')
      + '</div><div class="lede" style="margin-top:6px">Every badge is a thing you did without me.</div></div>';
  }
  function sizeCard() {
    return '<div class="card"><h2>Which cube are we on?</h2><div class="lede">'
      + (big()
        ? 'The big cube: 26 blocks, eight steps, six chants. The middle squares never move, so they tell you where everything belongs.'
        : 'The small cube: 8 corner blocks, three steps, two chants. Start here, then move up when the 2x2 Solver badge is yours.')
      + '</div><div class="row" style="margin-top:8px">'
      + '<button class="btn' + (app.size === 2 ? ' primary' : '') + '" data-size="2">Small cube, 2x2</button>'
      + '<button class="btn' + (app.size === 3 ? ' primary' : '') + '" data-size="3">Big cube, 3x3</button></div></div>';
  }
  function entryCard() {
    return '<div class="card" style="border-width:3px">'
      + '<h2>I already made a side!</h2>'
      + '<div class="lede">Made a whole white side on your own? Brilliant. Show me your cube exactly as it is, do not fix anything first, and I will tell you how close you are.</div>'
      + '<div class="row" style="margin-top:8px"><button class="btn primary big" data-act="side">Show me my cube</button></div></div>';
  }

  function panelPlay() {
    var h = sizeCard() + entryCard();
    h += '<div class="card"><h2>Free play</h2><div class="lede">Press any move button and watch it happen. Nothing you press can break it.</div>'
      + '<div class="row" style="margin-top:9px"><span class="tag">Mess it up</span>'
      + [3, 5, 10, 25].map(function (n) { return '<button class="btn" data-scr="' + n + '">' + n + ' turns</button>'; }).join('')
      + '</div><div class="row" style="margin-top:8px">'
      + '<button class="btn" data-act="undo">Undo</button>'
      + '<button class="btn" data-act="reset">Start from solved</button>'
      + '<button class="btn" data-act="cubesays">Play Cube Says</button></div></div>';
    h += sayBox();
    h += chantShelf();
    h += '<div class="card"><h2>Cube Says</h2><div class="lede">I call a move in words. You find the right button. 5 in a row and the badge is yours.</div></div>';
    h += badgeShelf();
    return h;
  }

  /* ------------------------------------------------ the turn between the two pictures
     ONE TRUTH. These three named turns are what the words say, what the Show me button
     animates, and what the second picture draws. Proved in the gate for both cube sizes:
     after them the ceiling shows the side that was at the floor, the side looking at you is
     the one that was on your left, and your right shows the side that was facing away.
     The side that WAS looking at you goes round to your left, and the side that was at the
     ceiling goes to the floor. Those two are the anchors she checks her hold against. */
  var HOLD_TURNS = ['x', 'x', 'yp'];
  var HOLD_STEPS = [
    'Tip the whole cube away from you. <b>The side that was looking at you is at the ceiling now.</b>',
    'Tip it away again. <b>The side that was at the floor is at the ceiling now.</b>',
    'Spin the cube flat to your right, once. <b>The side that was on your left is looking at you now.</b>'
  ];
  /* the squares the words name by colour, and the one square she has to tap */
  function holdSpec() {
    if (big()) {
      return {
        tap: C3.WHERE_N[C3.F], floor: C3.WHERE_N[C3.U], need: [C3.WHERE_N[C3.F], C3.WHERE_N[C3.U]],
        q: 'Look at the side that is on your left now. What colour is its middle square? Tap it.',
        needMsg: 'I need two middle squares coloured in on the first picture before I can check your hold: the one looking at you and the one at the ceiling. They are ringed.'
      };
    }
    return {
      tap: C.WHERE[5][2], ring: C.WHERE[0].slice(), need: C.WHERE[0].concat([C.WHERE[5][2]]),
      q: 'Look at the side that is on your left now. What colour is its square up at the ceiling, nearest you? Tap it.',
      needMsg: 'I need the ringed block coloured in on the first picture, all three of its squares, and the square at the bottom left of the side looking at you. They are ringed.'
    };
  }
  function holdAnchorLine(spec) {
    if (big()) {
      return app.paint[spec.floor]
        ? 'Check as you go: the <b>' + esc(app.paint[spec.floor]) + '</b> middle square you painted at the ceiling is down at the floor now.'
        : '';
    }
    var cols = spec.ring.map(function (s) { return app.paint[s]; });
    if (cols.some(function (c) { return !c; })) return '';
    return 'Check as you go: the block you painted at your working corner, the <b>' + esc(cols[0]) + '</b>, <b>'
      + esc(cols[1]) + '</b> and <b>' + esc(cols[2]) + '</b> one, is down at the floor now, away from you and on your left.';
  }
  function holdCard() {
    var spec = holdSpec(), missing = spec.need.filter(function (s) { return !app.paint[s]; });
    app.holdNeed = app.holdOk ? [] : missing;
    if (app.holdOk) {
      return '<div class="card" style="border-color:#009e60"><h2 style="color:#009e60">Hold checked</h2>'
        + '<div class="lede">Your cube is turned the right way round, so the second picture is unlocked. Paint the three new sides.</div>'
        + '<div class="row" style="margin-top:8px"><button class="btn" data-act="showturn">Show me that turn again</button></div></div>';
    }
    var h = '<div class="card" style="border-width:3px;border-color:' + RED + '">'
      + '<h2>Turn your cube for the second picture</h2>'
      + '<div class="lede">One move at a time. Say each one out loud as you do it.</div>'
      + '<ol class="turnsteps">' + HOLD_STEPS.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>';
    var anchor = holdAnchorLine(spec);
    if (anchor) h += '<div class="say" style="margin-top:9px">' + anchor + '</div>';
    h += '<div class="row" style="margin-top:9px"><button class="btn primary big" data-act="showturn">Show me that turn</button></div>';
    if (missing.length) {
      h += '<div class="say oops" style="margin-top:9px"><span class="head">Two squares first</span>' + esc(spec.needMsg) + '</div>';
    } else {
      h += '<div class="holdq">' + esc(spec.q) + '</div>'
        + '<div class="swatches" style="margin-top:7px">'
        + C.COLOURS.map(function (c) { return '<button class="swatch" data-hold="' + c + '" title="' + c + '"style="background:' + HEX[c] + '"></button>'; }).join('')
        + '</div>';
    }
    if (app.holdMsg) {
      h += '<div class="say ' + (app.holdMsg.ok ? 'good' : 'oops') + '" style="margin-top:9px"><span class="head">'
        + (app.holdMsg.ok ? 'Yes' : 'Nearly') + '</span>' + esc(app.holdMsg.text) + '</div>';
    }
    return h + '</div>';
  }
  function answerHold(col) {
    var spec = holdSpec(), want = app.paint[spec.tap];
    if (!want) return;
    if (col === want) {
      app.holdOk = true;
      app.holdMsg = { ok: true, text: 'That is the one. Your cube is held exactly right, so the second picture matches the sides you can see. Paint away.' };
      render();
      return;
    }
    app.holdMsg = { ok: false, text: 'Not that one, so the cube is not turned the way I need it yet. Watch the turn once more, then look again at the side on your left.' };
    render();
    demoTurnOver();
  }

  /* ------------------------------------------------ working out the sides she cannot see
     Three sides never pin the cube down on their own: on the big cube there are thousands of
     legal cubes that agree with them, on the small cube about ten. So we ask her to look at
     one square at a time, always the square that splits the possibilities most evenly, and we
     only fill anything in when exactly one cube is left. A wrong silent completion is the one
     thing we never do, so a cut short candidate list can never count as one. */
  var DIR_WORD = ['at the ceiling', 'on your right', 'nearest you', 'at the floor', 'on your left', 'away from you'];
  var LOOK_WORD = ['looking at the ceiling', 'looking to your right', 'looking at you', 'looking at the floor', 'looking to your left', 'looking away from you'];
  var DIR_RANK = [0, 2, 1, 0, 2, 1];
  function blockWords(pc) {
    if (pc.kind === 'n') return 'the middle square ' + DIR_WORD[pc.slot];
    var faces = (pc.kind === 'e' ? C.EHOME : C.HOME)[pc.slot].slice();
    faces.sort(function (a, b) { return DIR_RANK[a] - DIR_RANK[b]; });
    return (pc.kind === 'e' ? 'the 2 square block ' : 'the corner block ') + faces.map(function (f) { return DIR_WORD[f]; }).join(', ');
  }
  function askWords(sid) {
    var pc = INFER.pieceOf(C, sid), sids = INFER.blockSids(C, pc), known = [], i;
    if (pc.kind === 'n') return { find: 'Find ' + blockWords(pc) + ' on your cube.', ask: 'What colour is it?' };
    for (i = 0; i < sids.length; i++) { if (sids[i] !== sid && app.paint[sids[i]]) known.push(app.paint[sids[i]]); }
    var find = 'Find ' + blockWords(pc) + '.';
    if (known.length === 1) find += ' You painted its other square ' + known[0] + '.';
    else if (known.length > 1) find += ' You painted its other squares ' + known.join(' and ') + '.';
    return { find: find, ask: 'What colour is its square ' + LOOK_WORD[pc.face] + '?' };
  }
  /* the pictures themselves, the ring rule and the little inset all live in the VIEWS block
     above, so the gate can pull them out whole and prove the ring lands on the asked square */
  /* ---------------------------------------------------------------- why a painting was refused
     "It cannot exist" is never allowed to be the whole answer. There are only two honest
     reasons, and they are checked in this order.
     ONE: the standing rule is wrong. She told me white is at the floor, and it is not, so I have
     been forcing white into squares she never painted. An adversarial sweep of a thousand real
     cubes found this is the ONLY thing that was ever falsely rejecting a genuine cube.
     TWO: some of her squares really do contradict each other, in which case I owe her the
     SMALLEST set of squares that still cannot all be right, and a ring round each of them. */
  function conflictFree(list) {
    var n = INFER.stickerCount(C), probe = new Array(n).fill(null), k;
    for (k = 0; k < list.length; k++) probe[list[k]] = app.paint[list[k]];
    var r = INFER.completions(C, probe, { cap: 1, budget: 900 });
    /* only a complete search that found nothing counts as a contradiction */
    return r.capped || r.count > 0;
  }
  function minimalConflict() {
    var n = INFER.stickerCount(C), sids = [], i;
    for (i = 0; i < n; i++) { if (app.paint[i]) sids.push(i); }
    if (conflictFree(sids)) return [];
    var keep = sids.slice();
    /* drop one square at a time: whatever is still impossible without it was never the problem */
    for (i = 0; i < sids.length; i++) {
      var trial = keep.filter(function (x) { return x !== sids[i]; });
      if (!conflictFree(trial)) keep = trial;
    }
    return keep;
  }
  function diagnoseReject() {
    if (app.whiteDown && conflictFree(paintedSids())) return { kind: 'whitedown' };
    return { kind: 'squares', set: minimalConflict() };
  }
  function paintedSids() {
    var n = INFER.stickerCount(C), out = [], i;
    for (i = 0; i < n; i++) { if (app.paint[i]) out.push(i); }
    return out;
  }
  function noteReject() {
    var d = diagnoseReject();
    app.rejectKind = d.kind;
    if (d.kind === 'whitedown') {
      app.paintSuspects = floorSids();
      app.inferMsg = { ok: false, text: 'You told me white is at the floor, but the squares you have painted say it is not. Is white really at the floor?' };
    } else {
      app.paintSuspects = d.set;
      app.inferMsg = { ok: false, text: d.set.length
        ? 'These ringed squares cannot all be right. One of them is not the colour it looks like. Have another look at just those.'
        : 'Something in your painting does not add up yet. Have another look, or start again.' };
    }
  }
  function inferRun() {
    var known = effPaint();
    var res = INFER.completions(C, known, { cap: 400, budget: 4000 });
    /* Anything every remaining cube agrees on is not a guess, it is a fact. Pin whole settled
       sides before asking anything, so she is never asked about a square we already know.
       One pass only, and only ever on a complete list. */
    var guard = 0;
    while (guard++ < 6 && pinSolid(res).length) {
      known = effPaint();
      res = INFER.completions(C, known, { cap: 400, budget: 4000 });
    }
    app.inferRes = res;
    app.inferQ = null; app.inferSpot = null;
    if (!res.capped && res.count === 0) {
      noteReject();
      render(); return;
    }
    app.rejectKind = null;
    if (!res.capped && res.count === 1) {
      var full = res.list[0].stickers, before = app.paint.slice(), filled = [], declared = [], i;
      /* What SHE told me, as against what I worked out. A square that is only white because she
         said white is at the floor proves nothing: checking it reads her own words back to her.
         Those squares are ruled out of the spot check before anything else happens. */
      for (i = 0; i < full.length; i++) { if (!before[i] && known[i]) declared.push(i); }
      for (i = 0; i < full.length; i++) { if (!app.paint[i]) { app.paint[i] = full[i]; filled.push(i); } }
      app.inferFilled = filled;
      app.holdOk = true;
      savePaint();
      var spot = pickSpot(filled, declared, before);
      app.inferSkip = null; app.inferSpot = null;
      if (spot === null) {
        app.inferSkip = 'Nothing left to check. Your painting'
          + (app.whiteDown ? ' plus white at the floor' : '') + ' decides everything.';
      } else {
        app.inferSpot = { sid: spot, colour: app.paint[spot] };
      }
      app.inferMsg = null;
      render(); return;
    }
    /* only ask about a square we can point at by the colours round it: place words do not
       survive the tip she has to make to see it */
    app.inferQ = INFER.bestQuestion(C, known, res.list, { nameable: canNameByColour });
    app.inferAsked = (app.inferAsked || 0) + 1;
    app.inferMsg = null;
    render();
  }
  /* The spot check has one job: catch a painting that is wrong. So it must point at a square
     the ENGINE decided, never one she declared, and it prefers a square on a block she painted
     part of with her own hands, because that is the one she can find and check in a second.
     If every worked out square came from a declaration there is nothing worth asking, and the
     honest thing is to say so and get on with it. */
  function pickSpot(filled, declared, before) {
    var pool = filled.filter(function (s) { return declared.indexOf(s) < 0; }), i, pc;
    if (!pool.length) return null;
    for (i = 0; i < pool.length; i++) {
      pc = INFER.pieceOf(C, pool[i]);
      if (pc.kind === 'c' && INFER.findable(C, before, pool[i])) return pool[i];
    }
    for (i = 0; i < pool.length; i++) { if (INFER.findable(C, before, pool[i])) return pool[i]; }
    return pool[0];
  }
  function inferAnswer(colour) {

  function inferSpotYes() {

  }
  function inferSpotFix() {

       keep her correction, and start asking again */
    var spot = app.inferSpot, filled = app.inferFilled || [], i;
    for (i = 0; i < filled.length; i++) { if (filled[i] !== spot.sid) app.paint[filled[i]] = null; }
    app.inferFilled = null;
    app.inferSpot = null;
    app.holdOk = false;
    app.inferQ = { sid: spot.sid, colours: C.COLOURS.slice(), groups: {}, worst: 0, spread: 0, easy: 1 };
    app.paint[spot.sid] = null;
    app.inferMsg = { ok: false, text: 'No problem. Tell me the real colour of that square and I will work it out again.' };
    render();
  }
  function inferCard() {
    var painted = app.paint.filter(Boolean).length, total = big() ? 54 : 24;

    /* Every question is a PEEK, asked and drawn in her own grip. The cube is never turned over

    if (app.inferSkip) {

        + '<div class="say good" style="margin-top:9px"><span class="head">Nothing to check</span>' + esc(app.inferSkip)

        + '. Is it <b>' + esc(app.inferSpot.colour) + '</b>? ' + esc(peekBack(sp)) + '</div>'
        + '<div class="row" style="margin-top:9px"><button class="btn primary big" data-act="spot-yes">Yes, that is right</button>'
        + '<button class="btn" data-act="spot-no">No, it is a different colour</button></div></div>';

    }
    if (app.inferQ) {
      var qs = app.inferQ.sid, cols = app.inferQ.colours || C.COLOURS;
      var many = app.inferRes && app.inferRes.capped ? 'Lots of' : ((app.inferRes ? app.inferRes.count : 2) + ' different');
      h += '<div class="lede">Question ' + (app.inferAsked || 1) + '.</div>'
        + reasonLine(many + ' cubes still match your painting, and this square tells them apart.')
        + '<div class="holdq" style="margin-top:8px">What colour is this square? Tap it.</div>'
        + '<div class="lede" style="margin-top:2px">' + esc(peekQuestion(qs)) + '</div>'
        + '<div class="views" style="margin-top:10px"><div class="viewbox">' + faceInset(qs, 230)
        + '<div class="cap">' + esc(peekCap(qs)) + '</div></div></div>'
        + '<div class="swatches" style="margin-top:8px">'
        + cols.map(function (c) { return '<button class="swatch" data-infer="' + c + '" title="' + c + '" style="background:' + HEX[c] + '"></button>'; }).join('')
        + '</div>'
        + '<div class="row" style="margin-top:9px"><button class="btn" data-act="infer-none">None of those</button>'
        + '<button class="btn" data-act="paint-rest">I will paint the rest myself</button></div>';
      if (app.inferMsg) h += '<div class="say ' + (app.inferMsg.ok ? 'good' : 'oops') + '" style="margin-top:9px">' + esc(app.inferMsg.text) + '</div>';
      return h + '</div>';
    }
    h += '<div class="lede">Paint the three sides you can see, then let me work out the hidden ones. If I cannot be sure, I will ask you to peek at one square at a time, keeping your grip. You have painted '
      + painted + ' of ' + total + ' squares.</div>'
      + '<div class="row" style="margin-top:9px"><button class="btn primary big" data-act="infer"' + (painted ? '' : ' disabled') + '>Work out the rest for me</button>'
      + '<button class="btn" data-act="paint-rest">I will paint the rest myself</button></div>';
    if (app.inferMsg) h += '<div class="say ' + (app.inferMsg.ok ? 'good' : 'oops') + '" style="margin-top:9px">' + esc(app.inferMsg.text) + '</div>';

  }

  /* ------------------------------------------------ I already made a side
     The finished side goes to the FLOOR before anything is painted. Every picture and every
     step from step 2 onward reads the cube that way round, so starting there means one
     mapping, fewer questions, and no silent mismatch. */
  function whiteDownPic() {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="76" height="76" aria-hidden="true">'
      + '<rect x="22" y="6" width="44" height="28" rx="7" fill="#ffffff" stroke="' + INK + '" stroke-width="2.6"/>'
      + '<line x1="44" y1="40" x2="44" y2="58" stroke="' + RED + '" stroke-width="6" stroke-linecap="round"/>'
      + '<polygon points="44,72 35,57 53,57" fill="' + RED + '"/>'
      + '<line x1="10" y1="82" x2="78" y2="82" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/></svg>';
  }
  function sideHoldCard() {
    return '<div class="card" style="border-width:3px;border-color:' + RED + '">'
      + '<h2>First, hold it with your side at the floor</h2>'
      + '<div class="row" style="align-items:flex-start;gap:14px;margin-top:6px">'
      + '<div>' + whiteDownPic() + '</div>'
      + '<div style="flex:1 1 220px;min-width:200px">'
      + '<ol class="turnsteps" style="margin-left:18px">'
      + '<li>Find the side you finished and turn the whole cube so it points at the floor. <b>White is at the floor now.</b></li>'
      + '<li>Keep it there. <b>The ceiling is the side you have not touched.</b></li>'
      + '<li>Now paint what you can see: the ceiling, the side looking at you, and your right.</li>'
      + '</ol></div></div>'
      + reasonLine('Every picture and every step from here on has white at the floor.')
      + '<div class="row" style="margin-top:10px"><button class="btn primary big" data-act="side-ready">White is at the floor</button></div>'
      + (app.sideMsg ? '<div class="say oops" style="margin-top:9px"><span class="head">Not yet</span>' + esc(app.sideMsg) + '</div>' : '')
      + '</div>';
  }

  /* Every way this panel can be drawn starts with the way out. h is built FIRST and every
     return carries it, so no painter state can ever exist without a Start again button on it. */
  function panelPaint() {
    var h = startAgainCard();
    if (app.sideHold) return h + sideHoldCard();
    var lead = app.paintIntent === 'side'
      ? 'Paint your cube exactly as it sits in your hands right now. Do not fix anything first. I want to see the side you made.'
      : 'Pick a colour, then tap squares until the picture matches the cube in your hands.';
    h += '<div class="card"><h2>Match my cube</h2><div class="lede">' + esc(lead) + '</div>'
      + '<div class="row" style="margin-top:9px"><span class="tag">Colours</span><span class="swatches">'
      + C.COLOURS.map(function (c) {
        return '<button class="swatch' + (app.paintColour === c ? ' on' : '') + '" data-col="' + c + '" style="background:' + HEX[c] + '" title="' + c + '"></button>';
      }).join('') + '</span></div>'
      /* THE DEFAULT PATH SHOWS ONE PICTURE. She paints the side she can see, and everything
         hidden is asked as a peek in that same grip. The turned over picture only appears if
         she chooses to paint the rest herself, because it is the only thing on this screen
         that speaks in a different frame. */
      + '<div class="views" style="margin-top:12px">'
      + paintView(1) + (app.paintPath === 'paint2' ? paintView(2) : '')
      + '</div>'
      + (app.paintPath === 'paint2' ? '' : '<div class="lede" style="margin-top:8px">'
        + 'Just this one picture. Keep your grip the whole time. Anything I cannot see, I will ask you to peek at.</div>')
      + '</div>';
    h += rejectCard();
    h += handoverCard();
    h += whiteFloorCard();
    h += inferCard();

      + '<div class="row"><button class="btn" data-act="fill-solved">Fill it in solved</button>'
      + '<button class="btn" data-act="fill-clear">Rub it all out</button>'
      + '<button class="btn" data-act="fill-screen">Copy the cube on screen</button></div>'
      + '<div class="row" style="margin-top:10px"><button class="btn primary big" data-act="check">This is my cube</button></div>'

  /* NO DEAD END. Every refusal names what to do next, and the squares it is talking about are

  function rejectCard() {

  function railHtml() {

  /* THE ONE SMOOTH GO CARD. A chant she knows never says move 3 of 4 again. It says its name,

  var KNOW_SHELF = 'She knows this one';

  function chantStripInner() {

  function chantStrip() { return '<div id="liveStrip">' + chantStripInner() + '</div>'; }

  /* ---------------------------------------------------------------- the chant shelf */
  function chantCard(id) {
    var c = C.CHANTS[id], d = (app.drill && app.drill.id === id) ? app.drill : null;
    var smooth = knowsChant(id);
    var at = d ? (app.chantAt === undefined ? -1 : app.chantAt) : -1;
    /* stepping per move, chantAt counts moves; in one smooth go it counts whole goes */

      + '<div style="margin-top:8px">'
      + strip(smooth ? name + '.' : name, c.moves, c.breath, lit, note, knowToggle(id, KNOW_SHELF), smooth) + '</div>'
      + '<div class="row" style="margin-top:9px">'
      + '<button class="btn primary" data-chant="' + id + '" data-times="1"' + (app.busy ? ' disabled' : '') + '>Do it once</button>';
    if (id === 'swap' || big()) {
      h += '<button class="btn" data-chant="' + id + '" data-times="2"' + (app.busy ? ' disabled' : '') + '>Do it twice</button>';
    }
    h += '<button class="btn" data-act="undochant"' + (app.busy || !app.chantUndo ? ' disabled' : '') + '>Undo chant</button></div>';
    if (id === 'swap') h += '<div class="lede" style="margin-top:7px"><b>' + esc(C.CHANT_TWICE) + '</b></div>';
    return h + '</div>';
  }
  function chantShelf() {
    var head = (app.drill ? transportBar() : '') + '<div class="card"><h2>Chant shelf</h2><div class="lede">Tap a chant and the cube does it slowly, one move at a time, from wherever it is right now. Say it out loud with the tiles. Undo puts everything back.</div></div>';
    if (big()) return head + C3.CHANT_KEYS.map(chantCard).join('');
    return head + chantCard('righty') + chantCard('swap');
  }
  /* THE CHANT SHELF USES THE ONE STEPPER TOO. It used to run its own loop and blitz the whole
     chant past her; now it is just another owner of playUnit, so it gets Move n of m, the
     player bar and the same discipline as everything else. */
  function playChant(id, times) {
    if (app.busy) return;
    var c = C.CHANTS[id];
    app.chantUndo = C.clone(app.state);
    app.drill = { id: id, chant: id, times: times, before: C.clone(app.state), mode: app.mode,
                  moves: C.chantSeq(id, times) };
    /* the shelf gets the mastery rule too: unticked is one move at a time, ticked is one go
       per time round, so Do it twice is still two goes she can count out loud */
    app.units = beatUnits(app.drill); app.moveAt = 0; app.chantAt = -1; app.awaitMove = false;
    say('<b>' + esc(c.name) + '.</b> ' + esc(c.say), '', 'Say it out loud');
    render();
    playUnit(false);
  }
  function chantUnitsDone() {
    var d = app.drill;
    app.busy = false; app.awaitMove = false; app.chantAt = -1;
    app.drill = null; app.units = []; app.moveAt = 0;
    playerPause(false);
    finishChant(d.id, d.times, d.before, d.mode);
  }

  function whiteLayerDone(s) { return big() ? C3.firstLayerDone(s) : !!C2.layerIntact(s); }
  function whiteToFloor(s) {
    if (big()) {

  }
  function lastLayerShuffle(s) {
    var alph = big()
      ? [['U'], ["U'"], ['U2'], C3.CROSS_MAKER, C3.EDGE_SPINNER, C3.CORNER_MOVER]

  /* ------------------------------------------------ Surprise me

  /* a muddle that one ceiling spin finishes is not a puzzle, it is a tease */
  function puzzleWorthIt(x) {

    return true;

  function puzzleMake(kind) {

    if (kind === 'layer') {
      /* the mastery ruling: only the last layer moves, so a finished white layer stays finished */
      var alph = big()
        ? [['U'], ["U'"], ['U2'], C3.CROSS_MAKER, C3.EDGE_SPINNER, C3.CORNER_MOVER]
        : [['U'], ["U'"], ['U2'], C2.SWAP];
      while (guard++ < 60) {
        seq = [];
        /* at least one real chant in there, or the puzzle is just a ceiling spin away from
           solved and there is nothing to practise */
        var k = 2 + Math.floor(Math.random() * 3), j, chants = 0, pickIx;
        for (j = 0; j < k; j++) {
          pickIx = (j === 0) ? 3 + Math.floor(Math.random() * (alph.length - 3))
                             : Math.floor(Math.random() * alph.length);
          if (pickIx >= 3) chants++;
          seq = seq.concat(alph[pickIx]);
        }
        st = C.applySeq(C.solved(), seq);
        if (chants > 0 && puzzleWorthIt(st)) return { seq: seq, state: st, kind: 'layer' };
      }

    }
    while (guard++ < 40) {

  /* ------------------------------------------------ Just guide me
     A script, not a plan. The method is state blind, so nothing here knows or claims to know

     her what she can see. Her answers drive the loops. Only she can say it is solved. */
  var guideCache = {};

  function guideStart() {
    var sc = guideScript();

    app.cheered = {}; app.usedShowMe = false;
    /* The guide draws on an EXAMPLE cube, so it takes the screen over. Whatever muddle was on
       there is hers and it is not the guide's to throw away, so it is put aside here and handed
       straight back when she stops. Without this a guide detour quietly destroys her cube and
       everything afterwards plans from the example instead. */
    app.guideSaved = C.clone(app.state);
    app.drill = null; app.units = []; app.moveAt = 0; app.chantAt = -1;
    app.awaitMove = false; app.playing = false; app.playMsg = null;

  function guideStop() {

    app.guideWhy = n.why || ''; app.guideChant = n.chant || null;
    app.units = []; app.moveAt = 0; app.chantAt = -1; app.awaitMove = false;
    app.guideAsk = !n.moves.length;
    if (n.world) { app.state = C.clone(n.world); clearGlow(); renderCube(); }
    if (n.end) {
      cheer(n.say);
      guideBadge(n);
    } else {
      say(n.say, n.panic ? 'panic' : '', n.panic ? 'Read this before you start' : (n.cheer || ''));
      if (n.cheer) { say(n.say, 'good', n.cheer); guideBadge(n); }
    }
    idleTile(n.title || 'Just guide me');
    render();
    speakStop();
    speakText(guideSpeech(n) + smoothTail(n));
    if (n.moves.length) setTimeout(guideDemo, 260);
  }
  /* the example cube does the move ONE AT A TIME, waiting for her between each, using the very
     same stepper the coached solve uses. A chant is never blitzed past her. */
  function guideDemo() {
    var n = guideNode();
    if (!n || !n.moves.length || app.busy) return;
    if (n.world) { app.state = C.clone(n.world); clearGlow(); renderCube(); }
    app.units = n.moves.slice(); app.moveAt = 0; app.chantAt = -1;
    /* MASTERY, in the guide as everywhere else: a chant she knows collapses to one smooth go */
    if (n.chant && knowsChant(n.chant)) app.units = beatUnits(n);
    app.awaitMove = false; app.guideAsk = false;
    playUnit(false);
  }
  function guideUnitsDone() {

  }
  /* the badges a guided solve really earns, the same ones the coached solve gives */
  function guideBadge(n) {

      if (n.cheer === 'White layer done!') win('layer3');
      if (n.cheer === 'Two layers done!') win('two3');
      if (n.cheer === 'Solved!') { win('watch3'); win('solo3'); }
    } else {
      if (n.cheer === 'White layer done!') win('layer');
      if (n.cheer === 'Yellow ceiling done!') win('yellow');
      if (n.cheer === 'Solved!') { win('watch'); win('solo'); }
    }
  }
  function guideAnswer(k) {

  /* a mis-tapped answer must never strand her: Back walks the steps she actually took */
  function guideBack() {

        + '<div class="lede">Look at YOUR cube, not mine, and tap what you can see.</div></div>';
    }

       are the extras: watch it again, start over, walk away. */
    h += '<div class="card"><div class="row">'
      + (n.moves.length ? '<button class="btn" data-act="guide-again"' + (app.busy ? ' disabled' : '') + '>Watch that again</button>' : '')
      + '<button class="btn" data-act="guide-step"' + (app.busy ? ' disabled' : '') + '>Start this step again</button>'
      + '<button class="btn" data-act="guide-stop">Stop guiding</button></div>'
      + '<div class="lede" style="margin-top:7px">Step ' + n.phase + ' of ' + (big() ? 8 : 3)
      + '. Nothing here knows what your cube looks like, so only you can say when it is done.</div></div>';

    h += badgeShelf();
