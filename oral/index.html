<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Oral Quest</title>
<style>
:root{
  --ground:#FFF7E4; --paper:#FFFFFF; --ink:#2B2540; --ink-soft:#6B6480; --line:#EADFC4;
  --accent:#F4622E; --accent-ink:#FFFFFF; --teal:#1FA9A0; --teal-soft:#D9F3F0;
  --gold:#FFC53D; --gold-soft:#FFF0C2; --plum-soft:#EFE8FF; --rose:#E85D75;
  --shadow:0 6px 0 rgba(43,37,64,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1B1826; --paper:#262238; --ink:#F4EFFF; --ink-soft:#B4ACCB; --line:#3A3550;
    --accent:#FF7A45; --accent-ink:#1B1826; --teal:#3AD1C6; --teal-soft:#1E3F3E;
    --gold:#FFC53D; --gold-soft:#4A3A12; --plum-soft:#332C4E; --rose:#FF7E93;
    --shadow:0 6px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#1B1826; --paper:#262238; --ink:#F4EFFF; --ink-soft:#B4ACCB; --line:#3A3550;
  --accent:#FF7A45; --accent-ink:#1B1826; --teal:#3AD1C6; --teal-soft:#1E3F3E;
  --gold:#FFC53D; --gold-soft:#4A3A12; --plum-soft:#332C4E; --rose:#FF7E93;
  --shadow:0 6px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5;padding-block:0 48px;padding-inline:16px}
h1,h2,h3,.display{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;min-height:44px}
html{-webkit-text-size-adjust:100%}
/* iPad: one tap is one tap, never the double-tap zoom wobble */
button,.tab,.chip,.check,.quest,.sitelinks a,summary{touch-action:manipulation;-webkit-tap-highlight-color:rgba(31,169,160,.28)}
.chip{min-height:44px;display:inline-flex;align-items:center}
.sitelinks{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px}
.sitelinks a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink-soft);text-decoration:none;font-weight:800;font-size:.8rem;letter-spacing:.06em}
.sitelinks a:active{transform:translateY(2px)}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.5rem}
.brand small{display:block;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.starbank{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border:2px solid var(--gold);border-radius:999px;padding:6px 14px 6px 10px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.starbank svg{width:24px;height:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-block:8px 18px}
.tab{flex:1 1 120px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 12px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);transition:transform .12s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tab:active{transform:translateY(3px);box-shadow:none}
.tab .dot{width:12px;height:12px;border-radius:50%;background:var(--teal);flex:none}
.tab[data-m="warm"] .dot{background:var(--rose)}
.tab[data-m="read"] .dot{background:var(--teal)}
.tab[data-m="talk"] .dot{background:var(--gold)}
/* stage */
.stage{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.eyebrow{font-weight:800;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.stage h2{font-size:1.7rem;margin-bottom:6px}
.lead{color:var(--ink-soft);margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 20px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:1.1rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:var(--plum-soft);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.08)}
.btn.teal{background:var(--teal);color:#fff}
.btn.small{padding:8px 14px;font-size:.95rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
/* home */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:8px}
.quest{border:2px solid var(--line);border-radius:18px;padding:16px;background:var(--ground);display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);font-family:inherit}
.quest .display{font-size:1.25rem}
.quest p{margin:0;color:var(--ink-soft);font-size:.95rem}
.quest .prog{margin-top:auto;padding-top:8px;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.tips{margin-top:20px;border-top:2px dashed var(--line);padding-top:16px}
.tips h3{font-size:1.1rem;margin-bottom:8px}
.tips ul{margin:0;padding-left:20px;color:var(--ink-soft)}
.tips li{margin-bottom:4px}
/* passage */
.passage{font-size:1.45rem;line-height:1.75;margin:16px 0;padding:18px 22px;background:var(--ground);border-radius:18px;border:2px solid var(--line)}
.passage p{margin:0 0 .9em}
.passage p:last-child{margin-bottom:0}
.passage .title{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:1.6rem;display:block;margin-bottom:.4em}
.hints .pause{display:inline-block;width:.35em;height:.35em;border-radius:50%;background:var(--teal);margin:0 .12em 0 .05em;vertical-align:middle}
.hints .stop{display:inline-block;width:.55em;height:.55em;border-radius:3px;background:var(--accent);margin:0 .2em 0 .08em;vertical-align:middle}
.hints .q{color:var(--rose);font-weight:800}
.hints .say{background:var(--plum-soft);border-radius:6px;padding:0 4px}
.hints .big{font-weight:800;color:var(--accent)}
.timer{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:2.4rem;font-variant-numeric:tabular-nums;line-height:1;min-width:110px}
.timer.warn{color:var(--accent)}
.ring{display:flex;align-items:center;gap:14px;padding:10px 0}
.label{font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--ink-soft);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* rubric */
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.check{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--ground);text-align:left;font-family:inherit;color:var(--ink);display:flex;gap:10px;align-items:flex-start;transition:border-color .12s}
.check .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink-soft);flex:none;display:grid;place-items:center;margin-top:2px}
.check[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.check[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal);color:#fff}
.check b{display:block;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;font-size:1.05rem}
.check small{color:var(--ink-soft);font-size:.85rem;line-height:1.35;display:block}
/* stimulus */
.stim{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--ground);margin:12px 0}
.stim svg{display:block;width:100%;height:auto;max-width:100%}
.qcard{background:var(--gold-soft);border:2px solid var(--gold);border-radius:18px;padding:16px 18px;margin:14px 0}
.qcard .who{font-weight:800;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.qcard .qtext{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;font-size:1.45rem;line-height:1.35}
.helpers{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:2px solid var(--teal);background:var(--teal-soft);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem}
.steps{display:flex;gap:6px;margin:8px 0 2px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--gold)}
.steps i.done{background:var(--teal)}
/* warm-up */
.dice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.die{border:2px solid var(--line);border-radius:18px;padding:18px;background:var(--ground);text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.die .display{font-size:1.4rem}
.die.feel{background:var(--plum-soft)}
.twister{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:500;font-size:1.5rem;line-height:1.4;padding:16px 20px;background:var(--ground);border:2px solid var(--line);border-radius:18px;margin:12px 0}
.twister small{display:block;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
/* stars reward */
.stars{display:flex;gap:6px;margin:10px 0}
.stars button{background:none;border:0;padding:4px}
.stars svg{width:46px;height:46px;fill:var(--line);stroke:var(--ink-soft);stroke-width:1.2;transition:transform .15s,fill .15s}
.stars button[aria-pressed="true"] svg{fill:var(--gold);stroke:#B8860B;transform:scale(1.12)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);padding:12px 22px;border-radius:999px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-weight:600;font-size:1.15rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem;border:2px solid var(--line);color:var(--ink-soft)}
.badge.won{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
details.parent{margin-top:16px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--ground)}
details.parent summary{cursor:pointer;font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
details.parent ul{margin:8px 0 0;padding-left:20px;color:var(--ink-soft);font-size:.95rem}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.stage{padding:18px 16px}.passage{font-size:1.3rem;padding:14px 16px}.dice{grid-template-columns:1fr}.brand h1{font-size:1.3rem}}
</style>
</head>

<div class="wrap">
  <nav class="sitelinks" aria-label="Other apps">

  <div class="tabs" role="tablist">

  <div class="stage" id="stage"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- CONTENT ---------- */
const PASSAGES = [
{title:"The Lost Kitten", text:[
"On Saturday morning, Mei Ling heard a tiny sound outside her flat. \"Meow! Meow!\" She opened the door and found a small grey kitten shivering on the doormat.",
"\"Oh, you poor thing!\" she said softly. \"Where is your mummy?\"",
"Mei Ling wrapped the kitten in a warm towel and gave it a saucer of milk. Then she made a poster and stuck it on the notice board downstairs. That evening, an old man knocked on her door. \"Thank you for finding Snowy,\" he said with a big smile. Mei Ling felt proud, but a little sad too."]},
{title:"Sports Day Surprise", text:[

{title:"Grandma's Kueh", text:[
"Every Sunday, Grandma makes ondeh-ondeh in her small kitchen. \"Come and help me, Wei Jie,\" she calls. \"Wash your hands first!\"",

{title:"A Trip to the Zoo", text:[

"\"Look at its long neck!\" she whispered to her partner, Lucas. \"It is taller than our classroom!\"",
"At the elephant show, one elephant sprayed water with its trunk. Some of the water splashed onto Mrs Lim's shoes. Everyone giggled, and even Mrs Lim laughed. On the bus home, Devi wrote in her journal: \"Today I learnt that animals need us to protect their homes. I want to be a zookeeper when I grow up.\""]},
{title:"The Broken Robot", text:[
"Ethan's little brother, Jayden, had borrowed his favourite toy robot without asking. Now the robot's arm was broken. Ethan was furious.",
"\"Why did you touch my things?\" he shouted. Jayden's eyes filled with tears. \"I'm sorry,\" he sobbed. \"I only wanted to play with you.\"",
"Ethan took a deep breath. He remembered how lonely he had felt when he was five. Slowly, he picked up the robot. \"Let's fix it together,\" he said. They found some glue in the drawer. An hour later, the robot's arm was as good as new, and the two brothers were laughing again."]}

const READ_RUBRIC = [
 {k:"clear", t:"Clear words", s:"Every word said fully, ending sounds too (walked, cats)."},
 {k:"pause", t:"Punctuation pauses", s:"Short pause at commas, longer stop at full stops."},
 {k:"express", t:"Expression", s:"Voice changes for ? ! and for characters speaking."},
 {k:"pace", t:"Steady pace", s:"Not too fast, not too slow, no rushing at the end."}
];

const STIMULI = [
{title:"Reading Week Poster", svg:posterReading, qs:[
 {q:"Look at the poster. What is it about, and what can you see?", h:["This poster is about…","I can see… and…","The words on the poster say…"]},
 {q:"Do you enjoy reading? Tell me about a book you like.", h:["Yes, I enjoy reading because…","My favourite book is… It is about…","I like it because…"]},
 {q:"Some children say reading is boring. What would you say to them?", h:["I would tell them that…","Reading helps us to…","For example,…"]}]},
{title:"Return Your Tray Poster", svg:posterTray, qs:[

 {q:"Have you ever seen someone leave a mess in the canteen? What happened?", h:["Yes, once I saw…","The cleaner had to…","I felt… because…"]},
 {q:"Why is it important to keep our canteen clean?", h:["It is important because…","If we do not, …","Everyone should… so that…"]}]},
{title:"The Playground", svg:scenePlayground, qs:[
 {q:"Tell me what is happening in this picture.", h:["In this picture, I can see…","Some children are… while…","One child is… She looks…"]},
 {q:"Have you ever felt left out? What did you do?", h:["Yes, once I…","I felt… because…","Then I decided to…"]},
 {q:"If you were at this playground, what would you do about the girl on the bench? Why?", h:["If I were there, I would…","I would say…","This is because…"]}]},
{title:"Save Water Poster", svg:posterWater, qs:[
 {q:"What does this poster want us to do? What do you notice?", h:["This poster wants us to…","I notice that…","The tap is… and the drop is…"]},
 {q:"How do you save water at home? Give me an example.", h:["At home, I save water by…","For example, when I…","My mother also…"]},
 {q:"What might happen if everyone wasted water?", h:["If everyone wasted water, …","There might not be enough water for…","So we should…"]}]},
{title:"Healthy Eating Poster", svg:posterFruit, qs:[

 {q:"What do you usually eat for breakfast? Is it healthy?", h:["For breakfast, I usually eat…","I think it is / is not healthy because…","Sometimes I also…"]},
 {q:"Why do you think some children prefer fast food? What would you tell them?", h:["Some children prefer fast food because…","But too much fast food can…","I would tell them to…"]}]}
];

const TALK_RUBRIC = [
 {k:"full", t:"Full sentences", s:"Answered in complete sentences, not one word."},
 {k:"detail", t:"Gave details", s:"Said what, then WHY or gave an example."},
 {k:"eye", t:"Looked up", s:"Eye contact with the examiner, sat up, spoke clearly."},
 {k:"loud", t:"Loud & clear", s:"Could be heard easily, no mumbling."}
];

const FEELINGS = ["happy","surprised","scared","sleepy","angry","excited","sad","whispering a secret"];
const LINES = ["The bus is coming!","I cannot find my water bottle.","Look at that enormous dog.","Is it time for recess yet?","My grandmother baked a cake.","The door slowly creaked open.","We are going to the beach tomorrow.","Please pass me the blue crayon."];
const TWISTERS = [
 {sound:"th sound", t:"Three thin thieves thought a thousand thoughts."},
 {sound:"th sound", t:"This, that, these and those are the things I chose."},

/* Reading Aloud */
function markup(text){
  return text.split("\n").map(p=>{
    let out="", inQ=false;
    for(const ch of p){
      if(ch==='"'){ inQ=!inQ; out+= inQ? '<span class="say">"' : '"</span>'; continue; }
      if(ch===','){ out+=',<span class="pause" title="short pause"></span>'; continue; }
      if(ch==='.'){ out+='.<span class="stop" title="stop, breathe"></span>'; continue; }
      if(ch==='?'||ch==='!'){ out+=`<span class="q">${ch}</span><span class="stop"></span>`; continue; }
      out+=esc(ch);
    }
    out=out.replace(/\b(GO|shouted|whispered|sobbed|furious|groaned|cheered|Delicious|enormous|Careful)\b/g,'<span class="big">$1</span>');
    return `<p>${out}</p>`;
  }).join("");
}

  const body=p.text.join("\n");
  stage.innerHTML=`
   <p class="eyebrow">Reading Aloud · story ${S.idx%PASSAGES.length+1} of ${PASSAGES.length} ${S.readDone[S.idx%PASSAGES.length]?"· ✓ done":""}</p>
   <h2>${esc(p.title)}</h2>
   <p class="lead" id="readLead">${S.phase==="prep"?"Get ready: read it silently. Find the full stops, the questions and who is talking. Then press Start.":S.phase==="go"?"Read aloud now. Slow, clear, with feeling.":"Examiner: tap what was done well. Each tick is a star."}</p>
   <div class="ring">
     <div class="timer" id="timer">${S.phase==="prep"?fmt(60):S.phase==="go"?"0:00":fmt(S.elapsed||0)}</div>
     <div>
       <span class="label" id="tlabel">${S.phase==="prep"?"Preparation time":S.phase==="go"?"Reading time":"Your time"}</span>
       <div class="row" style="margin-top:6px">
         ${S.phase==="prep"?`<button class="btn small ghost" id="prepBtn">Start 1-min prep</button><button class="btn small" id="goBtn">Start reading</button>`:""}
         ${S.phase==="go"?`<button class="btn small" id="stopBtn">I finished!</button>`:""}
         ${S.phase==="rate"?`<button class="btn small ghost" id="againBtn">Read again</button>`:""}
       </div>
     </div>
   </div>
   <div class="passage ${hints?"hints":""}" id="passage"><span class="title">${esc(p.title)}</span>${markup(body)}</div>
   <div class="row" style="justify-content:space-between">
     <button class="btn ghost small" id="hintBtn">${hints?"Hide reading hints":"Show reading hints"}</button>
     <div class="legend" ${hints?"":"hidden"}><span><i class="pause" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal)"></i> tiny pause</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent)"></i> stop &amp; breathe</span><span><i style="display:inline-block;width:14px;height:12px;border-radius:3px;background:var(--plum-soft)"></i> someone talking</span></div>
   </div>
   ${S.phase==="rate"?rubricHtml(READ_RUBRIC):""}
   <div class="row" style="margin-top:12px">
     <button class="btn ghost" id="prevP">◀ Story</button>
     <button class="btn ghost" id="nextP">Story ▶</button>
   </div>
   <details class="parent"><summary>For the examiner</summary><ul><li>Real exam: about 1 minute to prepare, then read the whole passage. Examiner may say "Please begin."</li><li>Common slips: dropped word endings, no pause at commas, flat voice on "?" and "!", speeding up in the last two lines.</li><li>Praise one thing first, then one thing to fix. Then read it again.</li></ul></details>`;
  const timer=stage.querySelector("#timer");
  const hb=stage.querySelector("#hintBtn"); hb.onclick=()=>{S.hints=!hints;renderRead()};
  stage.querySelector("#prevP").onclick=()=>{stopTimer();S.prepRunning=false;S.idx=(S.idx-1+PASSAGES.length)%PASSAGES.length;S.phase="prep";S.rubric={};renderRead()};
  stage.querySelector("#nextP").onclick=()=>{stopTimer();S.prepRunning=false;S.idx=(S.idx+1)%PASSAGES.length;S.phase="prep";S.rubric={};renderRead()};
  if(S.phase==="prep"){
    const pb=stage.querySelector("#prepBtn");
    const runPrep=()=>{ stopTimer(); pb.disabled=true; timer.textContent=fmt(Math.max(tLeft,0)); if(tLeft<=10)timer.classList.add("warn");
      tInt=setInterval(()=>{tLeft--; timer.textContent=fmt(Math.max(tLeft,0)); if(tLeft<=10)timer.classList.add("warn"); if(tLeft<=0){stopTimer();S.prepRunning=false;toast("Time's up. Please begin!");}},1000); };
    if(S.prepRunning && tLeft>0) runPrep();
    pb.onclick=()=>{ tLeft=60; S.prepRunning=true; timer.classList.remove("warn"); runPrep(); };
    stage.querySelector("#goBtn").onclick=()=>{ stopTimer(); S.prepRunning=false; S.phase="go"; tStart=Date.now(); renderRead(); };
  }
  if(S.phase==="go"){
    tInt=setInterval(()=>{timer.textContent=fmt(Math.floor((Date.now()-tStart)/1000))},250);
    stage.querySelector("#stopBtn").onclick=()=>{stopTimer();S.elapsed=Math.floor((Date.now()-tStart)/1000);S.phase="rate";S.rubric={};renderRead();stage.querySelector(".rubric")?.scrollIntoView({behavior:"smooth",block:"center"})};
  }
  if(S.phase==="rate"){
    stage.querySelector("#againBtn").onclick=()=>{S.prepRunning=false;S.phase="prep";S.rubric={};renderRead()};
    wireRubric(()=>{ const n=Object.values(S.rubric).filter(Boolean).length; S.readDone[S.idx%PASSAGES.length]=true; addStars(n); S.phase="prep"; S.rubric={}; S.idx=(S.idx+1)%PASSAGES.length; renderRead(); });
  }
}
function rubricHtml(R){
  return `<div class="rubric">${R.map(r=>`<button class="check" data-k="${r.k}" aria-pressed="${!!S.rubric[r.k]}"><span class="box">${S.rubric[r.k]?"✓":""}</span><span><b>${r.t}</b><small>${r.s}</small></span></button>`).join("")}</div>
  <div class="row"><button class="btn" id="award">Give stars &amp; next</button><span class="label" id="awardN">${Object.values(S.rubric).filter(Boolean).length} of ${R.length} ticked</span></div>`;
}
function wireRubric(onAward){
  stage.querySelectorAll(".check").forEach(c=>c.onclick=()=>{ const k=c.dataset.k; S.rubric[k]=!S.rubric[k]; c.setAttribute("aria-pressed",S.rubric[k]); c.querySelector(".box").textContent=S.rubric[k]?"✓":""; stage.querySelector("#awardN").textContent=`${Object.values(S.rubric).filter(Boolean).length} of ${stage.querySelectorAll(".check").length} ticked`; });
  stage.querySelector("#award").onclick=onAward;
}

/* Picture Talk */
function renderTalk(){
  const st=STIMULI[S.idx%STIMULI.length];
  const qn=Math.min(S.qi,st.qs.length);
  const rating=qn>=st.qs.length;
  const q=st.qs[Math.min(qn,st.qs.length-1)];
  stage.innerHTML=`
   <p class="eyebrow">Picture Talk · picture ${S.idx%STIMULI.length+1} of ${STIMULI.length} ${S.talkDone[S.idx%STIMULI.length]?"· ✓ done":""}</p>
   <h2>${esc(st.title)}</h2>
   <p class="lead">${rating?"Examiner: tap what was done well. Each tick is a star.":"Look carefully for 30 seconds. The examiner reads each question aloud. Answer in full sentences."}</p>
   <div class="stim">${st.svg()}</div>
   <div class="steps">${st.qs.map((_,i)=>`<i class="${i<qn?"done":i===qn?"on":""}"></i>`).join("")}</div>
   ${rating?rubricHtml(TALK_RUBRIC):`
   <div class="qcard"><div class="who">Examiner asks · question ${qn+1} of ${st.qs.length}</div><div class="qtext">${esc(q.q)}</div></div>
   <span class="label">Sentence helpers</span>
   <div class="helpers">${q.h.map(h=>`<span class="chip">${esc(h)}</span>`).join("")}</div>
   <div class="row" style="margin-top:12px">
     ${qn>0?`<button class="btn ghost" id="backQ">◀ Back</button>`:""}
     <button class="btn" id="nextQ">${qn===st.qs.length-1?"Finish & rate":"Next question ▶"}</button>
   </div>`}
   <div class="row" style="margin-top:14px">
     <button class="btn ghost small" id="prevS">◀ Picture</button>
     <button class="btn ghost small" id="nextS">Picture ▶</button>
   </div>
   <details class="parent"><summary>For the examiner</summary><ul><li>Real exam: the same picture is shown during Reading Aloud, then the teacher asks 2 to 3 questions that move from the picture to the child's own life to their opinion.</li><li>If the answer is one word, prompt: <i>"Tell me more."</i> or <i>"Why do you say that?"</i></li><li>Goal answer shape: <b>Answer → because → example</b>. Three sentences.</li><li>Do not correct mid-answer. Note it, praise first, then fix one thing.</li></ul></details>`;
  stage.querySelector("#prevS").onclick=()=>{S.idx=(S.idx-1+STIMULI.length)%STIMULI.length;S.qi=0;S.rubric={};renderTalk()};
  stage.querySelector("#nextS").onclick=()=>{S.idx=(S.idx+1)%STIMULI.length;S.qi=0;S.rubric={};renderTalk()};
  if(!rating){
    stage.querySelector("#nextQ").onclick=()=>{S.qi++;renderTalk();if(S.qi<st.qs.length)stage.querySelector(".qcard").scrollIntoView({behavior:"smooth",block:"center"});else stage.querySelector(".rubric").scrollIntoView({behavior:"smooth",block:"center"})};
    const b=stage.querySelector("#backQ"); if(b)b.onclick=()=>{S.qi--;renderTalk()};
  } else {
    wireRubric(()=>{ const n=Object.values(S.rubric).filter(Boolean).length; S.talkDone[S.idx%STIMULI.length]=true; addStars(n); S.qi=0; S.rubric={}; S.idx=(S.idx+1)%STIMULI.length; renderTalk(); window.scrollTo({top:0,behavior:"smooth"}); });
  }
}

/* ---------- BOOT ---------- */
function start(hot){
  if(hot && hot.stars!==undefined){ S=Object.assign(S,hot); }
  else if(saved){ S=Object.assign(S,saved); }
  document.getElementById("starcount").textContent=S.stars;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.m===S.mode));
  S.prepRunning=false; S.phase="prep"; render();
}
start(null);
</script>

</body>
</html>
